schema_version: trtmc.perf-suite/v2
name: release-family-performance

defaults:
  measurement:
    warmup: 3
    iterations: 10
  equivalence_margin_percent: 5.0
  baseline:
    compile_mode: default
    fullgraph: false
    dynamic: true
    timing_scope: public_operation_call_wall
    input_preparation_included: true
    asset_loading_included: false

excluded_profiles:
  - model: lfm2-1.2b
    reason: &lfm2_performance_exclusion >-
      Dense LFM2 functional and reference-parity qualification is present, but
      this change does not add a matching release-performance workload or receipt.
  - model: lfm2-2.6b
    reason: *lfm2_performance_exclusion
  - model: lfm2-350m-bf16-model-card
    reason: *lfm2_performance_exclusion
  - model: lfm2-350m-fp16
    reason: *lfm2_performance_exclusion
  - model: lfm2-700m
    reason: *lfm2_performance_exclusion
  - model: k2-horizon-7b
    reason: >-
      Pinned BF16 build and Hugging Face parity qualification are present, but
      no matching release-performance workload or receipt has been collected.
  - model: minimax-h3-768p
    reason: >-
      The pinned Diffusers reference for MiniMax-H3 has not yet been integrated
      into the release performance runner.

entries:
  - id: albert.encode
    family: albert
    operation: encode
    model: albert-base
    workload:
      testcase: albert-base
    baseline:
      runner: hf-transformers
      mode: torch-compile
      compile_scope: model.forward
  - id: bark.generate_audio
    family: bark
    operation: generate_audio
    model: bark-small
    workload:
      testcase: bark-small
      request:
        # Stop before either backend's sampled EOS so both run exactly 128 semantic steps.
        max_new_tokens: 128
    baseline:
      runner: task-reference
      adapter: hf-transformers-tts
      mode: hf-eager
      reference_backend: hf_transformers
      timing_scope: task-model-call-wall
      input_preparation_included: false
      output_contract: audio-shape
