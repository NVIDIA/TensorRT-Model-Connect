      python_profile: elf_flow_reference
      output_contract: token-agreement
      min_positional_token_agreement: 0.85
      max_normalized_edit_distance: 0.2
      adapter_options:
        reference_commit: b29d8833609e9ab7f67cd9da39435ac5cea04837
        checkpoint: embedded-language-flows/ELF-B-de-en-torch
        config: src/configs/training_configs/train_de-en_ELF-B.yml
