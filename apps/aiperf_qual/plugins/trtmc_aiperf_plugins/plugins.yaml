# TRTMC plugins for AIPerf 0.13.0 (see trtmc_aiperf_plugins/__init__.py for deployment notes).

endpoint:
  trtmc_task:
    class: trtmc_aiperf_plugins.endpoint:TrtmcTaskEndpoint
    description: |
      Generic TRTMC operation endpoint. The turn text is a JSON operation request
      ({"request": {...}}); the observation is returned as canonical JSON text and the
      server-reported model-call time is exposed as the trtmc_model_call_time metric.
    metadata:
      endpoint_path: null
      supports_streaming: false
      produces_tokens: false
      tokenizes_input: false
      metrics_title: TRTMC Task Metrics

# Public datasets pinned to fixed revisions. Same-name entries with a higher
# priority replace the unpinned built-ins so a run cannot silently float.
public_dataset_loader:
  librispeech:
    class: trtmc_aiperf_plugins.datasets:PinnedLibriSpeech
    priority: 10
    description: LibriSpeech test.clean pinned to a fixed Hugging Face revision.
    metadata:
      hf_dataset_name: openslr/librispeech_asr
      hf_split: test
      hf_subset: clean
      streaming: true
      audio_column: audio

  mmstar:
    class: trtmc_aiperf_plugins.datasets:PinnedMMStar
    priority: 10
    description: MMStar visual QA (val) pinned to a fixed Hugging Face revision.
    metadata:
      hf_dataset_name: Lin-Chen/MMStar
      hf_split: val
      prompt_column: question
      image_column: image

  sharegpt:
    class: trtmc_aiperf_plugins.datasets:PinnedShareGPT
    priority: 10
    description: ShareGPT V3 cleaned split pinned to a fixed Hugging Face revision.

accuracy_benchmark:
  # AIPerf's own benchmarks at pinned dataset revisions on a deterministic subset (benchmarks.py);
  # both sides are scored against the gold answers with AIPerf's graders.
  trtmc_mmlu:
    class: trtmc_aiperf_plugins.benchmarks:PinnedMMLU
    description: AIPerf MMLU (lighteval prompt) at a pinned revision, first k problems per subject.
    metadata:
      default_grader: multiple_choice
      default_n_shots: 5

  trtmc_gsm8k:
    class: trtmc_aiperf_plugins.benchmarks:PinnedGSM8K
    description: AIPerf GSM8K (lighteval prompt) at a pinned revision.
    metadata:
      default_grader: lighteval_gsm8k
      default_n_shots: 0

  trtmc_math500:
    class: trtmc_aiperf_plugins.benchmarks:PinnedMath500
    description: AIPerf MATH-500 (lighteval prompt) at a pinned revision, generation size capped.
    metadata:
      default_grader: lighteval_latex
      default_n_shots: 0

  trtmc_lambada:
    class: trtmc_aiperf_plugins.benchmarks:Lambada
    description: LAMBADA (OpenAI version) last-word prediction at a pinned revision.
    metadata:
      default_grader: trtmc_first_word
      default_n_shots: 0

  trtmc_tinystories:
    class: trtmc_aiperf_plugins.benchmarks:TinyStories
    description: TinyStories (validation) last-word prediction at a pinned revision.
    metadata:
      default_grader: trtmc_first_word
      default_n_shots: 0

  trtmc_bart_denoise:
    class: trtmc_aiperf_plugins.benchmarks:BartDenoise
    description: BART span-mask reconstruction of WikiText-103 test sentences at a pinned revision.
    metadata:
      default_grader: trtmc_sentence_exact
      default_n_shots: 0

accuracy_grader:
  trtmc_sentence_exact:
    class: trtmc_aiperf_plugins.benchmarks:SentenceExactGrader
    description: The response must equal the gold sentence up to whitespace.
  trtmc_final_choice:
    class: trtmc_aiperf_plugins.benchmarks:FinalChoiceGrader
    description: Multiple choice graded on the text after the response's last harmony final-channel marker.
  trtmc_first_word:
    class: trtmc_aiperf_plugins.benchmarks:FirstWordGrader
    description: The response's first word (trailing punctuation removed) must equal the gold word.
