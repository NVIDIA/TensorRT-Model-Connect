# RefCOCO val objects (200 of 8,811, evenly spaced) as text-prompted segmentation: the first referring
# expression is the prompt; gold is the object's mask (its COCO polygon), scored as mean IoU of the
# highest-scoring instance.
suite: refcoco-text-200
version: 1
source:
  kind: hf_dataset
  dataset: lmms-lab/RefCOCO
  split: val
  revision: a5dff0b3194715fda69b2d6a0d2aaafb41eaa407
  data_files: {val: data/val-*.parquet}
  image_column: image
  polygon_label: segmentation
  columns: [answer]
selection: {method: stride, count: 200}
fields: {image: image_path, answer.0: prompt}
request:
  batch_size: 1
