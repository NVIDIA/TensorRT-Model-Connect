# COCO val2017 (all 4,952 images with annotations); gold is the image's objects (xyxy boxes in pixels,
# contiguous 80-class categories), scored as COCO mAP@[.5:.95].
suite: coco-val2017
version: 1
source:
  kind: hf_dataset
  dataset: detection-datasets/coco
  split: val
  revision: cf0b22332314a937e9dc8a1957b21725430bb41d
  data_files: {val: data/val-*.parquet}
  image_column: image
  label_column: objects
selection: {method: first, count: 4952}
fields: {image: image_path}
request:
  score_threshold: 0.25
