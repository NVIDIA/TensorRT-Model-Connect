# ADE20K SceneParsing (SceneParse150) validation, 500 of 2,000 images evenly spaced (Hugging Face's
# parquet conversion of the dataset script); gold is the class map (1-150, 0 ignored), scored as mIoU.
suite: ade20k-val-500
version: 1
source:
  kind: hf_dataset
  dataset: zhoubolei/scene_parse_150
  split: validation
  revision: e660d866a1351c70bcf07925d2600b60bd6e3bc3
  data_files: {validation: scene_parsing/validation/*.parquet}
  image_column: image
  label_column: annotation
  label_image: true
selection: {method: stride, count: 500}
fields: {image: image_path}
