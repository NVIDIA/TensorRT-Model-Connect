# COCO val2017 (detection-datasets/coco, pinned; this export carries no crowd regions): 500 images in seeded
# order; gold is the image's objects (xyxy boxes in pixels, contiguous 80-class categories, areas), scored as COCO
# mAP@[.5:.95] by pycocotools.
suite: coco-val2017-500
version: 1
source:
  kind: hf_dataset
  dataset: detection-datasets/coco
  split: val
  revision: cf0b22332314a937e9dc8a1957b21725430bb41d
  data_files: {val: data/val-*.parquet}
  image_column: image
  label_column: objects
selection: {method: seeded, count: 500}
fields: {image: image_path}
request:
  score_threshold: 0.25
