# RefCOCO val (2,000 of 8,811 referred objects, evenly spaced): the first referring expression in the
# grounding model's prompt; gold is the object's box (pixels) with the image size, scored as IoU >= 0.5.
suite: refcoco-val-2000
version: 1
source:
  kind: hf_dataset
  dataset: lmms-lab/RefCOCO
  split: val
  revision: a5dff0b3194715fda69b2d6a0d2aaafb41eaa407
  data_files: {val: data/val-*.parquet}
  image_column: image
  label_column: bbox
  label_with_image_size: true
  columns: [answer]
selection: {method: stride, count: 2000}
fields: {answer.0: prompt, image: image_path}
prompt_prefix: 'Locate a single instance that matches the following description: '
prompt_suffix: .
request:
  max_new_tokens: 32
  temperature: 1.0
  top_k: 1
  top_p: 1.0
  min_p: 0.0
  seed: -1
  repetition_penalty: 1.0
  use_chat_template: false
  enable_thinking: true
