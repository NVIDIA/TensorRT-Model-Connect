# Ten Imagenette images (one per class, the first of each), center-cropped to squares, edited with each
# model's catalog request (instruction, size, steps, guidance, seed). Used by the replay_parity
# check of image edits: square inputs condition fixed-square engines and aspect-preserving
# pipelines alike, so pixel parity reflects numerics.
suite: imagenette-edit-10
version: 1
base: catalog
source:
  kind: json_manifest
  path: Imagenette/imagenette2-320_task_eval.json
  sha256: 07cd93194d148b8b68d89ba537b7a43741810e02a22429578a60bb85aeab5ea3
  records: requests
  file_fields: [image]
  square_crop: [image]
selection: {method: stratified, field: label, count: 10}
fields: {image: image_path}
