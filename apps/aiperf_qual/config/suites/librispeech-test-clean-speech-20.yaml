# LibriSpeech test-clean (AIPerf `librispeech`, pinned): 20 utterances in seeded order, one per speaker, as the user
# turn of a speech-to-speech model; no gold: the spoken answer is compared with the native model's.
# Version 2 resamples the 16 kHz utterances once to the model's 24 kHz input for both sides.
suite: librispeech-test-clean-speech-20
version: 2
source:
  kind: aiperf_public
  dataset: librispeech
  label_column: text
  cluster_column: speaker_id
  one_per_cluster: true
  audio_sample_rate: 24000
selection: {method: seeded, count: 20}
fields: {audio: audio_path}
request:
  max_new_tokens: 300
