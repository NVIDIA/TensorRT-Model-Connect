# LibriSpeech test-clean (AIPerf `librispeech`, pinned): 1,000 utterances, 25 from each of the 40 speakers in
# seeded random order; the speaker is the bootstrap cluster. Gold is the transcript.
suite: librispeech-test-clean-1000
version: 1
source:
  kind: aiperf_public
  dataset: librispeech
  label_column: text
  cluster_column: speaker_id
selection: {method: seeded, field: speaker_id, count: 1000}
fields: {audio: audio_path}
request:
  max_new_tokens: 200
  language: en
