# RefCOCO val objects (200 of 8,811, evenly spaced) as point-prompted segmentation: the prompt is the mask
# pixel nearest the object's centroid; gold is the object's mask (its COCO polygon), scored as mean IoU.
suite: refcoco-point-200
version: 1
source:
  kind: hf_dataset
  dataset: lmms-lab/RefCOCO
  split: val
  revision: a5dff0b3194715fda69b2d6a0d2aaafb41eaa407
  data_files: {val: data/val-*.parquet}
  image_column: image
  polygon_label: segmentation
selection: {method: stride, count: 200}
fields: {image: image_path, point_x: point_x, point_y: point_y}
request:
  is_foreground: true
