reference:
  requirements: families/lerobot_groot/tests/requirements.txt
  adapter: families/lerobot_groot/reference/adapter.py  # LeRobot's policy, the request's flow noise
  mode: eager  # LeRobot runs its own modules
benchmarks:
  action_chunk_parity:
    suite_definition:
      suite: libero-spatial-observations-50
      version: 1
      source:
        kind: family_inputs
        module: families/lerobot_groot/reference/inputs.py
      selection: {method: first, count: 50}
    # Arm: twice the largest arm error of the FP8 bundle on these observations (0.034), the factor of the E2E FP8
    # tolerances. Gripper: the binary LIBERO command by sign; one observation may change it at one step, as the
    # family measures for FP8 (0.06% of steps) and for LeRobot's own bfloat16 policy (0.03%) against float32.
    gate: {max_abs_error: 0.068, gripper_component: -1,
           outliers: {max_fraction: 0.02, gate: {max_gripper_sign_changes: 1}}}
