reference:
  adapter: families/sam3/reference/adapter.py  # Sam3Model with the text prompt (no generic adapter)
  requirements: families/sam3/requirements.txt  # the family's dependencies, layered on the serving interpreter
  # The repository is gated and refuses this host's token even for optional files; every file the native
  # pipeline reads is in the hub cache, so the reference runs offline.
  offline: true
