# A pretrained checkpoint that follows only task prefixes: its "caption en" captions of COCO images against the
# native model's, not OCRBench. The bf16 and fp8 profiles inherit this configuration.
absolute: [{name: caption_parity, request: {prompt: "caption en"}}]

reference:
  adapter: families/paligemma/reference/adapter.py  # the processor has no chat template
# Perf times the first COCO image: the catalog testcases state no prompt (the family test sends its own task
# prefixes), so the catalog payload cannot build one.
performance: {suite: {from_benchmark: caption-parity}}
