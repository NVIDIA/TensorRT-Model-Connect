reference:
  requirements: families/lerobot_groot/tests/requirements.txt
  adapter: families/lerobot_groot/reference/adapter.py  # LeRobot's policy, the request's flow noise
  mode: eager  # LeRobot runs its own modules
benchmarks:
  action_chunk_parity:
    suite_definition:
      suite: libero-spatial-observations-50
      version: 1
      source:
        kind: family_inputs
        module: families/lerobot_groot/reference/inputs.py
      selection: {method: first, count: 50}
    # Arm: the largest E2E bf16 tolerance (max abs against the bfloat16 policy). Gripper: the binary LIBERO command
    # by sign, as for the FP8 profile; one observation may change it at one step, as LeRobot's own bfloat16 policy
    # does against float32 (0.03% of steps) and the bundle does on Jetson Thor (episode 1287, frame 94).
    gate: {max_abs_error: 0.045, gripper_component: -1,
           outliers: {max_fraction: 0.02, gate: {max_gripper_sign_changes: 1}}}
