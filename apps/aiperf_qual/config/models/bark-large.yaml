# Bark always samples (its generation configs set do_sample) and TRTMC does not replay PyTorch's random
# stream, so a sample-level mismatch is inconclusive, and Perf compares only the generated duration.
accuracy:
  - {suite: seedtts-en-5, grader: parity_audio, gate: {min_pass_rate: 1.0}, sampled: true}
performance:
  l1:
    output_grader_params: {min_duration_ratio: 0.5, max_duration_ratio: 2.0, min_rms_ratio: 0.0,
                           max_rms_ratio: 1.0e+9, max_log_spectral_distance: 1.0e+9}
