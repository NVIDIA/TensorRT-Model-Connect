# An image-only model: the catalog request's prompt is empty. Its runtime declares no width or height config, so the
# catalog request's size (from the manifest) is removed and the COCO start frames are fitted to the bundle's video size.
reference:
  adapter: families/stable_video_diffusion/reference/adapter.py  # Diffusers StableVideoDiffusionPipeline
  requirements: families/stable_video_diffusion/requirements.txt
  options: {num_frames: 25}  # the manifest's video_num_frames
request: {width: null, height: null}
