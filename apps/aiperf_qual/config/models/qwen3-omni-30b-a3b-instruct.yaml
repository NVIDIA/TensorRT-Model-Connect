# The TRTMC Qwen3-Omni runtime accepts greedy decoding only as temperature 1.0 with top_k 1 and
# enable_thinking true (use_chat_template false); the native reference treats it the same way.
accuracy:
  - suite: mmlu-0shot-10
    grader: parity_answer_line
    max_new_tokens: 8
    gate: {min_pass_rate: 0.9}
    request: {temperature: 1.0, top_k: 1, enable_thinking: true}
  - suite: humaneval-10
    grader: parity_token_exact
    max_new_tokens: 32
    gate: {min_pass_rate: 0.9}
    request: {temperature: 1.0, top_k: 1, enable_thinking: true}
