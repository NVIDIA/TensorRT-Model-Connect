reference:
  adapter: families/fnet/reference/adapter.py
  options:
    max_sequence_length: 256

benchmarks:
  # Two FP16 implementations round differently: at most 1% of the 400 sentences (4) may fall outside the
  # encoder-parity tolerance if each stays within twice it.
  encoder_parity:
    gate: {outliers: {max_fraction: 0.01, gate: {min_cosine: 0.998, max_relative_l2: 0.04}}}
    # The native model runs float32 (PyTorch has no FP16 FFT of these lengths) while the bundle's Fourier transforms
    # run FP16 by design: 5 of the 400 sentences sit at relative L2 0.041 to 0.047, so 2% (8) may.
    mismatched_precision_gate: {outliers: {max_fraction: 0.02, gate: {min_cosine: 0.996, max_relative_l2: 0.08}}}
