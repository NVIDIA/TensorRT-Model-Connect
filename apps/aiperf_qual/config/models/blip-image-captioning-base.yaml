# A captioner with no question input: unconditional captions (an empty prompt) of COCO images against the native
# model's, not OCRBench.
absolute: [{name: caption_parity, request: {prompt: ""}}]

reference:
  adapter: families/blip/reference/adapter.py  # the processor has no chat template
# Perf times the first COCO image: the catalog testcases (an empty prompt, mirrored inputs) are not a request the
# catalog payload can build.
performance: {suite: {from_benchmark: caption-parity}}
