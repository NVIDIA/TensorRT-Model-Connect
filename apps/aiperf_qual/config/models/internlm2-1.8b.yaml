# The catalog's internlm2 profile is internlm2-math-plus: on MMLU it explains before it names a letter, beyond the
# 8-token answer budget (native 21.7%, chance level), so it runs GSM8K. Its bundle holds 256 tokens: 160-token
# answers leave 923 of the 1,319 problems that fit (reference solutions: 95 tokens p50, 165 p90).
absolute:
  - {name: gsm8k, max_new_tokens: 160}

candidate:
  # On transformers 5.x the checkpoint's remote-code tokenizer splits text into characters (126 tokens for a
  # 39-token GSM8K question), so prompts are counted with the tokenizer.json the InternLM bundle carries
  # (families/internlm/tokenizer_json.py).
  tokenizer_json: {repo: internlm/internlm2-step-prover, revision: 9e24972976836edf59be9eb14050437c60f50a6c}

reference:
  mode: eager  # torch.compile: the remote-code generation recompiles past Dynamo's limit
  requirements: families/internlm/requirements.txt  # the family's dependencies, layered on the serving interpreter
