# Random weights: no accuracy to score against gold answers, so Perf only; the performance output check (greedy
# token parity with the native model) is the conversion evidence. Left out of every machine's model list: its timing
# of a few ms per call adds no qualification signal (on Jetson Thor it varied beyond the 5% comparability bound).
exclude: random-weight test model; there is no accuracy to measure, and its timing of a few ms per call adds no qualification signal
accuracy_source: none
accuracy_note: random weights (a test model); no accuracy to measure

reference:
  mode: eager  # torch.compile: Dynamo cannot trace the MoE experts' torch._grouped_mm
