# An OCR model prompted only with "OCR:": OCRBench's text-recognition crops with that prompt.
# The bundle reads one fixed image size, the catalog profile's 560x280 (the checkpoint's resize keeps it), and
# rejects any other: each crop is fitted into 560x280 with its aspect ratio kept and white padding, the same
# pixels on both sides.
absolute: [{name: ocrbench_text, request: {prompt: "OCR:"}, letterbox: {image: [560, 280]}}]

reference:
  requirements: families/paddleocr_vl/tests/requirements.txt  # the family test reference's Transformers (PaddleOCR-VL)
# Perf times the first text-recognition crop: the catalog testcases are not a request the catalog payload can build
# (an empty prompt, images under another key, or several images).
performance: {suite: {from_benchmark: ocrbench-text}}
