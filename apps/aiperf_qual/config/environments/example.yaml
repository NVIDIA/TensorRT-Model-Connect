# Template of a machine's environment: copy to <machine>.yaml, replace the paths, then run
#   trtmc-aiperf-qual doctor --environment config/environments/<machine>.yaml
# Docker and bare metal differ only in these paths (inside a container, use the container's paths).
repo: /path/to/TensorRT-Model-Connect                   # this checkout
data_root: /path/to/datasets                            # datasets mirror (Imagenette, COCO2017, ETTh1, ...)
bundle_root: /path/to/engines                           # bundles are built here on demand (<name>/<bundle>)
runtime_root: /path/to/runtime                          # TRTMC runtime libraries
worker: /path/to/runtime/trtmc_benchmark_worker         # built with --serve support
serve_python: /path/to/trtmc-venv/bin/python            # torch, transformers, TRTMC runtime, perf_serving reqs
aiperf: /path/to/aiperf-venv/bin/aiperf                 # apps/aiperf_qual/setup.sh creates this environment
hf_datasets_cache: /path/to/state/hf-datasets
hf_hub_cache: /path/to/huggingface/hub                  # checkpoint cache of builds and references
reference_env_root: /path/to/state/ref-envs             # per-family reference environments
ports: {reference: 8900, candidate: 8901}
# native_replicas: 4                     # gold-scored native runs: copies of the HF adapter that fit the GPU (default 1)
# candidate_replicas: 4                  # TRTMC's Acc answers: copies of the server that fit the GPU (default 1)
# acc_mps: true                          # the copies share the GPU through their own CUDA MPS daemon (default off)
# acc_overlap: true                     # both sides answer Acc at once under one MPS daemon (default off)
gpu_lock: /path/to/state/gpu.lock                       # optional: serializes timing with builds on this GPU
# ledger: /path/to/ledger.json                          # optional: run deadlines, 3x a profile's predicted seconds
                                                        # (>= 10 min); a run's own ledger, kept with its results
build_env: {}                                           # optional extra environment of bundle builds

models:                                                 # this machine's model list (run-all, plan)
  include: all                                          # all | [profile names or glob patterns]
  exclude: []                                           # [{profile: <name or glob>, reason: <why>}]
  # max_checkpoint_gib: 30                              # optional: also exclude larger checkpoints

retention:                                              # disk: both keep everything by default
  bundle: retain                                        # retain | delete_on_pass | delete_unless_error
  hf_cache: retain                                      # retain | delete_unused (run-all)
