# GB300 perf-serving container (Docker or bare metal only differ in these paths).
repo: /workspace/tensorrt-model-connect
data_root: /mnt/data                      # read-only datasets mirror
bundle_root: /runs/engines                # bundles are built here on demand (<name>/<bundle>)
hf_hub_cache: /root/.cache/huggingface/hub   # checkpoint cache of builds and references
build_env:                                # extra environment of bundle builds
  CMAKE_LIBRARY_PATH: /opt/venv/lib/python3.12/site-packages/tensorrt_libs   # family native plugins find TensorRT
models:                                   # this machine's model list (see trtmc_aiperf_qual/selection.py)
  include: all                            # 288 GB per GPU: every ready catalog model fits
  exclude: []                             # [{profile: <name or glob>, reason: <why>}]
retention:                                # see trtmc_aiperf_qual/retention.py
  bundle: retain                          # retain | delete_on_pass | delete_unless_error
  hf_cache: retain                        # retain | delete_unused (run-all)
runtime_root: /runs/tmp/build
worker: /runs/tmp/build/trtmc_benchmark_worker
serve_python: /opt/venv/bin/python        # runs trtmc-perf-serve (torch, transformers, runtime)
aiperf: /state/aiperf-venv/bin/aiperf
hf_datasets_cache: /state/hf-datasets
reference_env_root: /state/ref-envs      # family reference environments (trtmc-perf-serve reference-env)
ports: {reference: 8900, candidate: 8901}
native_replicas: 4                       # gold-scored native runs: copies of the HF adapter that fit the GPU
gpu_lock: /state/gpu.lock                # serializes timing phases with bundle builds on this host
