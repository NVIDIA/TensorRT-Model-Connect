# Workload for the existing Qwen full FP16 profile; no new model spec.
aiperf:
  version: 0.13.0
checkpoint:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  precision: fp16
tokenizer:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
server:
  bundle: /path/bundles/qwen3-0.6b-fp16.bundle
  model_name: Qwen/Qwen3-0.6B
  binary: /path/build/trtmc-server
  runtime_root: /path/build
  replicas: 1
  port: 8000
  startup_timeout: 120
  request_timeout: 120
validation_profile: qwen3-0.6b-fp16
validation_commands:
- - /path/trtmc-python
  - -m
  - pytest
  - families/qwen/tests/test_e2e.py
  - --e2e-model
  - qwen3-0.6b-fp16
  - -q
corpus:
  format: controlled_prefix
  count: 12
  prefix: 'Read these notes carefully. A model server has one execution lane. Each request contains a
    prompt and an output limit. Requests that arrive while the lane is busy can be rejected. Input lengths
    and generation settings affect latency. Benchmark reports should keep client response time separate
    from native model execution time. Answer the following question in one short sentence.

    Question: '
  suffixes:
  - How many execution lanes does this server have?
  - What does each request contain?
  - When can a request be rejected?
  - What affects latency?
  - What should a benchmark report keep separate?
  - Why should input length be recorded?
  - What limits the generated answer length?
  - How long should your answer be?
  - What happens when the execution lane is busy?
  - Which timing includes the network request?
  - Which timing measures the native model call?
  - Why count rejected requests?
  cache_audit:
    source_file: families/qwen/runtime/pipeline.cpp
    symbol: reset_generation_context
    conclusion: The qualified Qwen pilot resets generation state before every request. No cross-request
      prefix cache control or cache-hit telemetry is exposed. Existing per-generation KV state is not
      cross-request reuse.
workload:
  endpoints:
  - completions
  output_tokens:
  - 16
  concurrency:
  - 1
  streaming:
  - false
  requests: 12
  warmup_requests: 0
