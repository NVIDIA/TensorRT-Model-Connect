# Replace /path values with paths on the validation host. Validation must use
# this bundle and the same family DSO that the server will load.
aiperf:
  version: 0.13.0
checkpoint:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  precision: fp16
tokenizer:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
server:
  bundle: /path/bundles/qwen3-0.6b-fp16.bundle
  model_name: Qwen/Qwen3-0.6B
  binary: /path/build/trtmc-server
  runtime_root: /path/build
  replicas: 1
  port: 8000
  startup_timeout: 120
  request_timeout: 120
validation_profile: qwen3-0.6b-fp16
validation_commands:
  - [/path/trtmc-python, -m, pytest, families/qwen/tests/test_e2e.py, --e2e-model, qwen3-0.6b-fp16, -q]
# A workload configuration for the existing full FP16 model profile above.
corpus:
  format: azure_trace
  count: 12
  context_margin: 16
  time_scale: 1
  arrival_tolerance_ms: 100
  source:
    url: https://raw.githubusercontent.com/Azure/AzurePublicDataset/790921015d50dd6aae7f7e47f39ba0e235ad6b08/data/AzureLLMInferenceTrace_conv.csv
    revision: 790921015d50dd6aae7f7e47f39ba0e235ad6b08
    sha256: 2f1e5b666d4e3055fdbba98598ce2ec307767b9064e03e2fa46676dbcc7d0bf8
    attribution: AzurePublicDataset; Patel et al., Splitwise (ISCA 2024); CC-BY
workload:
  endpoints: [completions]
  streaming: [false]
  requests: 12
  warmup_requests: 0
