# Qualification defaults per catalog Task. Every catalog model inherits the entry of its Task;
# config/models/<profile>.yaml holds only the exceptions (deep-merged over this).
#
# Acc: TRTMC and the native model answer the Task's gold-labelled benchmarks (`absolute`, below); each is a
# paired non-inferiority decision against its margin (trtmc_aiperf_qual/noninferiority.py). A model with no
# benchmark sets `accuracy_source: none` (Perf only, for example random-weight test models).
# Perf: server task-call p50 from the same benchmark responses, with excluded warmup.
# Quality workloads do not send separate catalog/near-capacity performance requests or apply repeated-run gates.
# The repeated measurement settings below apply only to explicit Perf-only models and order-check diagnostics.
# Optional service metrics (`service_metrics`) are opt-in reports, set per model.
#
# Suite "catalog" is the profile's catalog testcase request (model-specific shapes and settings).
#
# A Task renamed by a Task SDK migration (same operation and output) aliases its old entry. A ready catalog
# profile whose Task has no entry is a configuration error that reports leave out.

defaults:
  reference:
    backend: auto              # the generic adapter of the operation (unsupported: no native path)
    # The native model runs torch.compiled (PyTorch's default mode): its quality answers and their timings come
    # from one run. A compile run that fails is run again in eager mode in its place, and reports name the mode
    # that answered. A profile whose native model cannot compile sets `reference.mode: eager`.
    mode: compile
  performance:
    suite: catalog
    # reference_modes: the fixed request's native modes (default: [reference.mode]); the first one qualifies.
    # settle_s: the request sent back to back first (a fresh server times short requests slower at first).
    # min_run_s: a request faster than the settle's pace gets enough requests per run to last this long (12
    # sub-millisecond requests spread their run's median by more than max_ci_percent).
    measurement: {settle_s: 10, warmup: 3, requests: 12, runs: 5, min_run_s: 1.0}
    aggregation: {candidate: mean, eager: mean, compile: mean}
    margin_percent: 5
    # The green / red bounds widen by this (multiplicatively): the largest speedup effect of server instances and
    # timing order that the order check measured on the formal hosts (October 2026: 11.4%).
    guard_percent: 12
    max_ci_percent: 5

# Benchmarks. gate: `margin` (points of the metric) and optionally `relative_margin` (a fraction of the native
# score, when larger); `quantized_gate` / `sampled_gate` replace it for quantized or sampling candidates.
# Native absolute capability is reported, not gated. Selection is
# seeded and stratified (per subject / class); prompts are filtered to the bundle's length as rendered.
benchmarks:
  # MMLU 0-shot (AIPerf mmlu, pinned): 40 per subject (<= 2,280); margin 1 point.
  mmlu: {plugin: trtmc_mmlu, suite: mmlu-0shot, n_shots: 0, per_task: 40,
         gate: {margin: 1.0}, quantized_gate: {margin: 2.0}, sampled_gate: {margin: 2.0}}
  # GSM8K (AIPerf gsm8k, pinned; the number after #### or the last number): for math models only, as their
  # answers (up to 256 tokens) dominate the run time; at most 500 problems; margin 2 points.
  gsm8k: {plugin: trtmc_gsm8k, suite: gsm8k, limit: 500,
          gate: {margin: 2.0}, quantized_gate: {margin: 3.0}, sampled_gate: {margin: 3.0}}
  # LAMBADA (OpenAI, all 5,153 passages): base LMs too small for MMLU to discriminate.
  lambada: {plugin: trtmc_lambada, suite: lambada, endpoint: completions,
            gate: {margin: 0.5}, quantized_gate: {margin: 1.0}, sampled_gate: {margin: 1.0}}
  tinystories: {plugin: trtmc_tinystories, suite: tinystories, endpoint: completions, limit: 2000,
                gate: {margin: 1.0}}
  # BART's denoising pre-training task scored as corpus chrF++ of the reconstructed sentences (exact-sentence
  # accuracy is 5% on the native model: too coarse to discriminate).
  bart_denoise: {plugin: trtmc_bart_denoise, suite: bart-denoise, endpoint: completions, corpus_metric: chrf,
                 gate: {margin: 1.0}}
  # Gold suites sent through AIPerf's trtmc_task endpoint and scored here (gold_metrics): `choice` /
  # `contains` / `box_iou50` / `top1` / `code_pass` grade each sample (paired score test); the others are
  # corpus statistics (paired bootstrap over the suite's clusters).
  mmstar: {suite: mmstar, suite_definition: mmstar-val-1500, metric: choice,
           gate: {margin: 1.5}, quantized_gate: {margin: 3.0}, sampled_gate: {margin: 3.0}}
  ocrbench: {suite: ocrbench, suite_definition: ocrbench-1000, metric: contains,
             gate: {margin: 2.0}, quantized_gate: {margin: 3.0}, sampled_gate: {margin: 3.0}}
  librispeech: {suite: librispeech-test-clean, suite_definition: librispeech-test-clean-500, metric: wer,
                gate: {margin: 0.3, relative_margin: 0.05}}
  # Japanese has no word boundaries: the character error rate of FLEURS ja (models that state it).
  fleurs_ja: {suite: fleurs-ja-test, suite_definition: fleurs-ja-test-650, metric: cer,
              gate: {margin: 0.5, relative_margin: 0.05}}
  # Streaming TRTMC vs the native transcription: a wider margin.
  librispeech_streaming: {suite: librispeech-test-clean, suite_definition: librispeech-test-clean-500,
                          metric: wer, gate: {margin: 0.5, relative_margin: 0.10}}
  sts: {suite: stsb, suite_definition: stsbenchmark-pairs-1379, metric: sts_spearman, gate: {margin: 0.5}}
  # Raw encoders (BERT, RoBERTa, ...: STS-B is not their task): conversion parity of the encode output (the
  # first-token hidden state) on 400 STS-B test sentences, every sentence within the tolerance (a profile's family
  # file may allow rare outliers: see the README).
  encoder_parity: {suite: encoder-parity, suite_definition: stsbenchmark-sentences-400, metric: vector_parity,
                   gate: {min_cosine: 0.999, max_relative_l2: 0.02},
                   # A native model that cannot run the candidate's precision (fp16) runs at fp32: TRTMC's half-
                   # precision error is then not shared by the reference, so the tolerance doubles.
                   mismatched_precision_gate: {min_cosine: 0.998, max_relative_l2: 0.04}}
  # SciFact reranking of fixed BM25 top-20 candidates (nDCG@10). Each document keeps its head so that the pair, as
  # the bundle's reranker forms it (`pair_format`, the eagle_vlm runtime's), fits the bundle; both sides get it.
  rerank: {suite: scifact-rerank, suite_definition: scifact-rerank-bm25-300, metric: rerank_ndcg, gate: {margin: 1.0},
           pair_format: "question:{query} \n \n passage:{document}"}
  # SciFact retrieval over the whole corpus (nDCG@10); documents keep their first 256 tokens on both sides
  # (encoders cut longer inputs differently).
  retrieval: {suite: scifact-retrieval, suite_definition: scifact-retrieval-corpus, metric: retrieval_ndcg10,
              truncate_tokens: 256, gate: {margin: 1.0}}
  # ImageNetV2 matched-frequency (all 10,000 images): top-1 against the gold class.
  imagenet: {suite: imagenet-top1, suite_definition: imagenetv2-10k, metric: top1, gate: {margin: 0.5}}
  # COCO val2017 mAP@[.5:.95] (pycocotools); label_space is the model's class numbering
  # (coco-contiguous-80 or coco-category-id).
  coco: {suite: coco-map, suite_definition: coco-val2017-500, metric: coco_map,
         metric_params: {label_space: coco-contiguous-80}, gate: {margin: 1.0}}
  # The same images for an open-vocabulary detector (an image_text_to_boxes Task): one prompt naming the 80
  # categories, its text labels mapped back to them (unmatched phrases drop their box). Each family states its
  # thresholds as its own request fields.
  coco_prompted:
    suite: coco-map-prompted
    suite_definition: coco-val2017-500
    metric: coco_map
    metric_params: {label_space: coco-names-80}
    request:
      score_threshold: null
      prompt: >-
        person. bicycle. car. motorcycle. airplane. bus. train. truck. boat. traffic light. fire hydrant.
        stop sign. parking meter. bench. bird. cat. dog. horse. sheep. cow. elephant. bear. zebra. giraffe.
        backpack. umbrella. handbag. tie. suitcase. frisbee. skis. snowboard. sports ball. kite. baseball
        bat. baseball glove. skateboard. surfboard. tennis racket. bottle. wine glass. cup. fork. knife.
        spoon. bowl. banana. apple. sandwich. orange. broccoli. carrot. hot dog. pizza. donut. cake. chair.
        couch. potted plant. bed. dining table. toilet. tv. laptop. mouse. remote. keyboard. cell phone.
        microwave. oven. toaster. sink. refrigerator. book. clock. vase. scissors. teddy bear. hair drier.
        toothbrush.
    gate: {margin: 1.0}
  # Zero-shot classification by text-image relevance (CLIP, SigLIP): each Imagenette image against its 10 class
  # prompts; right when the best-scoring prompt names the gold class.
  imagenette_zero_shot: {suite: imagenette-zero-shot, suite_definition: imagenette-zero-shot-500, metric: query_hit,
                         gate: {margin: 1.0}, quantized_gate: {margin: 2.0}}
  # Audio tagging (AST): right when the top class is one of the AudioSet clip's labels.
  audioset: {suite: audioset-eval, suite_definition: audioset-eval-500, metric: label_hit,
             gate: {margin: 1.0}, quantized_gate: {margin: 2.0}}
  # Masked-LM token scores (ESM-2) have no gold set here: every logit of UniRef50 test sequences cut to the
  # bundle's window, against the native model's (cosine and relative L2, as the encoders).
  token_score_parity: {suite: token-score-parity, suite_definition: uniref50-test-200, metric: vector_parity,
                       truncate_tokens: 254, gate: {field: logits, min_cosine: 0.999, max_relative_l2: 0.02}}
  # Relative monocular depth (Depth Anything) against the native map on 50 COCO images: the family's E2E gate.
  depth_parity: {suite: depth-parity, suite_definition: coco-val2017-depth-50, metric: depth_parity,
                 gate: {min_correlation: 0.998, max_relative_error: 0.01}}
  # Point-cloud semantic segmentation (PointNet): S3DIS Area 5 blocks, class mIoU of the per-point classes over the
  # corpus against the S3DIS annotation.
  s3dis_area5: {suite: s3dis-area5-miou, suite_definition: s3dis-area5-blocks-300, metric: point_miou,
                gate: {margin: 1.0}}
  # A structured decision (per-option probabilities of a schema's questions) has no public gold set: every
  # catalog testcase of the profile (its family's fixtures), the same choices and the families' E2E probability
  # tolerance against the release implementation.
  decision_parity:
    suite: decision-parity
    metric: decision_parity
    suite_definition: {suite: decision-parity, version: 1, source: {kind: catalog_testcase, all_testcases: true},
                       selection: {method: first, count: 16}}
    gate: {atol: 0.015, rtol: 0.01}
  # ETTh1 rolling forecasts (the model's columns / context / horizon in config/models `window`): MSE against
  # the observed future, within 1% of the native MSE.
  etth1: {suite: etth1-mse, suite_definition: etth1-test-rolling, metric: forecast_mse,
          gate: {margin: 0.0, relative_margin: 0.01}}
  # Translation test sets in each model's own request format: corpus chrF++ against the references (the
  # pinned sets carry no document ids: sentences are the bootstrap units).
  wmt14: {suite: wmt14-en-de, suite_definition: wmt14-en-de-3003, metric: chrf, fit_prompt: true, min_new_tokens: 16,
          gate: {margin: 1.0}}
  wmt19_en_ru: {suite: newstest2019-en-ru, suite_definition: newstest2019-en-ru-1997, metric: chrf, fit_prompt: true, min_new_tokens: 16,
          gate: {margin: 1.0}}
  flores_riva: {suite: flores200-en-fr, suite_definition: flores200-en-fr-riva-1012, metric: chrf, fit_prompt: true, min_new_tokens: 16,
          gate: {margin: 1.0}}
  flores_nllb: {suite: flores200-en-fr, suite_definition: flores200-en-fr-nllb-1012, metric: chrf, fit_prompt: true, min_new_tokens: 16,
          gate: {margin: 1.0}}
  # RefCOCO grounding: the first box of the answer against the gold box (IoU >= 0.5).
  refcoco: {suite: refcoco, suite_definition: refcoco-val-1500, metric: box_iou50,
            gate: {margin: 1.5}}
  # ADE20K SceneParse150: dataset-level class mIoU of the 150-class maps against the annotations.
  ade20k: {suite: ade20k-miou, suite_definition: ade20k-val-500, metric: miou, gate: {margin: 1.0}}
  # RefCOCO objects as prompted segmentation (a point inside the object; the referring expression):
  # mean IoU of the best mask against the object's mask.
  sam_point: {suite: refcoco-point-masks, suite_definition: refcoco-point-500, metric: mask_iou, gate: {margin: 1.0}}
  sam3_text: {suite: refcoco-text-masks, suite_definition: refcoco-text-500, metric: mask_iou, gate: {margin: 1.0}}
  # MoGe-2 geometry against the native model on 50 COCO val2017 images (conversion parity, every image).
  geometry_parity: {suite: geometry-parity, suite_definition: coco-val2017-geometry-50, metric: geometry_parity,
                    gate: {min_mask_iou: 0.99, max_median_relative_depth: 0.01}}
  # ACT on 50 recorded observations of its training dataset (conversion parity, every observation).
  action_parity: {suite: action-parity, suite_definition: lerobot-act-observations-50, metric: action_parity,
                  gate: {max_error_of_range: 0.001}}
  # LeRobot action chunks (GR00T, pi0.5) on recorded LIBERO observations with the family's fixed flow noise on
  # both sides (each family states its suite and its precision's E2E tolerance: tests/aiperf), every observation.
  action_chunk_parity: {suite: action-chunk-parity, metric: action_parity, gate: {max_error_of_range: 0.001}}
  # Structure prediction from the same noise as the native model (the family's suite): lDDT, aligned RMSD, pLDDT
  # and confidence against the native structure, the family's E2E gate.
  structure_parity: {suite: structure-parity, metric: structure_parity,
                     gate: {min_lddt: 0.55, max_rmsd: 9.0, max_plddt_mean_abs: 0.10, max_confidence_abs: 0.10}}
  # Pose hypothesis refinement on the same crops as the native networks (the family's suite): pose and score
  # errors, score ranking and rigidity, the family's E2E gate.
  pose_parity: {suite: pose-parity, metric: pose_parity, gate: {max_pose_abs_error: 0.005, max_score_abs_error: 0.05}}
  # Fast-FoundationStereo on the 15 Middlebury v3 trainingQ scenes of its 700x700 profile (conversion parity).
  disparity_parity: {suite: disparity-parity, suite_definition: middlebury-q-700-15, metric: disparity_parity,
                     gate: {max_mean_epe: 0.1}}
  # PersonaPlex answering 20 LibriSpeech test-clean utterances (conversion parity of the generated speech).
  speech_parity: {suite: speech-parity, suite_definition: librispeech-test-clean-speech-20, metric: audio_parity,
                  gate: {min_duration_ratio: 0.8, max_duration_ratio: 1.2, min_rms_ratio: 0.5, max_rms_ratio: 2.0,
                         max_log_spectral_distance: 3.0}}
  # HumanEval and MBPP completions run against their unit tests (as nobody, with CPU, memory, and time limits);
  # prompts that leave fewer than 64 tokens to generate on the bundle are dropped for both sides.
  code: {suite: code, suite_definition: code-humaneval-mbpp-664, metric: code_pass, fit_prompt: true,
         min_new_tokens: 64, gate: {margin: 2.0}}

tasks:
  text_generation:
    absolute: [mmlu]
    performance: {output_grader: parity_token_exact, output_grader_params: {min_prefix: 8, accept_equal_text: true}}

  vision_language_generation:
    # OCRBench alone (the owner's choice, October 2026): it caught both VLM conversion defects MMStar caught
    # (qwen3-vl-2b -26 vs -11 points, phi4-multimodal -19 vs -32) and TRTMC answers MMStar slowly (phi4-multimodal:
    # 29 min against 1 min for OCRBench). MMStar stays for profiles that state it.
    absolute: [ocrbench]
    performance: {output_grader: parity_edit_distance, output_grader_params: {max_distance: 0.15}}
  # Image, video and text to text (Cosmos3-Edge): OCRBench through the same bundle's image-text Task (the
  # image-video Task requires a video in every request); the video input is not scored.
  image_video_text_to_text:
    absolute: [ocrbench]
    performance: {output_grader: parity_edit_distance, output_grader_params: {max_distance: 0.15}}

  classification: &classify
    absolute: [imagenet]
    performance: {output_grader: parity_top1, output_grader_params: {tie_cosine: 0.999}}
  image_to_class_scores: *classify

  encoding: &encode
    absolute: [encoder_parity]
    performance: {output_grader: parity_vector}
  text_to_pooled_features: *encode  # the migrated encoders pool the first token, as encode did
  # Every token's features, compared as one matrix: a family that frames the text otherwise than its checkpoint's
  # tokenizer (a different token count) states `exclude`
  text_to_token_features:
    <<: *encode
    reference: {options: {all_tokens: true}}
  embedding: &embed
    absolute: [sts, retrieval]
    performance: {output_grader: parity_vector}
  # The generic embed reference mean-pools and L2-normalizes the unprefixed text: profiles of a family that pools
  # otherwise or needs a query/document role state `exclude`.
  text_to_embedding: *embed

  # Features have no gold answer: each family states its conversion-parity benchmark (tests/aiperf).
  image_features: &image_features
    performance: {output_grader: parity_numeric, output_grader_params: {min_cosine: 0.99}}
  image_to_token_and_pooled_features: *image_features

  object_detection:
    absolute: [coco]
    performance: {output_grader: parity_boxes}
  # The Task SDK detection families (YOLO, DETR) fix their score threshold in the bundle, as their native references
  # default it, and declare no score_threshold config: the suite's field is not sent.
  image_to_boxes:
    absolute: [{name: coco, request: {score_threshold: null}}]
    performance: {output_grader: parity_boxes}
  # Open-vocabulary detection: the family states coco_prompted with its thresholds (tests/aiperf).
  image_text_to_boxes:
    absolute: [coco_prompted]
    performance: {output_grader: parity_boxes}

  segmentation:
    absolute: [ade20k]
    performance: {output_grader: parity_mask}
  prompted_segmentation:
    absolute: [sam_point]
    performance: {output_grader: parity_mask, output_grader_params: {min_mask_iou: 0.7}}
  text_prompted_segmentation:
    absolute: [sam3_text]
    performance: {output_grader: parity_numeric}

  transcription: &transcribe
    absolute: [librispeech]
    performance: {output_grader: parity_wer}
  transcription_streaming:
    <<: *transcribe
    absolute: [librispeech_streaming]
  speech_transcription: *transcribe  # a non-English model states its own test set (tests/aiperf)

  # Generative media are slow per request: fewer requests per run, still three runs for the CI.
  audio_generation: &generate_audio
    # Sampling models cannot be judged per sample, but what they say can: both sides speak 200 Seed-TTS
    # eval sentences, Whisper large-v3-turbo transcribes them, and TRTMC's corpus WER is judged against the
    # native model's (margin 2 points or 10%); every output must be valid audio (tts-validity).
    supplementary: [{check: tts_intelligibility, suite: seedtts-en-200, asr_model: openai/whisper-large-v3-turbo,
                     asr_revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9,
                     gate: {margin: 2.0, relative_margin: 0.10}}]
    performance: {output_grader: parity_audio, measurement: {settle_s: 0, warmup: 1, requests: 3, runs: 3}}
  text_to_audio: *generate_audio
  speech_to_speech:
    absolute: [speech_parity]
    performance: {output_grader: parity_audio, measurement: {settle_s: 0, warmup: 1, requests: 3, runs: 3}}

  # Perf only checks that both sides generate the same geometry (frames, height, width): diffusion
  # content diverges across precisions. Acc is the gold-referenced checks below (GenEval, VBench CLIP-T);
  # the pixel parity under latent replay is reported only (`informational`): generated media drift
  # between TRTMC and the native model at any precision.
  image_generation:
    reference: {precision: bf16}
    # Families whose TRTMC runtime takes caller initial latents render with the same initial noise on
    # both sides (latent replay), which makes them comparable pixel by pixel: how much further TRTMC is
    # from the native fp32 render of the first 10 prompts than the native half-precision run.
    supplementary: [{check: replay_parity, suite: partiprompts-30, informational: true, video_samples: 3,
                     latent_replay_families: [flux, pixart, qwen_image, z_image, wan_t2v],
                     parity_floor_samples: 10, max_psnr_gap_db: 3.0, max_ssim_gap: 0.05,
                     quantized_gap: {max_psnr_gap_db: 6.0, max_ssim_gap: 0.1},
                     fallback_min: {psnr_db: 19.0, ssim: 0.8}, min_pass_rate: 0.9},
                    # Text-to-image with caller latents when supported: GenEval-style (all 553 prompts over its six
                    # tags, OWLv2 detections and CLIP colors, exact counts), paired right/wrong per prompt, margin 5 points.
                    {check: geneval, suite: geneval-full, only_families: [flux, pixart, qwen_image, z_image, stable_diffusion],
                     latent_replay_families: [flux, pixart, qwen_image, z_image, stable_diffusion],
                     detector: google/owlv2-base-patch16-ensemble,
                     detector_revision: cfd3195ba4ea9592eec887ded089f4c08eff231d,
                     clip_model: openai/clip-vit-large-patch14, clip_revision: 32bd64288804d66eefd0ccbe215aa642df71cc41,
                     detector_threshold: 0.2, gate: {margin: 5.0}},
                    # Videos (and families without caller latents): VBench's object prompts (20), CLIP-T of the middle
                    # frame against the prompt, paired per prompt, margin 1 point; every video must keep the native
                    # frame count and move (video validity). Motion quality and temporal order are not covered.
                    {check: geneval, entry: vbench-objects, suite: vbench-objects-20, metric: clip_t, video: true,
                     only_families: [wan_t2v, wan2_2_ti2v, minimax_h3], latent_replay_families: [wan_t2v],
                     detector: google/owlv2-base-patch16-ensemble,
                     detector_revision: cfd3195ba4ea9592eec887ded089f4c08eff231d,
                     clip_model: openai/clip-vit-large-patch14, clip_revision: 32bd64288804d66eefd0ccbe215aa642df71cc41,
                     detector_threshold: 0.2, gate: {margin: 1.0}}]
    performance: &media_policy {output_grader: parity_image, output_grader_params: {min_psnr: 0, min_ssim: -1},
                     measurement: {settle_s: 0, warmup: 1, requests: 3, runs: 3}}
  image_edit:  # edit inputs are model-specific: the catalog testcase
    reference: {precision: bf16}
    # Edits of ten Imagenette images with the same initial noise on both sides (latent replay),
    # measured like image generation's replay parity (informational).
    supplementary: [{check: replay_parity, suite: imagenette-edit-10, informational: true,
                     latent_replay_families: [qwen_image],
                     parity_floor_samples: 10, max_psnr_gap_db: 3.0, max_ssim_gap: 0.05,
                     quantized_gap: {max_psnr_gap_db: 6.0, max_ssim_gap: 0.1},
                     fallback_min: {psnr_db: 19.0, ssim: 0.8}, min_pass_rate: 0.9},
                    # MagicBrush edits against the human targets: CLIP-I and DINO (paired bootstrap, margin 1 point
                    # each), the no-edit baseline reported, and no output equal to its source. Whether the edit
                    # follows the instruction is not covered beyond target similarity.
                    {check: edit_similarity, suite: magicbrush-dev-100, latent_replay_families: [qwen_image],
                     clip_model: openai/clip-vit-large-patch14, clip_revision: 32bd64288804d66eefd0ccbe215aa642df71cc41,
                     dino_model: facebook/dino-vits16, dino_revision: abe3b354cb6a9b6f146096b14a4a9d7eecbcb4bd,
                     gate: {margin: 1.0}}]
    performance: *media_policy
  world_model_generation:  # world-model inputs are model-specific: the catalog testcase
    reference: {precision: bf16}
    # 10 COCO images with the catalog's prompt, action, and camera, the same seed on both sides: video
    # validity and coarse agreement (PSNR >= 5 dB, SSIM >= 0.1); action-conditional fidelity is not covered.
    supplementary: [{check: world_model_parity, suite: coco-world-model-10, min_psnr_db: 5.0, min_ssim: 0.1}]
    performance: *media_policy
  initial_image_text_to_video:  # the family states its native pipeline (reference.adapter)
    reference: {precision: bf16}
    # 10 COCO images fitted to the profile's video size, with the catalog's prompt and seed on both sides: video
    # validity (frame count, motion) and coarse agreement (PSNR >= 5 dB, SSIM >= 0.1); the two sides draw their
    # noise differently, so pixel fidelity and prompt following are not covered.
    supplementary: [{check: world_model_parity, suite: coco-initial-image-video-10, min_psnr_db: 5.0, min_ssim: 0.1}]
    performance: {<<: *media_policy, suite: coco-initial-image-video-1}

  time_series_forecast: &forecast
    absolute: [etth1]
    # The catalog testcases are a few values, not the models' context: Perf times the first ETTh1 window.
    performance: {suite: {from_benchmark: etth1-mse}, output_grader: parity_numeric}
  series_to_point_forecast: *forecast
  # Tasks whose native reference is the family's own Transformers model (tests/aiperf: reference.adapter).
  audio_to_class_scores:
    absolute: [audioset]
    performance: {output_grader: parity_top1}
  text_image_to_relevance:
    absolute: [imagenette_zero_shot]
    performance: {output_grader: parity_numeric}
  masked_text_to_token_scores:
    absolute: [token_score_parity]
    performance: {output_grader: parity_numeric}
  monocular_depth:
    absolute: [depth_parity]
    performance: {output_grader: parity_numeric}
  points_to_semantic_segmentation:  # the family's reference prepares the checkpoint (reference.prepare)
    absolute: [s3dis_area5]
    performance: {output_grader: parity_labels}
  structured_decision:  # the family states its release implementation (reference.adapter)
    absolute: [decision_parity]
    performance: {output_grader: parity_numeric}
  reranking: &rerank_documents
    absolute: [rerank]
    performance: {output_grader: parity_scores}
  text_query_documents_to_relevance: *rerank_documents  # eagle_vlm (#1939) still reranks and returns scores

  robot_control: &control
    absolute: [action_parity]
    # Perf only checks that both sides computed the same output: counts may differ slightly across
    # precisions (for example valid pixels), which is the Acc checks' concern.
    performance: {output_grader: parity_numeric, output_grader_params: {count_rtol: 0.01}}
  image_state_to_action_chunk: *control
  images_state_text_to_action_chunk:
    absolute: [action_chunk_parity]
    performance: {output_grader: parity_numeric, output_grader_params: {count_rtol: 0.01}}
  pose_hypothesis_refinement:  # the family prepares its model and crops (reference.prepare, family_inputs)
    absolute: [pose_parity]
    performance: {output_grader: parity_numeric,
                  output_grader_params: {fields: [refined_hypotheses, refined_poses], min_cosine: 0.999}}
  structure_prediction:  # the family prepares its package and requests (reference.prepare, family_inputs)
    absolute: [structure_parity]
    performance: {output_grader: parity_numeric,
                  output_grader_params: {fields: [structures, confidence.confidence_score], rtol: 0.2}}
  stereo_disparity:
    absolute: [disparity_parity]
    performance: {output_grader: parity_numeric, output_grader_params: {count_rtol: 0.01}}
  monocular_geometry:
    absolute: [geometry_parity]
    performance: {output_grader: parity_numeric, output_grader_params: {count_rtol: 0.01}}
