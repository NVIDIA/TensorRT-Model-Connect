schema_version: trtmc.perf-environment/v2
name: l4t-thor

tools:
  trtmc_bench: apps/benchmark/trtmc-bench
  trtmc_worker: ${TRTMC_PERF_WORKER}
  hf_transformers_runner: apps/benchmark/performance/baselines/hf_transformers.py
  task_reference_runner: apps/benchmark/performance/baselines/task_reference.py

references:
  elf_repo: ${TRTMC_ELF_REFERENCE_REPO}
  lance_repo: ${TRTMC_LANCE_REFERENCE_REPO}
  lerobot_repo: ${TRTMC_LEROBOT_SOURCE_DIR}
  sana_repo: ${TRTMC_SANA_WM_REFERENCE_REPO}
  sana_model: ${TRTMC_SANA_WM_MODEL_DIR}
  personaplex_repo: ${PERSONAPLEX_OFFICIAL_REPO}
  fast_foundation_stereo_model: ${TRTMC_FAST_FOUNDATION_STEREO_MODEL_DIR}

storage:
  storage_root: ${TRTMC_CHECK_STORAGE_ROOT}
  results_root: artifacts/perf
  scratch_root: artifacts/perf-scratch
  bundle_cache: ${TRTMC_PERF_BUNDLE_CACHE}
  bundle_roots: ${TRTMC_PERF_BUNDLE_ROOTS}
  runtime_root: ${TRTMC_PERF_RUNTIME_ROOT}
  bundle_retention: delete_always

execution:
  local_files_only: false
  hf_cache_mode: per_entry
  hf_cache_retention: delete_always
  timeout_seconds: 14400
