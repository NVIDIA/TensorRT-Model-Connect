implementation: text_generation_performance

timing:
  candidate:
    timing_scope: public_task_call_wall
    load_excluded: true
    warmup_excluded: true
    telemetry_in_timed_path: false
  reference:
    timing_scope: public_operation_call_wall
    model_load_excluded: true
    compile_excluded: true
    warmup_excluded: true

comparison:
  output_contract: exact_token_ids
  primary_metric: latency_ms.p50

metrics:
  - sample_count
  - latency_ms.p50
  - latency_ms.p95
  - request_throughput_per_s
  - output_tokens_per_s
