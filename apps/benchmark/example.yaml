# One run executes every model/case below. The benchmark depends only on the
# public build and Task APIs. Point runtime_root at an installed TRTMC lib dir.
runtime_root: /opt/trtmc/lib

# Existing bundles are reused; missing bundles are built once and cached.
bundle_roots:
  - /engines

defaults:
  telemetry:
    gpu: auto

models:
  - model: distilgpt2
    cases:
      - name: default

  - model: flux-schnell-l0
    cases:
      # Named cases are literal rows, not axes: this produces two runs.
      - name: fast
        set:
          request.num_steps: 4
      - name: standard
        set:
          request.num_steps: 20

  - model: chronos-bolt-tiny-official
    cases:
      - name: default
