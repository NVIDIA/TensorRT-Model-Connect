[build-system]
requires = ["setuptools>=68.0", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorrt-model-connect"
version = "0.1.0"
description = "TensorRT-Model-Connect builder for HuggingFace models and .trtfb bundles"
requires-python = ">=3.10"
dependencies = [
    "safetensors>=0.4",
    "numpy>=1.24",
    "ml_dtypes>=0.4",
    "onnx>=1.16",
    "onnxscript>=0.2",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "tensorrt>=10.16",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
# The native runtime backend DSO is built against the minimum TensorRT ABI above.

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2.2.2"]
test = ["pytest>=7.0", "torch>=2.0"]

[project.scripts]
trtmc = "tensorrt_model_connect.native_cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
tensorrt_model_connect = ["python_profiles.toml", "python_profile_requirements/*.txt", "bin/*"]
