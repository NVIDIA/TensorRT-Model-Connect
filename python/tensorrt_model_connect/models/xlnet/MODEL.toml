id = "xlnet"
aliases = [
  "xlnet",
]
prefixes = [
  "xlnet",
]
runtime_plugins = [
  "plugin.cpp|register_xlnet_plugin",
]
runtime_strategies = [
  "xlnet_encoder_only",
]
test_manifests = [
  "tests/manifests/xlnet-base-tp4.json",
  "tests/manifests/xlnet-base.json",
]

[e2e_defaults.encoder_only_nlp]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
