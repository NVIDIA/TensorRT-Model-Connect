id = "dpr"
aliases = [
  "dpr",
]
prefixes = [
  "dpr",
]
runtime_plugins = [
  "plugin.cpp|register_dpr_plugin",
]
runtime_strategies = [
  "dpr_encoder_only",
]
test_manifests = [
  "tests/manifests/dpr-ctx-encoder-tp4.json",
  "tests/manifests/dpr-ctx-encoder.json",
]

[e2e_defaults.encoder_only_nlp]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
