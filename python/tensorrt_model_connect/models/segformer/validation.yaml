schema_version: trtmc.validation-owner/v1
bindings:
  ade20k_semantic_segmentation:
    models:
    - segformer-b0-ade
    - segformer-b0-ade-tp4
    default_models:
    - segformer-b0-ade
    model_overrides:
      segformer-b0-ade:
