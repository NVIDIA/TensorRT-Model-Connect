id = "minimax_h3"
aliases = [
  "minimax-h3",
  "minimax_h3",
  "minimaxh3",
]
diffusion_pipeline_classes = [
  "MiniMaxH3ModularPipeline",
  "MiniMaxH3Pipeline",
]
hf_allow_patterns = [
  "model_index.json",
  "modular_model_index.json",
  "processor/**",
  "scheduler/**",
  "audio_scheduler/**",
  "text_encoder/**",
  "tokenizer/**",
  "transformer/**",
  "transformer_ref/**",
  "vae/**",
  "audio_vae/**",
]
runtime_plugins = [
  "plugin.cpp|register_minimax_h3_plugin",
]
runtime_config_schemas = [
  "config_schema.cpp|register_minimax_h3_schema",
]
runtime_strategies = [
  "diffusion_minimax_h3",
]
test_manifests = [
  "tests/manifests/minimax-h3-768p.json",
]

[model_reference_cache]
repository = "https://github.com/huggingface/diffusers.git"
revision = "abc5e9bf71fd38f53cd471bc3acaa84bc5ecbfdc"
relative_path = "minimax_h3/reference/diffusers-abc5e9bf71fd"
entrypoint = "src/diffusers/__init__.py"
environment_variable = "TRTMC_MINIMAX_H3_DIFFUSERS_REPO"

[e2e_defaults.diffusion_media_generation]
reference_backend = "hf_diffusers"
oracle_level = "L1_external_reference"
stages = [
  { name = "end_to_end", required = true },
]
input_fields = [
  { input = "prompt_file", manifest = "prompt_file" },
  { input = "video_num_frames", manifest = "video_num_frames" },
  { input = "video_height", manifest = "video_height" },
  { input = "video_width", manifest = "video_width" },
  { input = "num_inference_steps", manifest = "num_inference_steps" },
  { input = "fps", manifest = "fps" },
]
build_cli_args = [
  { flag = "--set", value = "minimax_h3.first_block_cache=true" },
  { flag = "--video-height", input = "video_height" },
  { flag = "--video-width", input = "video_width" },
  { flag = "--video-num-frames", input = "video_num_frames" },
  { flag = "--num-inference-steps", input = "num_inference_steps" },
]
