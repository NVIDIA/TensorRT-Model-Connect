id = "flux"
validation_entrypoint = "tools/validation.py|compute_diffusion_metrics"
ci_platform_prefixes = ["src/tokenizer/"]
aliases = [
  "flux",
  "flux.2",
]
prefixes = [
  "flux",
]
diffusion_pipeline_classes = [
  "Flux2Pipeline",
  "FluxPipeline",
]
hf_allow_patterns = [
  "model_index.json",
  "scheduler/**",
  "text_encoder/**",
  "text_encoder_2/**",
  "transformer/**",
  "vae/**",
  "tokenizer/**",
  "tokenizer_2/**",
  "*/config.json",
  "*/model.safetensors",
  "*/model-*.safetensors",
  "*/model.safetensors.index.json",
  "*/diffusion_pytorch_model.safetensors",
  "*/diffusion_pytorch_model-*.safetensors",
  "*/diffusion_pytorch_model.safetensors.index.json",
  "scheduler/*",
  "tokenizer/*",
]
hf_warm_files = [
  "flux-clip-metrics-openclip|laion/CLIP-ViT-B-32-laion2B-s34B-b79K|open_clip_pytorch_model.bin",
]
runtime_plugins = [
  "plugin.cpp|register_flux_plugin",
]
runtime_strategies = [
  "diffusion_flux",
]
test_manifests = [
  "tests/manifests/flux-2-dev-fp8-l0-tp4.json",
  "tests/manifests/flux-2-dev-fp8-l0.json",
  "tests/manifests/flux-2-dev-fp8.json",
  "tests/manifests/flux-2-dev-l0-tp4.json",
  "tests/manifests/flux-2-dev-l0.json",
  "tests/manifests/flux-2-dev.json",
  "tests/manifests/flux-schnell-l0-tp4.json",
  "tests/manifests/flux-schnell-l0-cp4.json",
  "tests/manifests/flux-schnell-l0-batch2.json",
  "tests/manifests/flux-schnell-l0.json",
  "tests/manifests/flux-schnell.json",
]

[e2e_defaults.diffusion_media_generation]
reference_backend = "hf_diffusers"
oracle_level = "L1_external_reference"
stages = [
  { name = "end_to_end", required = true },
]
input_fields = [
  { input = "image_height", manifest = "image_height" },
  { input = "image_width", manifest = "image_width" },
  { input = "video_num_frames", manifest = "video_num_frames" },
  { input = "video_height", manifest = "video_height", default = 480, required_manifest = "video_num_frames" },
  { input = "video_width", manifest = "video_width", default = 832, required_manifest = "video_num_frames" },
  { input = "num_inference_steps", manifest = "num_inference_steps", default = 30, required_manifest = "video_num_frames" },
  { input = "max_batch_size", manifest = "max_batch_size" },
]
preflight_requirements = [
  { kind = "python_module_available", args = { module = "diffusers", phase = "build" }, gating = true },
  { kind = "python_module_available", args = { module = "ftfy", phase = "build" }, gating = true },
]
build_cli_args = [
  { flag = "--image-height", input = "image_height" },
  { flag = "--image-width", input = "image_width" },
  { flag = "--video-height", input = "video_height" },
  { flag = "--video-width", input = "video_width" },
  { flag = "--video-num-frames", input = "video_num_frames" },
  { flag = "--num-inference-steps", input = "num_inference_steps" },
  { flag = "--max-batch-size", input = "max_batch_size" },
]
