id = "olmo"
capabilities = [
  "split_decoder_roles",
]
aliases = [
  "olmo",
]
prefixes = [
  "olmo",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "olmo_decoder_kv_cache",
]
diff_framework_check_classes = [
  "LayerDiffTest",
  "LayerProfileTest",
  "LogitDiffTest",
  "PerfBenchmarkTest",
  "RunnerParityTest",
]
runtime_plugins = [
  "plugin.cpp|register_olmo_plugin",
]
runtime_strategies = [
  "olmo_decoder_kv_cache",
]
test_manifests = [
  "tests/manifests/olmo-1b-tp4.json",
  "tests/manifests/olmo-1b.json",
]

[validation_profiles]
decoder_debug = [
  "olmo_decoder_kv_cache",
]

[e2e_defaults.text_generation_causal]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_generation", required = true },
]
