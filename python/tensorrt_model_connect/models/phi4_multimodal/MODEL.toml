id = "phi4_multimodal"
python_profile_specs = [
  "phi4_multimodal|models/phi4_multimodal/python_profile_requirements/phi4_multimodal.lock.txt|models/phi4_multimodal/python_profile_verify.py|true",
]
default_execution_profiles = [
  "reference|phi4_multimodal",
]
capabilities = [
  "split_decoder_roles",
]
aliases = [
  "phi4mm",
  "phi4_multimodal",
  "phi4multimodal",
]
prefixes = [
  "phi4_multimodal",
]
diff_framework_check_classes = [
  "VLPipelineTest",
]
runtime_plugins = [
  "plugin.cpp|register_phi4_multimodal_plugin",
]
runtime_strategies = [
  "phi4_multimodal_vision_language",
]
test_manifests = [
  "tests/manifests/phi4-multimodal.json",
]

[e2e_defaults.vision_language_generation]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "vision_encode", required = true },
  { name = "full_generation", required = true },
]
input_fields = [
  { input = "image", manifest = "test_image" },
]
preflight_asset_fields = [
  "test_image",
]
