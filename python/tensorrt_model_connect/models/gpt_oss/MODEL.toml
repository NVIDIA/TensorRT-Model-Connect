id = "gpt_oss"
capabilities = [
  "debug_layer_outputs",
]
aliases = [
  "gpt_oss",
  "gptoss",
]
prefixes = [
  "gpt_oss",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "gpt_oss_decoder_moe",
]
diff_framework_check_classes = [
  "LayerDiffTest",
  "LayerProfileTest",
  "LogitDiffTest",
  "PerfBenchmarkTest",
  "RunnerParityTest",
]
runtime_plugins = [
  "plugin.cpp|register_gpt_oss_plugin",
]
runtime_strategies = [
  "gpt_oss_decoder_moe",
]
test_manifests = [
  "tests/manifests/gpt-oss-20b-l0-tp4.json",
  "tests/manifests/gpt-oss-20b-l0.json",
  "tests/manifests/gpt-oss-20b.json",
]

[validation_profiles]
decoder_debug = [
  "gpt_oss_decoder_moe",
]

[e2e_defaults.text_generation_causal]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_generation", required = true },
]
