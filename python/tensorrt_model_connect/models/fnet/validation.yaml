schema_version: trtmc.validation-owner/v1
bindings:
  stsbenchmark_encoder_embedding_parity:
    models:
    - fnet-base
    - fnet-base-tp4
    default_models:
    - fnet-base
    model_profiles:
      fnet-base:
        gates:
          min_vector_cosine: 0.6
          # The reviewed 0.6 vector-cosine contract permits larger drift in the
          # second-order cosine between two independently drifted vectors.
          max_pair_cosine_abs_delta: 0.1
    qualification:
      fnet-base: {}
