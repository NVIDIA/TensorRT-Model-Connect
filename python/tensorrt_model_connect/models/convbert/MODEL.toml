id = "convbert"
aliases = [
  "convbert",
]
prefixes = [
  "convbert",
]
runtime_plugins = [
  "plugin.cpp|register_convbert_plugin",
]
runtime_strategies = [
  "convbert_encoder_only",
]
test_manifests = [
  "tests/manifests/convbert-base-tp2.json",
  "tests/manifests/convbert-base.json",
]

[e2e_defaults.encoder_only_nlp]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
