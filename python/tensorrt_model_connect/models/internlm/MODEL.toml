id = "internlm"
capabilities = [
  "split_decoder_roles",
  "debug_layer_outputs",
]
python_profile_specs = [
  "internlm|models/internlm/python_profile_requirements/internlm.lock.txt|models/internlm/python_profile_verify.py|true",
]
default_execution_profiles = [
  "build|internlm",
  "runtime|internlm",
  "reference|internlm",
]
hf_warm_files = [
  "internlm-official-tokenizer-json|internlm/internlm2-step-prover|tokenizer.json|6c727046190546168bf3aba9a1d78d5fb325ff14",
]
aliases = [
  "internlm",
  "internlm2",
]
prefixes = [
  "internlm",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "internlm_decoder_kv_cache",
]
diff_framework_check_classes = [
  "LayerDiffTest",
  "LayerProfileTest",
  "LogitDiffTest",
  "PerfBenchmarkTest",
  "RunnerParityTest",
]
runtime_plugins = [
  "plugin.cpp|register_internlm_plugin",
]
runtime_strategies = [
  "internlm_decoder_kv_cache",
]
test_manifests = [
  "tests/manifests/internlm2-1.8b-tp4.json",
  "tests/manifests/internlm2-1.8b.json",
]

[validation_profiles]
decoder_debug = [
  "internlm_decoder_kv_cache",
]
[e2e_defaults.text_generation_causal]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_generation", required = true },
]
