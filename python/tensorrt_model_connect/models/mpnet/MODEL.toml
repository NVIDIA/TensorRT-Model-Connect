id = "mpnet"
aliases = [
  "mpnet",
]
prefixes = [
  "mpnet",
]
runtime_plugins = [
  "plugin.cpp|register_mpnet_plugin",
]
runtime_strategies = [
  "mpnet_encoder_only",
]
test_manifests = [
  "tests/manifests/all-mpnet-base-v2-tp4.json",
  "tests/manifests/all-mpnet-base-v2.json",
]

[e2e_defaults.encoder_only_nlp]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
