id = "distilbert"
aliases = [
  "distilbert",
]
prefixes = [
  "distilbert",
]
runtime_plugins = [
  "plugin.cpp|register_distilbert_plugin",
]
runtime_strategies = [
  "distilbert_encoder_only",
]
test_manifests = [
  "tests/manifests/distilbert-base-uncased-tp4.json",
  "tests/manifests/distilbert-base-uncased.json",
]

[e2e_defaults.encoder_only_nlp]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
