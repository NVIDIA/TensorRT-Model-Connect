schema_version: trtmc.validation-owner/v1
bindings:
  etth1_time_series_parity:
    models:
    - patchtsmixer-granite-official
    - patchtsmixer-granite-official-tp4
    default_models:
    - patchtsmixer-granite-official
    model_profiles:
      patchtsmixer-granite-official:
        gates:
          max_relative_l2: 0.0005
          max_absolute_error: 0.025
    model_overrides:
      patchtsmixer-granite-official:
        time_series:
          input_columns:
          - HUFL
          - HULL
          - MUFL
          - MULL
          - LUFL
          - LULL
          - OT
          target_columns:
          - HUFL
          - HULL
          - MUFL
          - MULL
          - LUFL
          - LULL
          - OT
          input_key: field_input
          context_length: 512
          prediction_length: 96
          stride: 24
          test_fraction: 0.2
    qualification:
      patchtsmixer-granite-official: {}
