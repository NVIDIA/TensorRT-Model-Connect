id = "chronos_bolt"
python_profile_specs = [
  "chronos|models/chronos_bolt/python_profile_requirements/chronos.lock.txt|models/chronos_bolt/python_profile_verify.py|true",
]
default_execution_profiles = [
  "build|chronos",
  "reference|chronos",
]
aliases = [
  "chronos_bolt",
  "chronos-bolt",
  "chronosbolt",
]
architecture_patterns = [
  "ChronosBoltModelForForecasting",
]
prefixes = [
  "chronos_bolt",
  "chronos-bolt",
  "chronosbolt",
]
runtime_plugins = [
  "plugin.cpp|register_chronos_bolt_plugin",
]
runtime_strategies = [
  "chronos_bolt_trt",
]
test_manifests = [
  "tests/manifests/chronos-bolt-tiny-official-tp4.json",
  "tests/manifests/chronos-bolt-tiny-official.json",
]

[e2e_defaults.neural_operator]
reference_backend = "torch_reference"
oracle_level = "L2_internal_reference"
stages = [
  { name = "full_inference", required = true },
]
input_fields = [
  { input = "field_input", manifest = "field_input" },
  { input = "branch_input", manifest = "branch_input" },
  { input = "trunk_input", manifest = "trunk_input" },
  { input = "output_field", manifest = "output_field" },
]
