id = "deberta"
aliases = [
  "deberta",
]
prefixes = [
  "deberta",
]
runtime_plugins = [
  "plugin.cpp|register_deberta_plugin",
]
runtime_strategies = [
  "deberta_encoder_only",
]
test_manifests = [
  "tests/manifests/deberta-base-tp4.json",
  "tests/manifests/deberta-base.json",
]

[e2e_defaults.encoder_only_nlp]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
