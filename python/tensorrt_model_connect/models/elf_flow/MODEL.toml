id = "elf_flow"
python_profile_specs = [
  "elf_flow|models/elf_flow/python_profile_requirements/elf_flow.lock.txt|models/elf_flow/python_profile_verify.py|true",
  "elf_flow_reference|models/elf_flow/python_profile_requirements/elf_flow_reference.lock.txt|models/elf_flow/python_profile_reference_verify.py|true",
]
default_execution_profiles = [
  "build|elf_flow",
  "reference|elf_flow_reference",
]
config_adapter = "model_config.py|config_from_dir"
model_dir_adapter = "prepare_model_dir.py|resolve_model_dir"
hf_warm_dependencies = [
  "elf-tokenizer|google-t5/t5-small",
]
hf_warm_files = [
  "elf-t5-encoder|embedded-language-flows/t5_small_encoder_jax|t5_small_encoder_jax.pkl",
]
hf_allow_patterns = [
  "*.yml",
  "*.yaml",
  "checkpoint_*",
  "checkpoint_*/**",
  "model.npz",
  "elf_params.npz",
]
aliases = [
  "elf",
  "elf_flow",
  "elfflow",
  "embedded_language_flow",
]
prefixes = [
  "elf_flow",
]
runtime_plugins = [
  "plugin.cpp|register_elf_flow_plugin",
]
runtime_strategies = [
  "elf_flow",
]
test_manifests = [
  "tests/manifests/elf-b-de-en-l0.json",
  "tests/manifests/elf-b-owt-l0.json",
  "tests/manifests/elf-b-xsum-l0.json",
]

[model_reference_cache]
repository = "https://github.com/lillian039/ELF.git"
revision = "b29d8833609e9ab7f67cd9da39435ac5cea04837"
relative_path = "elf_flow/reference/ELF-b29d8833609e"
entrypoint = "src/eval.py"
comparison_argument = "--elf-reference-repo"

[e2e_defaults.diffusion_text_generation]
reference_backend = "upstream_replay"
oracle_level = "L1_external_reference"
stages = [
  { name = "decoded_text", required = true },
]
