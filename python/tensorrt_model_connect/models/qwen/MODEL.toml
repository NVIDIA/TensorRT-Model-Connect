id = "qwen"
capabilities = [
  "split_decoder_roles",
  "debug_layer_outputs",
]
aliases = [
  "qwen",
  "Qwen2",
  "qwen2",
  "qwen3",
  "qwq",
]
prefixes = [
  "qwen",
  "qwq",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "qwen_decoder_kv_cache",
]
diff_framework_check_classes = [
  "LayerDiffTest",
  "LayerProfileTest",
  "LogitDiffTest",
  "PerfBenchmarkTest",
  "RunnerParityTest",
]
runtime_plugins = [
  "plugin.cpp|register_qwen_plugin",
]
runtime_strategies = [
  "qwen_decoder_kv_cache",
]
test_manifests = [
  "tests/manifests/qwen3-0.6b-fp16-tp4.json",
  "tests/manifests/qwen3-0.6b-fp16.json",
  "tests/manifests/qwen3-0.6b-regression-native-kv-chunked-prefill.json",
  "tests/manifests/qwen3-0.6b-native-l0.json",
  "tests/manifests/qwen3-0.6b-fp8-tp4.json",
  "tests/manifests/qwen3-0.6b-fp8.json",
  "tests/manifests/qwen3-0.6b-topp-tp4.json",
  "tests/manifests/qwen3-0.6b-topp.json",
  "tests/manifests/qwen3-4b-instruct-2507-tp4.json",
  "tests/manifests/qwen3-4b-instruct-2507.json",
]

[validation_profiles]
decoder_debug = [
  "qwen_decoder_kv_cache",
]

[e2e_defaults.text_generation_causal]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
preflight_asset_fields = [
  "prompt_file",
]
input_fields = [
  { input = "prompt_file", manifest = "prompt_file" },
  { input = "prompt_repeat", manifest = "prompt_repeat" },
  { input = "expected_prompt_tokens", manifest = "expected_prompt_tokens" },
]
stages = [
  { name = "full_generation", required = true },
]
