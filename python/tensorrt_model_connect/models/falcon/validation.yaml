schema_version: trtmc.validation-owner/v1
bindings:
  mmlu_continuation_parity:
    models:
    - falcon-rw-1b
    - falcon-rw-1b-tp4
    default_models:
    - falcon-rw-1b
    model_overrides:
      falcon-rw-1b:
        # This checkpoint is numerically sensitive in FP16. Compare both sides
        # in FP32 instead of measuring different FP16 kernel rounding.
        comparison_precision: fp32
    qualification:
      falcon-rw-1b: {}
