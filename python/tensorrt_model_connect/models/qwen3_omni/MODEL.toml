id = "qwen3_omni"
aliases = [
  "qwen3_omni",
  "qwen3_omni_moe",
  "qwen3omni",
]
prefixes = [
  "qwen3_omni",
]
runtime_plugins = [
  "plugin.cpp|register_qwen3_omni_plugin",
]
runtime_strategies = [
  "qwen3_omni_multimodal",
]
test_manifests = [
  "tests/manifests/qwen3-omni-30b-a3b-instruct.json",
]

[e2e_defaults.omni_multimodal]
reference_backend = "torch_reference"
oracle_level = "L1_external_reference"
stages = [
  { name = "thinker_decode", required = true },
  { name = "vision_encode", required = false },
  { name = "audio_encode", required = false },
  { name = "talker_decode", required = true },
  { name = "end_to_end", required = true },
]
