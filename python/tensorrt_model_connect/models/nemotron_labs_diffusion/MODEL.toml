id = "nemotron_labs_diffusion"
aliases = [
  "nemotron_labs_diffusion",
  "nemotronlabsdiffusion",
]
prefixes = [
  "nemotron_labs_diffusion",
]
hf_allow_patterns = [
  "linear_spec_lora/**",
]
hf_required_files = [
  "nvidia/Nemotron-Labs-Diffusion-8B|linear_spec_lora/adapter_config.json",
  "nvidia/Nemotron-Labs-Diffusion-8B|linear_spec_lora/adapter_model.safetensors",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "nemotron_labs_diffusion",
]
runtime_plugins = [
  "plugin.cpp|register_nemotron_labs_diffusion_plugin",
]
runtime_strategies = [
  "nemotron_labs_diffusion",
]
test_manifests = [
  "tests/manifests/nemotron-labs-diffusion-8b-l0.json",
  "tests/manifests/nemotron-labs-diffusion-8b.json",
]

[validation_profiles]
decoder_debug = [
  "nemotron_labs_diffusion",
]
[e2e_defaults.text_generation_causal]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_generation", required = true },
]
