schema_version: trtmc.validation-owner/v1
bindings:
  humaneval_code_continuation_parity:
    models:
    - codegen-350m
    default_models:
    - codegen-350m
    model_profiles:
      codegen-350m:
        gates:
          # Greedy continuations are deterministic; every token divergence is
          # an accuracy regression.
          min_exact_match_rate: 1.0
    model_overrides:
      codegen-350m:
        build_generation_headroom: true
    qualification:
      codegen-350m: {}
