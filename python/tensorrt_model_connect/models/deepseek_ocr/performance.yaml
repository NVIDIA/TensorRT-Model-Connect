schema_version: trtmc.perf-owner/v1
entries:
- id: deepseek_ocr.generate
  operation: generate
  model: deepseek-ocr
  workload:
    testcase: deepseek-ocr
  baseline:
    runner: task-reference
    adapter: hf-transformers-vlm
    mode: hf-eager
    reference_backend: hf_transformers
    timing_scope: task-pipeline-call-wall
    asset_loading_included: true
    precision: bf16
    output_contract: ocr-text
    max_normalized_edit_distance: 0.5
    required_substrings:
    - Architecture
    - Attention:Standard Q/K/V/O
    - RoPE:Standard rotary position embeddings
    - Layer 0:Dense SwiGLU MLP
    - Layers 1-11:MoE
    - 'Vision: SAM ViT-B + Qwen2 encoder'
