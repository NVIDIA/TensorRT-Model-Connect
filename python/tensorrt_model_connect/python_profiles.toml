version = 1

[profiles.base]
kind = "passthrough"

[profiles.reference_common]
kind = "venv"
requirements = "python_profile_requirements/reference_common.lock.txt"
system_site_packages = true
verification_script = """
from importlib.metadata import version
import ftfy
import open_clip
import sacrebleu
import transformers
assert transformers.__version__ == "5.2.0", transformers.__version__
assert version("huggingface-hub") == "1.22.0"
assert version("tokenizers") == "0.22.2"
assert version("open-clip-torch") == "3.3.0"
assert version("ftfy") == "6.3.1"
assert version("rouge-score") == "0.1.2"
assert version("sacrebleu") == "2.5.1"
assert version("colorama") == "0.4.6"
assert version("portalocker") == "3.2.0"
assert version("tabulate") == "0.10.0"
assert version("lxml") == "6.1.1"
assert version("Jinja2") == "3.1.6"
assert version("MarkupSafe") == "3.0.3"
"""

[reference_backend_defaults.golden_snapshot]
reference = "base"
