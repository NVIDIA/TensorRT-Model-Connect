id = "qwen_image"
plugin = "qwen_image"
python_profile_specs = [
  "qwen_image_reference|families/qwen_image/python_profile_requirements/qwen_image_reference.lock.txt|families/qwen_image/python_profile_verify.py|true",
]
default_execution_profiles = [
  "reference|qwen_image_reference",
]
module = "plugin"
aliases = [
  "qwen-image",
  "qwen_image",
  "qwen-image-edit",
  "qwen_image_edit",
  "qwenimage",
  "qwenimageedit",
]
prefixes = [
  "qwen_image",
]
diffusion_pipeline_classes = [
  "QwenImageEditPipeline",
  "QwenImageEditPlusPipeline",
  "QwenImagePipeline",
]
hf_allow_patterns = [
  "model_index.json",
  "scheduler/**",
  "text_encoder/**",
  "text_encoder_2/**",
  "transformer/**",
  "vae/**",
  "tokenizer/**",
  "tokenizer_2/**",
  "*/config.json",
  "*/model.safetensors",
  "*/model-*.safetensors",
  "*/model.safetensors.index.json",
  "*/diffusion_pytorch_model.safetensors",
  "*/diffusion_pytorch_model-*.safetensors",
  "*/diffusion_pytorch_model.safetensors.index.json",
  "scheduler/*",
  "tokenizer/*",
]
