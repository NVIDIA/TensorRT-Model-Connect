id = "minimax_h3"
plugin = "minimax_h3"
module = "plugin"
python_profile_specs = [
  "minimax_h3_reference|families/minimax_h3/python_profile_requirements/minimax_h3_reference.lock.txt|families/minimax_h3/python_profile_reference_verify.py|true|true",
]
default_execution_profiles = [
  "reference|minimax_h3_reference",
]
aliases = [
  "minimax-h3",
  "minimax_h3",
  "minimaxh3",
]
diffusion_pipeline_classes = [
  "MiniMaxH3ModularPipeline",
  "MiniMaxH3Pipeline",
]
hf_allow_patterns = [
  "model_index.json",
  "modular_model_index.json",
  "processor/**",
  "scheduler/**",
  "audio_scheduler/**",
  "text_encoder/**",
  "tokenizer/**",
  "transformer/**",
  "transformer_ref/**",
  "vae/**",
  "audio_vae/**",
]
