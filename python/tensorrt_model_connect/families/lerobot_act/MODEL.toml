id = "lerobot_act"
plugin = "lerobot_act"
module = "plugin"
python_profile_specs = [
  "lerobot_act_reference|families/lerobot_act/python_profile_requirements/lerobot_act_reference.lock.txt|families/lerobot_act/python_profile_verify.py|true",
]
default_execution_profiles = [
  "runtime|lerobot_act_reference",
  "reference|lerobot_act_reference",
]
config_adapter = "plugin.py|config_from_dir"
hf_allow_patterns = [
  "config.json",
  "model.safetensors",
  "train_config.json",
  "eval_info.json",
  "README.md",
]
aliases = [
  "act",
  "act-policy",
  "ACTPolicy",
  "lerobot_act",
]
prefixes = [
  "act_",
  "lerobot_act",
]
