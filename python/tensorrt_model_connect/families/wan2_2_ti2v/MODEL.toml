id = "wan2_2_ti2v"
plugin = "wan2_2_ti2v"
module = "plugin"
aliases = [
  "ti2v",
  "ti2v-5b",
  "wan2.2-ti2v-5b",
  "wan2_2_ti2v",
  "wan2_2_ti2v_5b",
  "wanmodel",
  "wanpipeline",
]
prefixes = [
  "wan2_2_ti2v",
  "wan2.2-ti2v",
]
diffusion_pipeline_classes = [
  "WanModel",
  "WanPipeline",
]
default_build_precision = "bf16"
supported_build_precisions = ["bf16"]
# PyTorch is used only to deserialize the official T5/VAE checkpoint weights
# while building.  It is never linked or loaded by the native runtime.
build_python_modules = ["torch"]
build_dependency_extra = "wan"
hf_allow_patterns = [
  "config.json",
  "configuration.json",
  "diffusion_pytorch_model*.safetensors",
  "diffusion_pytorch_model.safetensors.index.json",
  "Wan2.2_VAE.pth",
  "models_t5_umt5-xxl-enc-bf16.pth",
  "google/umt5-xxl/**",
]
# Nightly runs an independent official Diffusers reference. This dependency is
# warmed for every WAN2.2 CI lane because model-proof uses a hermetic offline HF
# cache; L0 still selects invariant_only and does not execute reference inference.
hf_warm_dependencies = [
  "wan22-ti2v-5b-diffusers-reference|Wan-AI/Wan2.2-TI2V-5B-Diffusers",
]
hf_required_files = [
  "Wan-AI/Wan2.2-TI2V-5B|config.json",
  "Wan-AI/Wan2.2-TI2V-5B|diffusion_pytorch_model.safetensors.index.json",
  "Wan-AI/Wan2.2-TI2V-5B|diffusion_pytorch_model-00001-of-00003.safetensors",
  "Wan-AI/Wan2.2-TI2V-5B|diffusion_pytorch_model-00002-of-00003.safetensors",
  "Wan-AI/Wan2.2-TI2V-5B|diffusion_pytorch_model-00003-of-00003.safetensors",
  "Wan-AI/Wan2.2-TI2V-5B|Wan2.2_VAE.pth",
  "Wan-AI/Wan2.2-TI2V-5B|models_t5_umt5-xxl-enc-bf16.pth",
  "Wan-AI/Wan2.2-TI2V-5B|google/umt5-xxl/tokenizer.json",
]

# The builder owns this exact source-bound section set. Python/PyTorch are
# checkpoint conversion dependencies only. The one TRT-ABI-specific AOT
# plugin image is embedded so the resulting .trtfb is the sole model artifact.
runtime_implementation = "native_cpp_cuda_tensorrt"
bundle_required_sections = [
  "text_encoder_0_plan",
  "denoiser_plan",
  "vae_decoder_plan",
  "vae_decoder_first_frame_plan",
  "tokenizer.json",
  "wan2_2_ti2v_plugins.so",
  "config.json",
]
runtime_dependencies = ["trtmc_core", "cuda", "tensorrt", "cudnn", "cublaslt", "nvrtc"]
forbidden_runtime_dependencies = ["python", "pytorch", "libpython", "libtorch"]
