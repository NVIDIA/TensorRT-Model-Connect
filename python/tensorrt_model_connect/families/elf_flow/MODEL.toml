id = "elf_flow"
plugin = "elf_flow"
module = "plugin"
config_adapter = "model_config.py|config_from_dir"
hf_allow_patterns = [
  "*.yml",
  "*.yaml",
  "checkpoint_*",
  "checkpoint_*/**",
  "model.npz",
  "elf_params.npz",
]
aliases = [
  "elf",
  "elf_flow",
  "elfflow",
  "embedded_language_flow",
]
prefixes = [
  "elf_flow",
]
