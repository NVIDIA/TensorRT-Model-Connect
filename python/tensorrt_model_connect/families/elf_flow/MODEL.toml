id = "elf_flow"
plugin = "elf_flow"
python_profile_specs = [
  "elf_flow|families/elf_flow/python_profile_requirements/elf_flow.lock.txt|families/elf_flow/python_profile_verify.py|true",
  "elf_flow_reference|families/elf_flow/python_profile_requirements/elf_flow_reference.lock.txt|families/elf_flow/python_profile_reference_verify.py|true",
]
default_execution_profiles = [
  "build|elf_flow",
  "reference|elf_flow_reference",
]
module = "plugin"
config_adapter = "model_config.py|config_from_dir"
model_dir_adapter = "prepare_model_dir.py|resolve_model_dir"
hf_warm_dependencies = [
  "elf-tokenizer|google-t5/t5-small",
]
hf_warm_files = [
  "elf-t5-encoder|embedded-language-flows/t5_small_encoder_jax|t5_small_encoder_jax.pkl",
]
hf_allow_patterns = [
  "*.yml",
  "*.yaml",
  "checkpoint_*",
  "checkpoint_*/**",
  "model.npz",
  "elf_params.npz",
]
aliases = [
  "elf",
  "elf_flow",
  "elfflow",
  "embedded_language_flow",
]
prefixes = [
  "elf_flow",
]
