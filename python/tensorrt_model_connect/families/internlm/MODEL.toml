id = "internlm"
plugin = "internlm"
module = "plugin"
capabilities = ["native_cpp_logits_trace", "native_kv_cache", "split_decoder_roles"]
python_profile_specs = [
  "internlm|families/internlm/python_profile_requirements/internlm.lock.txt|families/internlm/python_profile_verify.py|true",
]
default_execution_profiles = [
  "build|internlm",
  "runtime|internlm",
  "reference|internlm",
]
aliases = [
  "internlm",
  "internlm2",
]
prefixes = [
  "internlm",
]
default_build_route = "build_routing.py|prefer_native_default"
