id = "internlm"
plugin = "internlm"
module = "plugin"
capabilities = ["split_decoder_roles", "debug_layer_outputs"]
python_profile_specs = [
  "internlm|families/internlm/python_profile_requirements/internlm.lock.txt|families/internlm/python_profile_verify.py|true",
]
default_execution_profiles = [
  "build|internlm",
  "runtime|internlm",
  "reference|internlm",
]
hf_warm_files = [
  "internlm-official-tokenizer-json|internlm/internlm2-step-prover|tokenizer.json|6c727046190546168bf3aba9a1d78d5fb325ff14",
]
aliases = [
  "internlm",
  "internlm2",
]
prefixes = [
  "internlm",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "internlm_decoder_kv_cache",
]
