id = "xglm"
plugin = "xglm"
module = "plugin"
capabilities = ["split_decoder_roles"]
python_profile_specs = [
  "xglm_tokenizer|families/xglm/python_profile_requirements/xglm_tokenizer.lock.txt|families/xglm/python_profile_verify.py|true",
]
default_execution_profiles = [
  "build|xglm_tokenizer",
  "reference|xglm_tokenizer",
]
aliases = [
  "xglm",
]
prefixes = [
  "xglm",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "xglm_decoder_kv_cache",
]
