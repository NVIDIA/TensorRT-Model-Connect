id = "nemotron_h"
plugin = "nemotron_h"
module = "plugin"
python_profile_specs = [
  "nemotron_h_reference|families/nemotron_h/profiles/requirements/nemotron_h_reference.lock.txt|families/nemotron_h/profiles/verify.py|true",
]
default_execution_profiles = [
  "reference|nemotron_h_reference",
]
