id = "k2_horizon"
plugin = "k2_horizon"
module = "plugin"
hf_allow_patterns = [
  "pytorch_model-*.safetensors",
]
python_profile_specs = [
  "k2_horizon_reference|families/k2_horizon/python_profile_requirements/reference.lock.txt|families/k2_horizon/python_profile_verify.py|true",
]
aliases = [
  "k2_horizon",
]
prefixes = [
  "k2-horizon",
  "k2_horizon",
]
debug_runner = "debug_runner.py|runner_from_bundle"
debug_runtime_strategies = [
  "k2_horizon_decoder_kv_cache",
]
