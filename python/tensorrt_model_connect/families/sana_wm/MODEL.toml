id = "sana_wm"
plugin = "sana_wm"
module = "plugin"
config_adapter = "model_config.py|config_from_dir"
aliases = [
  "sana-wm",
  "sana_wm",
  "sanamsvideocamctrl_1600m_p1_d20",
]
prefixes = [
  "sana_wm",
]
hf_warm_dependencies = [
  "stage-1-text-encoder|Efficient-Large-Model/gemma-2-2b-it",
]
