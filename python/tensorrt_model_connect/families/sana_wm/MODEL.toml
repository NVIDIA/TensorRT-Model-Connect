  "sana_wm",
]
hf_warm_dependencies = [
  "stage-1-text-encoder|Efficient-Large-Model/gemma-2-2b-it",
]
hf_warm_files = [
  "official-reference-license|Efficient-Large-Model/SANA-WM_bidirectional|LICENSE",
]
hf_allow_patterns = [
  "README.md",
  "config.yaml",
  "model_index.json",
  "pipeline*.py",
  "asset/sana_wm/**",
  "inference_video_scripts/**",
  "scheduler/**",
  "dit/**",
  "vae/**",
  "text_encoder/**",
  "refiner/**",
]
