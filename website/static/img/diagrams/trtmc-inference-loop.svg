<title id="trtmc-inference-loop-svg-title">Text generation prefill and decode loop</title>
<desc id="trtmc-inference-loop-svg-description">Prompt text is tokenized and processed once during prefill; decoding then reuses the KV cache to produce logits, sample one token, append it, and repeat until a stop condition returns TextResult.</desc>
