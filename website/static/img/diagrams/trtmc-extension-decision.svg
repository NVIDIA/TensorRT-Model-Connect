<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">TensorRT Model Connect extension paths</title>
  <desc id="desc">Decision tree separating native model support, exact-qualified optimized support, and shared public-contract changes. Native bundles use installed model and backend DSOs; optimized bundles embed an implementation DSO. Both paths rely on compatible host driver, CUDA, TensorRT, loader, and system libraries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:800;fill:#101828}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#475467}
      .label{font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:800;fill:#101828}
      .small{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#475467}
      .path{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:700;fill:#344054}
      .badge{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:800;fill:#344054}
      .card{fill:#fff;stroke:#d0d7e2;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="758" rx="18" fill="#fbfcfe" stroke="#d0d7e2"/>
  <text x="48" y="52" class="title">Choose the owning extension path</text>
  <text x="48" y="80" class="subtitle">Model support has two different contracts; shared API changes are a separate decision.</text>

  <rect x="382" y="104" width="356" height="60" rx="16" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="560" y="129" text-anchor="middle" class="label">What are you extending?</text>
  <text x="560" y="150" text-anchor="middle" class="small">Select one ownership path.</text>

  <path d="M500 164 L203 194" class="line"/>
  <path d="M560 164 L560 194" class="line"/>
  <path d="M620 164 L917 194" class="line"/>

  <g>
    <rect x="40" y="194" width="326" height="272" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="203" y="230" text-anchor="middle" class="label">Native model support</text>
    <text x="64" y="268" class="small">• Python FamilyPlugin + MODEL.toml</text>
    <text x="64" y="298" class="small">• unique native runtime_strategy</text>
    <text x="64" y="328" class="small">• installed model + backend DSOs</text>
    <text x="64" y="358" class="small">• native E2E JSON manifest</text>
    <rect x="94" y="394" width="218" height="34" rx="17" fill="#dcfce7"/>
    <text x="203" y="416" text-anchor="middle" class="path">native .trtfb bundle</text>
    <text x="203" y="449" text-anchor="middle" class="badge">strategy index owns dispatch</text>
  </g>

  <g>
    <rect x="397" y="194" width="326" height="272" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="560" y="230" text-anchor="middle" class="label">Exact-qualified optimized</text>
    <text x="421" y="268" class="small">• existing-family implementation/profile</text>
    <text x="421" y="298" class="small">• isolated adapter + qualification TOML</text>
    <text x="421" y="328" class="small">• optimized_runtime.json</text>
    <text x="421" y="358" class="small">• embedded libtrtmc_impl_*.so</text>
    <rect x="436" y="394" width="248" height="34" rx="17" fill="#fef3c7"/>
    <text x="560" y="416" text-anchor="middle" class="path">optimized .trtfb bundle</text>
    <text x="560" y="449" text-anchor="middle" class="badge">no synthetic native strategy or model DSO</text>
  </g>

  <g>
    <rect x="754" y="194" width="326" height="272" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="917" y="230" text-anchor="middle" class="label">Shared or public contract</text>
    <text x="778" y="268" class="small">• IPipeline, config schema, or CLI</text>
    <text x="778" y="298" class="small">• change only for a user-visible contract</text>
    <text x="778" y="328" class="small">• prove both affected runtime paths</text>
    <text x="778" y="358" class="small">• update tests and documentation</text>
    <rect x="788" y="394" width="258" height="34" rx="17" fill="#ede9fe"/>
    <text x="917" y="416" text-anchor="middle" class="path">C-facing callers need a C++ shim</text>
    <text x="917" y="449" text-anchor="middle" class="badge">no stable, complete C ABI exists</text>
  </g>

  <path d="M203 466 L203 510" class="line"/>
  <path d="M560 466 L560 488 L840 488 L840 510" class="line"/>

  <g>
    <rect x="80" y="510" width="430" height="100" rx="16" class="card"/>
    <text x="295" y="542" text-anchor="middle" class="label">Native runtime resolution</text>
    <text x="295" y="570" text-anchor="middle" class="small">runtime_strategy index → installed model DSO</text>
    <text x="295" y="594" text-anchor="middle" class="small">→ installed TensorRT backend DSO</text>
  </g>

  <g>
    <rect x="610" y="510" width="430" height="100" rx="16" class="card"/>
    <text x="825" y="542" text-anchor="middle" class="label">Optimized runtime resolution</text>
    <text x="825" y="570" text-anchor="middle" class="small">optimized-runtime host verifies the artifact tree</text>
    <text x="825" y="594" text-anchor="middle" class="small">→ loads the embedded implementation DSO</text>
  </g>

  <path d="M295 610 L295 646" class="line"/>
  <path d="M825 610 L825 646" class="line"/>

  <rect x="80" y="646" width="960" height="78" rx="16" fill="#fff" stroke="#fda29b" stroke-width="2"/>
  <text x="560" y="676" text-anchor="middle" class="label">External runtime dependencies stay on the host</text>
  <text x="560" y="701" text-anchor="middle" class="small">Compatible NVIDIA driver, CUDA runtime, TensorRT, dynamic loader, and system libraries</text>
  <text x="560" y="718" text-anchor="middle" class="badge">Neither bundle path is a complete operating-system or GPU-runtime image.</text>
</svg>
