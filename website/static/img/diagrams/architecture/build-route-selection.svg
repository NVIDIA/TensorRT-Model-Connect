<title id="architecture-build-route-selection-svg-title">Native and optimized build-route selection</title>
<desc id="architecture-build-route-selection-svg-description">The builder resolves the owning family, accepts a family-owned native default immediately, otherwise probes only exact family profiles and selects either one optimized adapter, the native builder, or a terminal ambiguity error.</desc>
