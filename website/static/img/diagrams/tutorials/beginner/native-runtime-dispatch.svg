<title id="tutorials-beginner-native-runtime-dispatch-svg-title">Native runtime dispatch</title>
<desc id="tutorials-beginner-native-runtime-dispatch-svg-description">Native bundle metadata selects a runtime strategy, the generated index loads the owning model DSO, the registry resolves its plugin, and that plugin creates a concrete task pipeline backed by the selected backend.</desc>
