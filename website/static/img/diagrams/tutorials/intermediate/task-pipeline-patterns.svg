<title id="tutorials-intermediate-task-pipeline-patterns-svg-title">Shared task pipeline pattern</title>
<desc id="tutorials-intermediate-task-pipeline-patterns-svg-description">Every task accepts typed input, performs task-owned preprocessing, executes one or more TensorRT engines, postprocesses the outputs, and returns a typed result; the repeated work differs by task.</desc>
