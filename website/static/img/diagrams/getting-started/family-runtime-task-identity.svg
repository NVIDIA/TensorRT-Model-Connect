<title id="getting-started-family-runtime-task-identity-svg-title">Family, task, and backend are separate identities</title>
<desc id="getting-started-family-runtime-task-identity-svg-description">The family selects one independent build and runtime owner, the task names the abstract user behavior it implements, and the backend supplies the model-independent Engine API.</desc>
