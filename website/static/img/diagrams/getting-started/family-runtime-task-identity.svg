<title id="getting-started-family-runtime-task-identity-svg-title">Family, runtime strategy, and task strategy are different identities</title>
<desc id="getting-started-family-runtime-task-identity-svg-description">Qwen, Llama, and Whisper examples show that Python build ownership maps to a model-owned native runtime strategy, while multiple implementations can satisfy the same shared task contract.</desc>
