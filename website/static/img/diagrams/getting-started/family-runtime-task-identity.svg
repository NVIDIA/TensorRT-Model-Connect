<title id="getting-started-family-runtime-task-identity-svg-title">Model owner, runtime strategy, and task strategy are different identities</title>
<desc id="getting-started-family-runtime-task-identity-svg-description">Qwen, Llama, and Whisper each keep Python, native runtime, and evidence in one owner folder; every owner declares a native strategy while multiple owners can satisfy one shared task contract.</desc>
