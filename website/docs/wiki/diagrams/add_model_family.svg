<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Adding a New Model Family: What You Write vs What's Automatic</text>

  <!-- You Write -->
  <rect x="30" y="50" width="440" height="530" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">You Write (3 files + 2 edits)</text>

  <!-- File 1 -->
  <rect x="55" y="95" width="390" height="100" rx="6" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="75" y="115" font-size="12" font-weight="bold" fill="#1e3a5f">src/models/your_family/registration.cpp</text>
  <text x="75" y="135" font-size="10" fill="#475569">Register into Registries 1, 2, and 4:</text>
  <text x="85" y="153" font-size="10" font-family="monospace" fill="#3b82f6">RegisterCheckpointMapper("your_family", ...)</text>
  <text x="85" y="168" font-size="10" font-family="monospace" fill="#3b82f6">RegisterTrtGraphBuilder("your_family", ...)</text>
  <text x="85" y="183" font-size="10" font-family="monospace" fill="#3b82f6">RegisterHfModelFamily({...})</text>

  <!-- File 2 -->
  <rect x="55" y="205" width="390" height="100" rx="6" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="75" y="225" font-size="12" font-weight="bold" fill="#1e3a5f">src/models/your_family/checkpoint_mapper.h/cpp</text>
  <text x="75" y="248" font-size="10" fill="#475569">Option A: Subclass StandardCheckpointMapper</text>
  <text x="85" y="266" font-size="10" fill="#64748b">Only override can_map() if your tensor keys follow standard naming</text>
  <text x="75" y="286" font-size="10" fill="#475569">Option B: Implement ICheckpointMapper from scratch</text>
  <text x="85" y="300" font-size="10" fill="#64748b">Only if your model has non-standard tensor key naming</text>

  <!-- Edit 1 -->
  <rect x="55" y="320" width="390" height="55" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="75" y="342" font-size="12" font-weight="bold" fill="#1e3a5f">hf_family_registry.cpp (1 line)</text>
  <text x="85" y="362" font-size="10" font-family="monospace" fill="#3b82f6">your_family::RegisterYourFamily();</text>

  <!-- Edit 2 -->
  <rect x="55" y="385" width="390" height="55" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="75" y="407" font-size="12" font-weight="bold" fill="#1e3a5f">CMakeLists.txt (2 lines)</text>
  <text x="85" y="427" font-size="10" font-family="monospace" fill="#3b82f6">src/models/your_family/registration.cpp</text>
  <text x="85" y="442" font-size="10" font-family="monospace" fill="#3b82f6">src/models/your_family/checkpoint_mapper.cpp</text>

  <!-- Test -->
  <rect x="55" y="455" width="390" height="55" rx="6" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="75" y="477" font-size="12" font-weight="bold" fill="#1e3a5f">tests/test_your_family.cpp (optional)</text>
  <text x="75" y="497" font-size="10" fill="#64748b">Use test_helpers.h: write_standard_decoder_checkpoint()</text>

  <!-- LOC estimate -->
  <rect x="55" y="525" width="390" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="550" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">~50-80 lines of actual code</text>

  <!-- Automatic -->
  <rect x="530" y="50" width="440" height="530" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Automatic (zero code needed)</text>

  <rect x="555" y="95" width="390" height="80" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="575" y="118" font-size="13" font-weight="bold" fill="#166534">Registry 3: TRT Definition Populator</text>
  <text x="575" y="138" font-size="11" fill="#047857">StandardTrtModelDefinitionPopulator (priority=0)</text>
  <text x="575" y="158" font-size="10" fill="#064e3b">Handles ANY model with has_decoder_layers automatically</text>

  <rect x="555" y="190" width="390" height="80" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="575" y="213" font-size="13" font-weight="bold" fill="#166534">StandardDecoderGraphBuilder</text>
  <text x="575" y="233" font-size="11" fill="#047857">Pre-RMSNorm + GQA + RoPE + SwiGLU pattern</text>
  <text x="575" y="253" font-size="10" fill="#064e3b">Works for LLaMA, Qwen, Yi, Mistral-dense, DeepSeek-dense</text>

  <rect x="555" y="285" width="390" height="80" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="575" y="308" font-size="13" font-weight="bold" fill="#166534">StandardCheckpointMapper base class</text>
  <text x="575" y="328" font-size="11" fill="#047857">Handles standard HF tensor key naming convention</text>
  <text x="575" y="348" font-size="10" fill="#064e3b">GQA expansion, tied lm_head, transpose, per-head norms</text>

  <rect x="555" y="380" width="390" height="65" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="575" y="403" font-size="13" font-weight="bold" fill="#166534">Reusable TRT graph ops</text>
  <text x="575" y="423" font-size="10" fill="#047857">add_rms_norm, add_apply_rope, add_matmul_rhs_constant,</text>
  <text x="575" y="438" font-size="10" fill="#047857">add_rms_norm_per_head, add_bias_sum, ...</text>

  <rect x="555" y="460" width="390" height="55" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="575" y="483" font-size="13" font-weight="bold" fill="#166534">Engine caching + autoregressive loop</text>
  <text x="575" y="503" font-size="10" fill="#047857">trt_backend_shared.cpp, trt_engine_lifecycle.cpp</text>

  <rect x="555" y="530" width="390" height="35" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="575" y="553" font-size="11" fill="#047857">test_helpers.h: write_standard_decoder_checkpoint()</text>
</svg>
