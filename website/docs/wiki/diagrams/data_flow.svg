<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="af" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="550" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Data Flow: HF Safetensors to GPU Inference</text>

  <!-- Row 1: HF Files -->
  <rect x="30" y="50" width="150" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="73" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">config.json</text>
  <text x="105" y="90" text-anchor="middle" font-size="9" fill="#64748b">model_type, dims,</text>
  <text x="105" y="102" text-anchor="middle" font-size="9" fill="#64748b">num_heads, rope_theta</text>

  <rect x="200" y="50" width="180" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="73" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">model.safetensors</text>
  <text x="290" y="90" text-anchor="middle" font-size="9" fill="#64748b">model.layers.N.self_attn.*</text>
  <text x="290" y="102" text-anchor="middle" font-size="9" fill="#64748b">model.layers.N.mlp.*</text>

  <rect x="400" y="50" width="150" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="475" y="73" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">tokenizer.json</text>
  <text x="475" y="90" text-anchor="middle" font-size="9" fill="#64748b">BPE vocabulary</text>
  <text x="475" y="102" text-anchor="middle" font-size="9" fill="#64748b">(HF format)</text>

  <text x="290" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">HuggingFace Model Directory</text>

  <!-- Arrow down -->
  <line x1="290" y1="110" x2="290" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- Row 2: Loading -->
  <rect x="100" y="148" width="180" height="50" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="190" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Checkpoint Mapper</text>
  <text x="190" y="186" text-anchor="middle" font-size="9" fill="#a16207">Registry 2: HF keys -> canonical</text>

  <rect x="300" y="148" width="180" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">SafetensorReader</text>
  <text x="390" y="186" text-anchor="middle" font-size="9" fill="#3b82f6">F32/F16/BF16 -> float32</text>

  <line x1="290" y1="198" x2="290" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- Row 3: DecoderModel -->
  <rect x="140" y="235" width="300" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">DecoderModel</text>
  <text x="290" y="278" text-anchor="middle" font-size="10" fill="#3b82f6">architecture + checkpoint + vocab + transitions</text>
  <text x="290" y="293" text-anchor="middle" font-size="9" fill="#60a5fa">Unified representation for ALL model sources</text>

  <!-- Arrow to TRT Definition -->
  <line x1="440" y1="270" x2="530" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- Row 3: TrtDecoderDefinition -->
  <rect x="540" y="235" width="260" height="70" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="670" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">TrtDecoderDefinition</text>
  <text x="670" y="278" text-anchor="middle" font-size="10" fill="#db2777">Per-layer weight arrays + arch params</text>
  <text x="670" y="293" text-anchor="middle" font-size="9" fill="#f472b6">Registry 3: StandardTrtModelDefinitionPopulator</text>

  <line x1="670" y1="305" x2="670" y2="335" stroke="#475569" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- Row 4: TRT Network -->
  <rect x="540" y="342" width="260" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">TRT INetworkDefinition</text>
  <text x="670" y="385" text-anchor="middle" font-size="10" fill="#16a34a">Registry 4: StandardDecoderGraphBuilder</text>

  <line x1="670" y1="402" x2="670" y2="432" stroke="#475569" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- Row 5: Engine -->
  <rect x="540" y="440" width="260" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="670" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">DecoderStepEngine</text>
  <text x="670" y="483" text-anchor="middle" font-size="10" fill="#b45309">ICudaEngine + execution context</text>

  <!-- TRT graph ops annotations -->
  <rect x="830" y="342" width="240" height="60" rx="6" fill="white" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="950" y="362" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">trt_graph_ops.h</text>
  <text x="950" y="378" text-anchor="middle" font-size="9" fill="#047857">add_rms_norm, add_apply_rope,</text>
  <text x="950" y="392" text-anchor="middle" font-size="9" fill="#047857">add_matmul_rhs_constant, ...</text>
  <line x1="800" y1="372" x2="825" y2="372" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- CPU Reference path -->
  <line x1="290" y1="305" x2="290" y2="340" stroke="#475569" stroke-width="1.5" marker-end="url(#af)"/>
  <rect x="140" y="347" width="300" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">CPU Reference Backend</text>
  <text x="290" y="386" text-anchor="middle" font-size="9" fill="#64748b">Transition tables: token -> next_token (deterministic)</text>

  <!-- Autoregressive loop -->
  <rect x="830" y="440" width="240" height="60" rx="6" fill="white" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="950" y="460" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Autoregressive Loop</text>
  <text x="950" y="476" text-anchor="middle" font-size="9" fill="#b45309">Prefill -> Decode steps</text>
  <text x="950" y="490" text-anchor="middle" font-size="9" fill="#b45309">KV cache mgmt, greedy sampling</text>
  <line x1="800" y1="470" x2="825" y2="470" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Checkpoint detail annotations -->
  <rect x="30" y="235" width="100" height="70" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="80" y="255" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Per Layer:</text>
  <text x="80" y="268" text-anchor="middle" font-size="8" fill="#3b82f6">input_norm</text>
  <text x="80" y="278" text-anchor="middle" font-size="8" fill="#3b82f6">w_q, w_k, w_v, w_o</text>
  <text x="80" y="288" text-anchor="middle" font-size="8" fill="#3b82f6">post_attn_norm</text>
  <text x="80" y="298" text-anchor="middle" font-size="8" fill="#3b82f6">w_gate, w_up, w_down</text>
  <line x1="130" y1="270" x2="136" y2="270" stroke="#93c5fd" stroke-width="1"/>
</svg>
