<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Standard Decoder Layer (Pre-RMSNorm + GQA + RoPE + SwiGLU)</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#64748b">StandardDecoderGraphBuilder::add_standard_decoder_layer_block()</text>

  <!-- Input -->
  <rect x="360" y="65" width="180" height="35" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">hidden [1, H]</text>

  <!-- RMSNorm 1 -->
  <line x1="450" y1="100" x2="450" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="340" y="125" width="220" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">RMSNorm (input_norm)</text>

  <!-- QKV Projections -->
  <line x1="450" y1="160" x2="450" y2="180" stroke="#475569" stroke-width="1.5"/>
  <line x1="450" y1="180" x2="250" y2="180" stroke="#475569" stroke-width="1"/>
  <line x1="450" y1="180" x2="450" y2="180" stroke="#475569" stroke-width="1"/>
  <line x1="450" y1="180" x2="650" y2="180" stroke="#475569" stroke-width="1"/>
  <line x1="250" y1="180" x2="250" y2="195" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="450" y1="180" x2="450" y2="195" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="650" y1="180" x2="650" y2="195" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>

  <rect x="180" y="200" width="140" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Q = X * W_q</text>
  <rect x="380" y="200" width="140" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">K = X * W_k</text>
  <rect x="580" y="200" width="140" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="650" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">V = X * W_v</text>

  <!-- Optional QK Norm -->
  <line x1="250" y1="230" x2="250" y2="250" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="450" y1="230" x2="450" y2="250" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <rect x="160" y="255" width="180" height="30" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="250" y="275" text-anchor="middle" font-size="10" fill="#9d174d">Per-head RMSNorm (q_norm)</text>
  <rect x="360" y="255" width="180" height="30" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="450" y="275" text-anchor="middle" font-size="10" fill="#9d174d">Per-head RMSNorm (k_norm)</text>
  <text x="700" y="275" font-size="9" fill="#9d174d" font-style="italic">Optional: Qwen3 has these, LLaMA does not</text>

  <!-- RoPE -->
  <line x1="250" y1="285" x2="250" y2="305" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="450" y1="285" x2="450" y2="305" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <rect x="175" y="310" width="150" height="30" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="250" y="330" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">RoPE(Q, pos)</text>
  <rect x="375" y="310" width="150" height="30" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="330" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">RoPE(K, pos)</text>

  <!-- KV Cache concat -->
  <line x1="450" y1="340" x2="450" y2="360" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="650" y1="230" x2="650" y2="360" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <rect x="360" y="365" width="180" height="30" rx="4" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="450" y="385" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">Concat(cache_K, K)</text>
  <rect x="560" y="365" width="180" height="30" rx="4" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="650" y="385" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">Concat(cache_V, V)</text>

  <!-- GQA Attention -->
  <line x1="250" y1="340" x2="250" y2="420" stroke="#475569" stroke-width="1"/>
  <line x1="450" y1="395" x2="450" y2="420" stroke="#475569" stroke-width="1"/>
  <line x1="650" y1="395" x2="650" y2="420" stroke="#475569" stroke-width="1"/>
  <line x1="250" y1="420" x2="250" y2="435" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="450" y1="420" x2="450" y2="435" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="650" y1="420" x2="650" y2="435" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <rect x="180" y="440" width="540" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Grouped Query Attention (GQA)</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#166534">scores = softmax(Q * K^T / sqrt(d_k) + mask) * V</text>

  <!-- Output projection -->
  <line x1="450" y1="480" x2="450" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="340" y="505" width="220" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="525" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Output Proj: attn * W_o</text>

  <!-- Residual 1 -->
  <line x1="450" y1="535" x2="450" y2="555" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="450" cy="565" r="14" fill="white" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="570" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">+</text>
  <text x="490" y="570" font-size="10" fill="#dc2626">Residual</text>
  <!-- Residual bypass arrow -->
  <path d="M150,82 L150,565 L432,565" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#a-red)"/>

  <!-- RMSNorm 2 -->
  <line x1="450" y1="580" x2="450" y2="600" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="340" y="605" width="220" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="627" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">RMSNorm (post_attn_norm)</text>

  <!-- SwiGLU MLP -->
  <line x1="450" y1="640" x2="450" y2="660" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="280" y="665" width="340" height="60" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="690" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">SwiGLU MLP</text>
  <text x="450" y="710" text-anchor="middle" font-size="10" fill="#c2410c">out = (W_gate * x * sigmoid(W_gate * x)) * (W_up * x) * W_down</text>

  <!-- Residual 2 -->
  <line x1="450" y1="725" x2="450" y2="745" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="450" cy="755" r="14" fill="white" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="760" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">+</text>
  <text x="490" y="760" font-size="10" fill="#dc2626">Residual</text>
  <path d="M130,565 L130,755 L432,755" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#a-red)"/>

  <!-- Output -->
  <line x1="450" y1="770" x2="450" y2="790" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="360" y="793" width="180" height="25" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="810" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">output [1, H]</text>
</svg>
