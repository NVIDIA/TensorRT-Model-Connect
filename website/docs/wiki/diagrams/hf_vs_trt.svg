<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="av" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">HuggingFace Transformers vs TensorRT-Model-Connect</text>

  <!-- HF Column -->
  <rect x="30" y="50" width="490" height="640" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">HuggingFace Transformers (Python)</text>

  <rect x="55" y="95" width="440" height="45" rx="6" fill="white" stroke="#fde68a" stroke-width="1"/>
  <text x="275" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">pipeline("text-generation", model="Qwen/Qwen3-0.6B")</text>
  <text x="275" y="132" text-anchor="middle" font-size="10" fill="#a16207">Python entry point, auto-downloads model</text>

  <line x1="275" y1="140" x2="275" y2="160" stroke="#d97706" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="55" y="165" width="440" height="50" rx="6" fill="white" stroke="#fde68a" stroke-width="1"/>
  <text x="275" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">AutoModelForCausalLM.from_pretrained()</text>
  <text x="275" y="203" text-anchor="middle" font-size="10" fill="#a16207">Python model class: Qwen2ForCausalLM, LlamaForCausalLM</text>

  <line x1="275" y1="215" x2="275" y2="235" stroke="#d97706" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="55" y="240" width="440" height="50" rx="6" fill="white" stroke="#fde68a" stroke-width="1"/>
  <text x="275" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">AutoTokenizer.from_pretrained()</text>
  <text x="275" y="278" text-anchor="middle" font-size="10" fill="#a16207">tokenizers library (Rust-backed BPE)</text>

  <line x1="275" y1="290" x2="275" y2="310" stroke="#d97706" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="55" y="315" width="440" height="60" rx="6" fill="white" stroke="#fde68a" stroke-width="1"/>
  <text x="275" y="338" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">PyTorch nn.Module Forward Pass</text>
  <text x="275" y="355" text-anchor="middle" font-size="10" fill="#a16207">Dynamic computation graph, eager execution</text>
  <text x="275" y="368" text-anchor="middle" font-size="10" fill="#a16207">GPU via CUDA tensors, CPU fallback</text>

  <line x1="275" y1="375" x2="275" y2="395" stroke="#d97706" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="55" y="400" width="440" height="50" rx="6" fill="white" stroke="#fde68a" stroke-width="1"/>
  <text x="275" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">model.generate() — Autoregressive Loop</text>
  <text x="275" y="438" text-anchor="middle" font-size="10" fill="#a16207">KV cache, sampling, stopping criteria</text>

  <line x1="275" y1="450" x2="275" y2="470" stroke="#d97706" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="55" y="475" width="440" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="275" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Generated text output</text>

  <!-- Properties -->
  <rect x="55" y="530" width="440" height="145" rx="6" fill="white" stroke="#fde68a" stroke-width="1"/>
  <text x="75" y="552" font-size="11" font-weight="600" fill="#78350f">Characteristics:</text>
  <text x="75" y="572" font-size="10" fill="#713f12">+ Massive ecosystem, 200k+ models on Hub</text>
  <text x="75" y="588" font-size="10" fill="#713f12">+ Dynamic shapes, flexible architecture</text>
  <text x="75" y="604" font-size="10" fill="#713f12">+ Easy debugging, eager execution</text>
  <text x="75" y="620" font-size="10" fill="#713f12">+ Python-native, rapid prototyping</text>
  <text x="75" y="640" font-size="10" fill="#dc2626">- Python GIL, interpreter overhead</text>
  <text x="75" y="656" font-size="10" fill="#dc2626">- No kernel fusion or graph optimization</text>
  <text x="75" y="672" font-size="10" fill="#dc2626">- Large memory footprint (PyTorch runtime)</text>

  <!-- TRT Column -->
  <rect x="580" y="50" width="490" height="640" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="825" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">TensorRT-Model-Connect (C++/TensorRT)</text>

  <rect x="605" y="95" width="440" height="45" rx="6" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="825" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Pipeline::CreateTextGeneration("QWEN3")</text>
  <text x="825" y="132" text-anchor="middle" font-size="10" fill="#047857">C++ entry point, mirrors HF pipeline() API</text>

  <line x1="825" y1="140" x2="825" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="605" y="165" width="440" height="50" rx="6" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="825" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">HF Family Registry + Checkpoint Mapper</text>
  <text x="825" y="203" text-anchor="middle" font-size="10" fill="#047857">Registry-based dispatch: model_type -> family loader</text>

  <line x1="825" y1="215" x2="825" y2="235" stroke="#16a34a" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="605" y="240" width="440" height="50" rx="6" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="825" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">HfPythonTokenizer (subprocess bridge)</text>
  <text x="825" y="278" text-anchor="middle" font-size="10" fill="#047857">Reuses HF tokenizers via Python subprocess</text>

  <line x1="825" y1="290" x2="825" y2="310" stroke="#16a34a" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="605" y="315" width="440" height="60" rx="6" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="825" y="338" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">TensorRT C++ Graph Builder</text>
  <text x="825" y="355" text-anchor="middle" font-size="10" fill="#047857">Static computation graph, compiled to GPU kernels</text>
  <text x="825" y="368" text-anchor="middle" font-size="10" fill="#047857">Fused ops, optimized memory layout, quantization</text>

  <line x1="825" y1="375" x2="825" y2="395" stroke="#16a34a" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="605" y="400" width="440" height="50" rx="6" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="825" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">TrtBackendShared::generate() — Autoregressive Loop</text>
  <text x="825" y="438" text-anchor="middle" font-size="10" fill="#047857">C++ KV cache, CUDA buffers, greedy sampling</text>

  <line x1="825" y1="450" x2="825" y2="470" stroke="#16a34a" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="605" y="475" width="440" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="825" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Generated text output</text>

  <!-- Properties -->
  <rect x="605" y="530" width="440" height="145" rx="6" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="625" y="552" font-size="11" font-weight="600" fill="#14532d">Characteristics:</text>
  <text x="625" y="572" font-size="10" fill="#166534">+ TensorRT kernel fusion and graph optimization</text>
  <text x="625" y="588" font-size="10" fill="#166534">+ No Python overhead, pure C++ runtime</text>
  <text x="625" y="604" font-size="10" fill="#166534">+ Small binary footprint, embeddable</text>
  <text x="625" y="620" font-size="10" fill="#166534">+ Engine caching (build once, run many)</text>
  <text x="625" y="640" font-size="10" fill="#dc2626">- Limited model support (needs family registration)</text>
  <text x="625" y="656" font-size="10" fill="#dc2626">- NVIDIA GPU required for TRT path</text>
  <text x="625" y="672" font-size="10" fill="#dc2626">- Longer first-run (engine compilation)</text>

  <!-- "Same" labels connecting equivalent stages -->
  <rect x="520" y="100" width="40" height="18" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="540" y="113" text-anchor="middle" font-size="8" font-weight="bold" fill="#4338ca">=</text>
  <rect x="520" y="247" width="40" height="18" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="540" y="260" text-anchor="middle" font-size="8" font-weight="bold" fill="#4338ca">=</text>
  <rect x="520" y="410" width="40" height="18" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="540" y="423" text-anchor="middle" font-size="8" font-weight="bold" fill="#4338ca">=</text>
  <rect x="520" y="325" width="40" height="18" rx="9" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="540" y="338" text-anchor="middle" font-size="8" font-weight="bold" fill="#be185d">vs</text>
</svg>
