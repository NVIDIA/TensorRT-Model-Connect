<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <linearGradient id="stage1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Three-Stage Pipeline Flow</text>
  <text x="550" y="50" text-anchor="middle" font-size="12" fill="#64748b">Pipeline::CreateTextGeneration(model_id, prefer_trt, force_trt)</text>

  <!-- User Code -->
  <rect x="30" y="70" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">User Code</text>
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#64748b">pipeline("Hello world")</text>

  <!-- Arrow to Stage 1 -->
  <line x1="230" y1="90" x2="280" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 1: Model Resolution -->
  <rect x="290" y="62" width="240" height="220" rx="10" fill="url(#stage1)" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Stage 1: Model Resolution</text>
  <text x="410" y="102" text-anchor="middle" font-size="10" fill="#3b82f6">model_resolver.cpp</text>

  <rect x="310" y="112" width="200" height="28" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="410" y="131" text-anchor="middle" font-size="11" fill="#1e3a5f">1. Custom resolvers</text>

  <rect x="310" y="148" width="200" height="28" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="410" y="167" text-anchor="middle" font-size="11" fill="#1e3a5f">2. HF Family Registry</text>

  <rect x="310" y="184" width="200" height="28" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="410" y="203" text-anchor="middle" font-size="11" fill="#1e3a5f">3. Raw HF directory</text>

  <rect x="310" y="220" width="200" height="28" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="410" y="239" text-anchor="middle" font-size="11" fill="#1e3a5f">4. LoadDecoderModel()</text>

  <text x="410" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Output: ResolvedModelSpec</text>

  <!-- Arrow to Stage 2 -->
  <line x1="410" y1="282" x2="410" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: HF Family Registry -->
  <rect x="290" y="330" width="240" height="210" rx="10" fill="url(#stage2)" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Stage 2: HF Family Registry</text>
  <text x="410" y="370" text-anchor="middle" font-size="10" fill="#b45309">hf_family_registry.cpp</text>

  <rect x="310" y="380" width="200" height="28" rx="4" fill="white" stroke="#fcd34d" stroke-width="1"/>
  <text x="410" y="399" text-anchor="middle" font-size="11" fill="#78350f">Parse config.json metadata</text>

  <rect x="310" y="416" width="200" height="28" rx="4" fill="white" stroke="#fcd34d" stroke-width="1"/>
  <text x="410" y="435" text-anchor="middle" font-size="11" fill="#78350f">Match model_type to family</text>

  <rect x="310" y="452" width="200" height="28" rx="4" fill="white" stroke="#fcd34d" stroke-width="1"/>
  <text x="410" y="471" text-anchor="middle" font-size="11" fill="#78350f">family.model_definition_loader()</text>

  <rect x="310" y="488" width="200" height="28" rx="4" fill="white" stroke="#fcd34d" stroke-width="1"/>
  <text x="410" y="507" text-anchor="middle" font-size="11" fill="#78350f">Checkpoint Mapper (Registry 2)</text>

  <text x="410" y="534" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Output: DecoderModel</text>

  <!-- Arrow to Stage 3 -->
  <path d="M530,440 L600,440 L600,170 L680,170" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 3: Runtime Assembly -->
  <rect x="690" y="62" width="380" height="340" rx="10" fill="url(#stage3)" stroke="#059669" stroke-width="2"/>
  <text x="880" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Stage 3: Runtime Assembly</text>
  <text x="880" y="102" text-anchor="middle" font-size="10" fill="#059669">runtime_factory.cpp</text>

  <!-- Tokenizer branch -->
  <rect x="710" y="116" width="160" height="70" rx="6" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="790" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Tokenizer</text>
  <text x="790" y="155" text-anchor="middle" font-size="10" fill="#047857">HfPythonTokenizer</text>
  <text x="790" y="170" text-anchor="middle" font-size="10" fill="#047857">or ToyTokenizer</text>

  <!-- Backend branch -->
  <rect x="710" y="200" width="160" height="50" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="790" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">TRT Backend</text>
  <text x="790" y="240" text-anchor="middle" font-size="9" fill="#166534">GPU inference (preferred)</text>

  <rect x="710" y="260" width="160" height="50" rx="6" fill="white" stroke="#6ee7b7" stroke-width="1"/>
  <text x="790" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">CPU Reference</text>
  <text x="790" y="298" text-anchor="middle" font-size="9" fill="#047857">Transition tables (fallback)</text>

  <rect x="710" y="320" width="160" height="50" rx="6" fill="white" stroke="#6ee7b7" stroke-width="1"/>
  <text x="790" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">HF Python</text>
  <text x="790" y="358" text-anchor="middle" font-size="9" fill="#047857">Subprocess (compatibility)</text>

  <!-- Fallback arrows -->
  <text x="878" y="232" font-size="10" fill="#dc2626">fail</text>
  <path d="M870,225 L870,275" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="878" y="293" font-size="10" fill="#dc2626">fail</text>
  <path d="M870,285 L870,335" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- TRT sub-pipeline -->
  <rect x="900" y="116" width="150" height="260" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="975" y="136" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">TRT Sub-Pipeline</text>

  <rect x="912" y="148" width="126" height="34" rx="3" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="975" y="163" text-anchor="middle" font-size="9" fill="#14532d">Registry 3: Populator</text>
  <text x="975" y="175" text-anchor="middle" font-size="8" fill="#16a34a">DecoderModel -> TrtDef</text>

  <rect x="912" y="190" width="126" height="34" rx="3" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="975" y="205" text-anchor="middle" font-size="9" fill="#14532d">Registry 4: Graph Builder</text>
  <text x="975" y="217" text-anchor="middle" font-size="8" fill="#16a34a">TrtDef -> TRT Network</text>

  <rect x="912" y="232" width="126" height="34" rx="3" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="975" y="247" text-anchor="middle" font-size="9" fill="#14532d">TRT Engine Build</text>
  <text x="975" y="259" text-anchor="middle" font-size="8" fill="#16a34a">Compile GPU kernels</text>

  <rect x="912" y="274" width="126" height="34" rx="3" fill="white" stroke="#bbf7d0" stroke-width="1"/>
  <text x="975" y="289" text-anchor="middle" font-size="9" fill="#14532d">Engine Cache</text>
  <text x="975" y="301" text-anchor="middle" font-size="8" fill="#16a34a">Serialize/deserialize</text>

  <rect x="912" y="316" width="126" height="46" rx="3" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="975" y="335" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Autoregressive</text>
  <text x="975" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Generate Loop</text>

  <!-- Output -->
  <rect x="690" y="410" width="380" height="40" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="880" y="435" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Output: RuntimeAssembly {tokenizer, backend}</text>

  <!-- Final output -->
  <rect x="690" y="480" width="380" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="880" y="505" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Pipeline Object (ready for generation)</text>

  <line x1="880" y1="450" x2="880" y2="475" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="580" width="1040" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="605" font-size="12" font-weight="bold" fill="#334155">Legend</text>
  <rect x="50" y="615" width="16" height="16" rx="3" fill="url(#stage1)" stroke="#3b82f6" stroke-width="1"/>
  <text x="74" y="628" font-size="11" fill="#475569">Stage 1: Model Resolution (model_id -> ResolvedModelSpec)</text>
  <rect x="380" y="615" width="16" height="16" rx="3" fill="url(#stage2)" stroke="#d97706" stroke-width="1"/>
  <text x="404" y="628" font-size="11" fill="#475569">Stage 2: HF Family Registry (HF dir -> DecoderModel)</text>
  <rect x="720" y="615" width="16" height="16" rx="3" fill="url(#stage3)" stroke="#059669" stroke-width="1"/>
  <text x="744" y="628" font-size="11" fill="#475569">Stage 3: Runtime Assembly (model -> tokenizer + backend)</text>
  <text x="50" y="655" font-size="10" fill="#94a3b8">Each stage has an extension point: RegisterTextGenerationModelResolver, RegisterHfModelFamily, RegisterTextGenerationRuntimeAssembler</text>
</svg>
