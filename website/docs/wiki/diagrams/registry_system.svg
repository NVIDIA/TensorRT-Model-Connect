<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">The 4-Registry Plug-and-Play System</text>

  <!-- Registry 1: HF Family -->
  <rect x="30" y="60" width="500" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="50" y="85" font-size="15" font-weight="bold" fill="#1e40af">Registry 1: HF Family</text>
  <text x="50" y="105" font-size="11" fill="#3b82f6">RegisterHfModelFamily() -- hf_family_registry.cpp</text>
  <text x="50" y="128" font-size="11" fill="#334155">Purpose: Match HF model_type/architectures to a family loader</text>
  <text x="50" y="148" font-size="11" fill="#334155">Input: model_dir with config.json + safetensors</text>
  <text x="50" y="168" font-size="11" fill="#334155">Output: DecoderModel (unified representation)</text>
  <text x="50" y="195" font-size="10" fill="#64748b">Interface: HfModelFamilyRegistration { family_name, priority, matcher, model_definition_loader }</text>

  <!-- Registry 2: Checkpoint Mapper -->
  <rect x="30" y="230" width="500" height="150" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="50" y="255" font-size="15" font-weight="bold" fill="#854d0e">Registry 2: Checkpoint Mapper</text>
  <text x="50" y="275" font-size="11" fill="#ca8a04">RegisterCheckpointMapper() -- checkpoint_mapper.cpp</text>
  <text x="50" y="298" font-size="11" fill="#334155">Purpose: Map HF safetensors tensor keys to DecoderCheckpoint</text>
  <text x="50" y="318" font-size="11" fill="#334155">Input: TensorSource (safetensors reader) + DecoderArchitectureConfig</text>
  <text x="50" y="338" font-size="11" fill="#334155">Output: DecoderCheckpoint (per-layer weights in canonical format)</text>
  <text x="50" y="365" font-size="10" fill="#64748b">Interface: ICheckpointMapper { can_map(), map_checkpoint() }</text>

  <!-- Registry 3: TRT Definition Populator -->
  <rect x="30" y="400" width="500" height="150" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="50" y="425" font-size="15" font-weight="bold" fill="#9d174d">Registry 3: TRT Definition Populator</text>
  <text x="50" y="445" font-size="11" fill="#db2777">RegisterTrtModelDefinitionPopulator() -- trt_model_definition_populator.cpp</text>
  <text x="50" y="468" font-size="11" fill="#334155">Purpose: Convert DecoderModel to TrtDecoderDefinition (TRT-ready)</text>
  <text x="50" y="488" font-size="11" fill="#334155">Input: DecoderModel with populated checkpoint</text>
  <text x="50" y="508" font-size="11" fill="#334155">Output: TrtDecoderDefinition (per-layer weight arrays, arch params)</text>
  <text x="50" y="535" font-size="10" fill="#64748b">Interface: ITrtModelDefinitionPopulator { can_populate(), populate() }</text>

  <!-- Registry 4: TRT Graph Builder -->
  <rect x="30" y="570" width="500" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="595" font-size="15" font-weight="bold" fill="#166534">Registry 4: TRT Graph Builder</text>
  <text x="50" y="615" font-size="11" fill="#16a34a">RegisterTrtGraphBuilder() -- trt_graph_builder.cpp</text>
  <text x="50" y="638" font-size="11" fill="#334155">Purpose: Build TensorRT INetworkDefinition from TrtDecoderDefinition</text>
  <text x="50" y="658" font-size="11" fill="#334155">Input: TrtDecoderDefinition (weights + arch parameters)</text>
  <text x="50" y="678" font-size="11" fill="#334155">Output: DecoderStepEngine (compiled GPU engine)</text>
  <text x="50" y="705" font-size="10" fill="#64748b">Interface: ITrtGraphBuilder { build_decoder_step_engine() }</text>

  <!-- Right side: Implementations -->
  <rect x="580" y="60" width="490" height="150" rx="10" fill="white" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="85" font-size="13" font-weight="bold" fill="#1e40af">Registered Families</text>
  <rect x="600" y="95" width="200" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="700" y="112" text-anchor="middle" font-size="11" fill="#1e3a5f">qwen-decoder-definition (p=100)</text>
  <rect x="600" y="125" width="200" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="700" y="142" text-anchor="middle" font-size="11" fill="#1e3a5f">llama-safetensors (p=100)</text>
  <rect x="600" y="155" width="200" height="24" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="700" y="172" text-anchor="middle" font-size="11" fill="#3730a3">Your family here... (p=100)</text>
  <text x="600" y="200" font-size="10" fill="#64748b">Priority-sorted: highest checked first</text>

  <rect x="580" y="230" width="490" height="150" rx="10" fill="white" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="255" font-size="13" font-weight="bold" fill="#854d0e">Registered Mappers</text>
  <rect x="600" y="265" width="200" height="24" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="700" y="282" text-anchor="middle" font-size="11" fill="#713f12">QwenCheckpointMapper (p=100)</text>
  <rect x="600" y="295" width="200" height="24" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="700" y="312" text-anchor="middle" font-size="11" fill="#713f12">LlamaCheckpointMapper (p=100)</text>
  <text x="600" y="340" font-size="10" fill="#64748b">Both extend StandardCheckpointMapper</text>
  <text x="600" y="355" font-size="10" fill="#64748b">Only override can_map() for family detection</text>
  <text x="600" y="370" font-size="10" fill="#64748b">Inherit standard HF tensor mapping logic</text>

  <rect x="580" y="400" width="490" height="150" rx="10" fill="white" stroke="#db2777" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="425" font-size="13" font-weight="bold" fill="#9d174d">Registered Populators</text>
  <rect x="600" y="435" width="230" height="24" rx="4" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="715" y="452" text-anchor="middle" font-size="11" fill="#831843">QwenTrtModelDefinitionPopulator (p=100)</text>
  <rect x="600" y="465" width="230" height="28" rx="4" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="715" y="480" text-anchor="middle" font-size="11" font-weight="600" fill="#be185d">StandardTrtModelDefinitionPopulator (p=0)</text>
  <text x="715" y="496" text-anchor="middle" font-size="9" fill="#9d174d">AUTOMATIC FALLBACK</text>
  <text x="600" y="520" font-size="10" fill="#64748b">Standard populator handles ANY model with has_decoder_layers.</text>
  <text x="600" y="535" font-size="10" fill="#16a34a" font-weight="600">New families do NOT need to register a populator.</text>

  <rect x="580" y="570" width="490" height="150" rx="10" fill="white" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="595" font-size="13" font-weight="bold" fill="#166534">Registered Builders</text>
  <rect x="600" y="605" width="200" height="24" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="700" y="622" text-anchor="middle" font-size="11" fill="#14532d">qwen/qwen2/qwen3/qwq</text>
  <rect x="600" y="635" width="200" height="24" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="700" y="652" text-anchor="middle" font-size="11" fill="#14532d">llama</text>
  <rect x="600" y="665" width="200" height="24" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="700" y="682" text-anchor="middle" font-size="11" fill="#14532d">standard-decoder (fallback)</text>
  <text x="600" y="710" font-size="10" fill="#64748b">All use StandardDecoderGraphBuilder</text>
  <text x="600" y="725" font-size="10" fill="#64748b">(Pre-RMSNorm + GQA + RoPE + SwiGLU)</text>

  <!-- Connecting arrows -->
  <line x1="530" y1="135" x2="575" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="305" x2="575" y2="305" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="475" x2="575" y2="475" stroke="#db2777" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="645" x2="575" y2="645" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
