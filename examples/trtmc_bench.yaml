# One `run` executes every model/case below. Existing bundles are reused;
# missing bundles are built once and cached.
bundle_roots:
  - /engines

defaults:
  telemetry:
    gpu: auto

models:
  - model: distilgpt2
    cases:
      - name: default

  - model: flux-schnell-l0
    cases:
      # Named cases are literal rows, not axes: this produces two runs.
      - name: fast
        set:
          request.num_inference_steps: 4
      - name: standard
        set:
          request.num_inference_steps: 20

  - model: chronos-bolt-tiny-official
    cases:
      - name: default
