# Ruff checks used by the source-quality gate.

line-length = 100

[lint]
select = ["E", "W", "F"]
ignore = [
    "E501",  # line too long
    "E741",  # ambiguous variable names
    "W291",  # trailing whitespace
    "W292",  # no newline at end
    "W293",  # whitespace before ':'
]

[lint.per-file-ignores]
"tests/**" = ["F811"]
"families/nomic_bert/tests/reference/configuration_hf_nomic_bert.py" = ["ALL"]
"families/nomic_bert/tests/reference/modeling_hf_nomic_bert.py" = ["ALL"]

[format]
exclude = [
    "families/nomic_bert/tests/reference/configuration_hf_nomic_bert.py",
    "families/nomic_bert/tests/reference/modeling_hf_nomic_bert.py",
]
