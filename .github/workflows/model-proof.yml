name: Isolated model proof

on:
  workflow_call:
    inputs:
      model:
        description: "Model ownership identifier to build in isolation"
        required: true
        type: string
      revision:
        description: "Exact Git commit to certify"
        required: true
        type: string
      suite:
        description: "Model-owned E2E scope: premerge or nightly"
        required: false
        default: "premerge"
        type: string

permissions:
  contents: read

jobs:
  prove:
    name: ${{ inputs.model }} / Build + test
    runs-on: ${{ fromJSON(vars.TRTMC_MODEL_RUNNER_LABELS || vars.TRTMC_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      TRTMC_CI_IMAGE: ${{ vars.TRTMC_MANYLINUX_CI_IMAGE || 'trtmc-dev-gb300:manylinux_2_39' }}
      TRTMC_HF_CACHE: ${{ vars.TRTMC_HF_HOME }}
      TRTMC_MODEL_PROOF_BUILD_JOBS: ${{ vars.TRTMC_MODEL_PROOF_BUILD_JOBS || '8' }}
      TRTMC_MODEL_PROOF_GPU_IDS: ${{ vars.TRTMC_MODEL_PROOF_GPU_IDS || '0,1,2,3' }}
      TRTMC_MODEL_PROOF_GPU_LEASE_TIMEOUT_SECONDS: ${{ vars.TRTMC_MODEL_PROOF_GPU_LEASE_TIMEOUT_SECONDS || '60' }}
      TRTMC_MODEL_PROOF_MIN_FREE_GIB: ${{ vars.TRTMC_MODEL_PROOF_MIN_FREE_GIB || '40' }}
      TRTMC_MODEL_PROOF_STALE_MINUTES: ${{ vars.TRTMC_MODEL_PROOF_STALE_MINUTES || '120' }}
      PYTHONHASHSEED: "0"

    steps:
      - name: Bootstrap model proof HTML before checkout
        env:
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          MODEL_PROOF_OUTPUT_DIR: ${{ runner.temp }}/model-proof-${{ inputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "MODEL_PROOF_OUTPUT_DIR=$MODEL_PROOF_OUTPUT_DIR" >> "$GITHUB_ENV"
          artifacts_dir="$MODEL_PROOF_OUTPUT_DIR/artifacts"
          mkdir -p "$artifacts_dir"
          python3 - "$artifacts_dir" "$MODEL" "$REVISION" "$SUITE" <<'PY'
          import html
          import json
          import sys
          from pathlib import Path

          artifacts, model, revision, suite = sys.argv[1:]
          root = Path(artifacts)
          status = {
              "schema_version": 1,
              "report_kind": "workflow_fallback",
              "model": model,
              "source_revision": revision,
              "suite": suite,
              "outcome": "running",
              "phase": "workflow-bootstrap",
              "steps": {
                  "checkout": {
                      "status": "running",
                      "evidence": "GitHub Actions checkout outcome",
                  }
              },
          }
          (root / "model-proof-status.json").write_text(
              json.dumps(status, indent=2) + "\n", encoding="utf-8"
          )
          rows = "".join(
              f"<tr><th>{html.escape(label)}</th><td>{html.escape(value)}</td></tr>"
              for label, value in (
                  ("Model", model),
                  ("Revision", revision),
                  ("Suite", suite),
                  ("Outcome", "Running"),
                  ("Phase", "Workflow bootstrap"),
              )
          )
          report = f"""<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Isolated model proof: {html.escape(model)}</title>
          <style>body{{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17202a}}table{{border-collapse:collapse;width:100%}}th,td{{border:1px solid #ccd1d1;padding:.6rem;text-align:left}}th{{width:12rem;background:#f4f6f7}}.pending{{border-left:.4rem solid #f1c40f;background:#fffbea;padding:1rem}}</style>
          </head><body><h1>Isolated model proof</h1>
          <p class="pending">The workflow is preparing the exact source revision. This bootstrap report will be replaced with full model evidence after checkout.</p>
          <table>{rows}</table></body></html>"""
          (root / "model-proof-report.html").write_text(report, encoding="utf-8")
          PY

      - name: Check model proof disk headroom
        run: |
          set -euo pipefail
          if ! [[ "$TRTMC_MODEL_PROOF_MIN_FREE_GIB" =~ ^[1-9][0-9]*$ ]]; then
            echo "TRTMC_MODEL_PROOF_MIN_FREE_GIB must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_STALE_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "TRTMC_MODEL_PROOF_STALE_MINUTES must be a positive integer." >&2
            exit 1
          fi
          while IFS= read -r -d '' stale_dir; do
            case "$stale_dir" in
              "$RUNNER_TEMP"/model-proof-*) ;;
              *) echo "Refusing to clean unsafe stale path: $stale_dir" >&2; exit 1 ;;
            esac
            echo "Removing stale model-proof scratch data from $stale_dir"
            rm -rf -- "$stale_dir/work" "$stale_dir/projection"
          done < <(
            find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
              -name 'model-proof-*' -mmin "+$TRTMC_MODEL_PROOF_STALE_MINUTES" \
              -print0
          )
          df -h "$RUNNER_TEMP"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          required_kib="$((TRTMC_MODEL_PROOF_MIN_FREE_GIB * 1024 * 1024))"
          if [ "$available_kib" -lt "$required_kib" ]; then
            available_gib="$((available_kib / 1024 / 1024))"
            echo "Insufficient model-proof disk headroom: ${available_gib} GiB available; ${TRTMC_MODEL_PROOF_MIN_FREE_GIB} GiB required." >&2
            exit 1
          fi

      - name: Check out exact source revision
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: model-proof-source
          fetch-depth: 0
          clean: true
          lfs: false

      - name: Initialize model proof HTML fallback
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          python3 .github/scripts/write-model-proof-fallback-report.py \
            --artifacts-dir "$MODEL_PROOF_OUTPUT_DIR/artifacts" \
            --model "${{ inputs.model }}" \
            --revision "${{ inputs.revision }}" \
            --suite "${{ inputs.suite }}" \
            --outcome running \
            --phase workflow-setup

      - name: Ensure CI Docker image
        id: ci_image
        timeout-minutes: 90
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_PROOF_OUTPUT_DIR/artifacts"
          bash .github/scripts/ensure-ci-docker-image.sh \
            2>&1 | tee "$MODEL_PROOF_OUTPUT_DIR/artifacts/ci-image.log"

      - name: Run hermetic model proof
        id: proof
        env:
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          TRTMC_CI_IMAGE: ${{ steps.ci_image.outputs.image_ref }}
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          bash .github/scripts/run-model-proof.sh \
            --model "$MODEL" \
            --revision "$REVISION" \
            --suite "$SUITE" \
            --output-dir "$MODEL_PROOF_OUTPUT_DIR"
          echo "output_dir=$MODEL_PROOF_OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Finalize model proof HTML fallback
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          CI_IMAGE_OUTCOME: ${{ steps.ci_image.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          python3 .github/scripts/write-model-proof-fallback-report.py \
            --artifacts-dir "$MODEL_PROOF_OUTPUT_DIR/artifacts" \
            --model "${{ inputs.model }}" \
            --revision "${{ inputs.revision }}" \
            --suite "${{ inputs.suite }}" \
            --outcome failed \
            --phase workflow-finalize \
            --exit-code 1 \
            --detail "CI image step: $CI_IMAGE_OUTCOME" \
            --detail "Isolated proof step: $PROOF_OUTCOME" \
            --preserve-rich-report

      - name: Finalize HTML when checkout fails
        if: ${{ always() && steps.checkout.outcome != 'success' }}
        env:
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -euo pipefail
          artifacts_dir="$MODEL_PROOF_OUTPUT_DIR/artifacts"
          mkdir -p "$artifacts_dir"
          python3 - "$artifacts_dir" "$MODEL" "$REVISION" "$SUITE" "$CHECKOUT_OUTCOME" <<'PY'
          import html
          import json
          import sys
          from pathlib import Path

          artifacts, model, revision, suite, checkout_outcome = sys.argv[1:]
          root = Path(artifacts)
          status_path = root / "model-proof-status.json"
          try:
              status = json.loads(status_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              status = {"schema_version": 1, "report_kind": "workflow_fallback"}
          status.update({
              "model": model,
              "source_revision": revision,
              "suite": suite,
              "outcome": "failed",
              "phase": "source-checkout",
              "exit_code": 1,
              "details": [f"Source checkout outcome: {checkout_outcome}"],
          })
          status["steps"] = {
              "checkout": {
                  "status": "failed",
                  "evidence": f"GitHub Actions outcome: {checkout_outcome}",
              }
          }
          status_path.write_text(
              json.dumps(status, indent=2) + "\n", encoding="utf-8"
          )
          rows = "".join(
              f"<tr><th>{html.escape(label)}</th><td>{html.escape(value)}</td></tr>"
              for label, value in (
                  ("Model", model),
                  ("Revision", revision),
                  ("Suite", suite),
                  ("Outcome", "Failed"),
                  ("Phase", "Source checkout"),
                  ("Checkout", checkout_outcome),
              )
          )
          report = f"""<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Isolated model proof failed: {html.escape(model)}</title>
          <style>body{{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17202a}}table{{border-collapse:collapse;width:100%}}th,td{{border:1px solid #ccd1d1;padding:.6rem;text-align:left}}th{{width:12rem;background:#f4f6f7}}.failed{{border-left:.4rem solid #c0392b;background:#fdedec;padding:1rem}}</style>
          </head><body><h1>Isolated model proof</h1>
          <p class="failed">Validation could not start because the exact source revision was not checked out. No build or model test was run.</p>
          <table>{rows}</table></body></html>"""
          (root / "model-proof-report.html").write_text(report, encoding="utf-8")
          PY

      - name: Upload proof evidence
        id: proof_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-proof-${{ inputs.model }}-${{ inputs.revision }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/model-proof-${{ inputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
            !${{ runner.temp }}/model-proof-${{ inputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/model-proof-report.html

      - name: Upload model proof HTML report
        id: html_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-proof-html-${{ inputs.model }}-${{ inputs.revision }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/model-proof-${{ inputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/model-proof-report.html

      - name: Clean model proof scratch space
        if: always()
        env:
          PROOF_UPLOAD_OUTCOME: ${{ steps.proof_upload.outcome }}
          HTML_UPLOAD_OUTCOME: ${{ steps.html_upload.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${MODEL_PROOF_OUTPUT_DIR:-}" ]; then
            echo "No model-proof output directory was initialized; nothing to clean."
            exit 0
          fi
          case "$MODEL_PROOF_OUTPUT_DIR" in
            "$RUNNER_TEMP"/model-proof-*) ;;
            *) echo "Refusing to clean unsafe model-proof path: $MODEL_PROOF_OUTPUT_DIR" >&2; exit 1 ;;
          esac
          rm -rf -- "$MODEL_PROOF_OUTPUT_DIR/work" "$MODEL_PROOF_OUTPUT_DIR/projection"
          if [ "$PROOF_UPLOAD_OUTCOME" = "success" ] && [ "$HTML_UPLOAD_OUTCOME" = "success" ]; then
            rm -rf -- "$MODEL_PROOF_OUTPUT_DIR"
          else
            echo "Keeping local proof artifacts because an artifact upload did not succeed."
          fi
          df -h "$RUNNER_TEMP"
