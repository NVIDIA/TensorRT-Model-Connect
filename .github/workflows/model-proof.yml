name: Isolated model proofs

on:
  workflow_call:
    inputs:
      models:
        description: "JSON array of affected model ownership identifiers"
        required: true
        type: string
      expected_count:
        description: "Expected number of unique affected models"
        required: true
        type: number
      revision:
        description: "Exact Git commit to certify"
        required: true
        type: string
      suite:
        description: "Model-owned E2E scope: premerge or nightly"
        required: false
        default: "premerge"
        type: string

permissions:
  contents: read

jobs:
  prove:
    name: Affected ${{ inputs.models }} / Build + test
    runs-on: ${{ fromJSON(vars.TRTMC_MODEL_RUNNER_LABELS || vars.TRTMC_RUNNER_LABELS || '["self-hosted"]') }}
    # Full platform/CI changes certify every registered model. The image build
    # and 77 isolated E2E proofs exceeded the former three-hour job budget even
    # though the runner remained healthy, so leave enough room for evidence
    # finalization while small affected-model batches still finish in minutes.
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      TRTMC_CI_IMAGE: ${{ vars.TRTMC_MANYLINUX_CI_IMAGE || 'trtmc-dev-gb300:manylinux_2_39' }}
      TRTMC_HF_CACHE: ${{ vars.TRTMC_HF_HOME || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache' }}
      TRTMC_HF_HUB_CACHE: ${{ vars.TRTMC_HF_HUB_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/hub' }}
      TRTMC_HF_MODULES_CACHE: ${{ vars.TRTMC_HF_MODULES_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/modules' }}
      TRTMC_MODEL_PROOF_BUILD_JOBS: ${{ vars.TRTMC_MODEL_PROOF_BUILD_JOBS || '8' }}
      TRTMC_MODEL_PROOF_GPU_IDS: ${{ vars.TRTMC_MODEL_PROOF_GPU_IDS || '0,1,2,3' }}
      TRTMC_MODEL_PROOF_GPU_LEASE_TIMEOUT_SECONDS: ${{ vars.TRTMC_MODEL_PROOF_GPU_LEASE_TIMEOUT_SECONDS || '60' }}
      TRTMC_MODEL_PROOF_MIN_FREE_GIB: ${{ vars.TRTMC_MODEL_PROOF_MIN_FREE_GIB || '40' }}
      TRTMC_MODEL_PROOF_STALE_MINUTES: ${{ vars.TRTMC_MODEL_PROOF_STALE_MINUTES || '120' }}
      PYTHONHASHSEED: "0"

    steps:
      - name: Bootstrap batch HTML before checkout
        env:
          MODELS_JSON: ${{ inputs.models }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          MODEL_PROOF_BATCH_OUTPUT_DIR: ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "MODEL_PROOF_BATCH_OUTPUT_DIR=$MODEL_PROOF_BATCH_OUTPUT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$MODEL_PROOF_BATCH_OUTPUT_DIR"
          python3 - "$MODEL_PROOF_BATCH_OUTPUT_DIR" "$MODELS_JSON" "$EXPECTED_COUNT" "$REVISION" "$SUITE" <<'PY'
          import html
          import json
          import re
          import sys
          from pathlib import Path

          output, raw_models, raw_expected_count, revision, suite = sys.argv[1:]
          root = Path(output)
          root.mkdir(parents=True, exist_ok=True)
          try:
              models = json.loads(raw_models)
              if not isinstance(models, list) or not models:
                  raise ValueError("models must be a non-empty JSON array")
              expected_count = int(raw_expected_count)
              if expected_count < 1:
                  raise ValueError("expected_count must be a positive integer")
              if any(not isinstance(model, str) for model in models):
                  raise ValueError("every model identifier must be a string")
              if len(models) != len(set(models)):
                  raise ValueError("model identifiers must be unique")
              if len(models) != expected_count:
                  raise ValueError(
                      f"affected model count mismatch: expected {expected_count}, "
                      f"received {len(models)}"
                  )
              invalid = [
                  model
                  for model in models
                  if not re.fullmatch(r"[a-z0-9][a-z0-9._-]*", model)
              ]
              if invalid:
                  raise ValueError(f"unsafe model identifiers: {invalid}")
          except (json.JSONDecodeError, ValueError) as error:
              payload = {
                  "schema_version": 1,
                  "report_kind": "workflow_fallback",
                  "outcome": "failed",
                  "phase": "workflow-bootstrap",
                  "details": [str(error)],
                  "source_revision": revision,
                  "suite": suite,
              }
              (root / "batch-status.json").write_text(
                  json.dumps(payload, indent=2) + "\n", encoding="utf-8"
              )
              (root / "model-proof-index.html").write_text(
                  "<!doctype html><html lang='en' "
                  "data-report-kind='workflow-fallback'><head><meta charset='utf-8'>"
                  "<title>Isolated model proofs failed</title></head><body>"
                  f"<h1>Invalid affected-model selection</h1><p>{html.escape(str(error))}</p>"
                  "</body></html>",
                  encoding="utf-8",
              )
              raise SystemExit(str(error))

          batch_status = {
              "schema_version": 1,
              "report_kind": "workflow_fallback",
              "models": models,
              "expected_count": expected_count,
              "source_revision": revision,
              "suite": suite,
              "outcome": "running",
              "phase": "workflow-bootstrap",
          }
          (root / "batch-status.json").write_text(
              json.dumps(batch_status, indent=2) + "\n", encoding="utf-8"
          )

          for model in models:
              artifacts = root / model / "artifacts"
              artifacts.mkdir(parents=True, exist_ok=True)
              status = {
                  "schema_version": 1,
                  "report_kind": "workflow_fallback",
                  "model": model,
                  "source_revision": revision,
                  "suite": suite,
                  "outcome": "running",
                  "phase": "workflow-bootstrap",
                  "steps": {
                      "checkout": {
                          "status": "running",
                          "evidence": "GitHub Actions checkout outcome",
                      }
                  },
              }
              (artifacts / "model-proof-status.json").write_text(
                  json.dumps(status, indent=2) + "\n", encoding="utf-8"
              )
              rows = "".join(
                  f"<tr><th>{html.escape(label)}</th><td>{html.escape(value)}</td></tr>"
                  for label, value in (
                      ("Model", model),
                      ("Revision", revision),
                      ("Suite", suite),
                      ("Outcome", "Running"),
                      ("Phase", "Workflow bootstrap"),
                  )
              )
              report = f"""<!doctype html>
          <html lang="en" data-report-kind="workflow-fallback"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Isolated model proof: {html.escape(model)}</title>
          <style>body{{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17202a}}table{{border-collapse:collapse;width:100%}}th,td{{border:1px solid #ccd1d1;padding:.6rem;text-align:left}}th{{width:12rem;background:#f4f6f7}}.pending{{border-left:.4rem solid #f1c40f;background:#fffbea;padding:1rem}}</style>
          </head><body><h1>Isolated model proof</h1>
          <p class="pending">The workflow is preparing the exact source revision. This report will be replaced with full model evidence after checkout.</p>
          <table>{rows}</table></body></html>"""
              (artifacts / "model-proof-report.html").write_text(
                  report, encoding="utf-8"
              )

          links = "".join(
              "<li><a href='"
              f"{html.escape(model)}/artifacts/model-proof-report.html'>"
              f"{html.escape(model)}</a> &mdash; preparing</li>"
              for model in models
          )
          index = f"""<!doctype html>
          <html lang="en" data-report-kind="workflow-fallback"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Isolated model proof batch</title>
          <style>body{{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17202a}}li{{margin:.6rem 0}}</style>
          </head><body><h1>Isolated model proof batch</h1>
          <p>Revision <code>{html.escape(revision)}</code>; suite <code>{html.escape(suite)}</code>.</p>
          <ul>{links}</ul></body></html>"""
          (root / "model-proof-index.html").write_text(index, encoding="utf-8")
          PY

      - name: Check model proof disk headroom
        env:
          MODELS_JSON: ${{ inputs.models }}
        run: |
          set -euo pipefail
          if ! [[ "$TRTMC_MODEL_PROOF_MIN_FREE_GIB" =~ ^[1-9][0-9]*$ ]]; then
            echo "TRTMC_MODEL_PROOF_MIN_FREE_GIB must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_STALE_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "TRTMC_MODEL_PROOF_STALE_MINUTES must be a positive integer." >&2
            exit 1
          fi
          while IFS= read -r -d '' stale_dir; do
            case "$stale_dir" in
              "$RUNNER_TEMP"/model-proof-batch-*) ;;
              *) echo "Refusing to clean unsafe stale path: $stale_dir" >&2; exit 1 ;;
            esac
            echo "Removing stale batch scratch data from $stale_dir"
            find "$stale_dir" -mindepth 2 -maxdepth 2 -type d \
              \( -name work -o -name projection \) -exec rm -rf -- {} +
          done < <(
            find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
              -name 'model-proof-batch-*' -mmin "+$TRTMC_MODEL_PROOF_STALE_MINUTES" \
              -print0
          )
          df -h "$RUNNER_TEMP"
          active_workers="$(python3 - "$MODELS_JSON" "$TRTMC_MODEL_PROOF_GPU_IDS" <<'PY'
          import json
          import re
          import sys

          models = json.loads(sys.argv[1])
          configured = sys.argv[2]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)(?:,(?:0|[1-9][0-9]*))*", configured):
              raise SystemExit(
                  "TRTMC_MODEL_PROOF_GPU_IDS must be a comma-separated list "
                  "of unique non-negative integers"
              )
          gpu_ids = configured.split(",")
          if len(gpu_ids) != len(set(gpu_ids)):
              raise SystemExit("TRTMC_MODEL_PROOF_GPU_IDS must contain unique IDs")
          print(min(len(models), len(gpu_ids)))
          PY
          )"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          required_gib="$((TRTMC_MODEL_PROOF_MIN_FREE_GIB * active_workers))"
          required_kib="$((required_gib * 1024 * 1024))"
          if [ "$available_kib" -lt "$required_kib" ]; then
            available_gib="$((available_kib / 1024 / 1024))"
            echo "Insufficient model-proof disk headroom: ${available_gib} GiB available; ${required_gib} GiB required for ${active_workers} active workers." >&2
            exit 1
          fi

      - name: Check out exact source revision once
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: model-proof-source
          fetch-depth: 0
          persist-credentials: false
          clean: true
          lfs: false

      - name: Ensure CI Docker image once
        id: ci_image
        timeout-minutes: 90
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          bash .github/scripts/ensure-ci-docker-image.sh \
            2>&1 | tee "$MODEL_PROOF_BATCH_OUTPUT_DIR/ci-image.log"

      - name: Run affected model proofs
        id: proof
        # Keep the common one-to-four-model path bounded to one hour, while a
        # platform-wide proof gets four hours.  The proof ceiling remains well
        # below the six-hour job ceiling so checkout, image verification,
        # finalization, and both artifact uploads retain a bounded tail.
        timeout-minutes: ${{ inputs.expected_count <= 4 && 60 || (inputs.expected_count <= 16 && 120 || 240) }}
        env:
          MODELS_JSON: ${{ inputs.models }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          TRTMC_CI_IMAGE: ${{ steps.ci_image.outputs.image_ref }}
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          bash .github/scripts/run-model-proof-batch.sh \
            --models-json "$MODELS_JSON" \
            --expected-count "$EXPECTED_COUNT" \
            --revision "$REVISION" \
            --suite "$SUITE" \
            --output-dir "$MODEL_PROOF_BATCH_OUTPUT_DIR"
          echo "output_dir=$MODEL_PROOF_BATCH_OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Finalize batch proof fallbacks
        if: always()
        env:
          MODELS_JSON: ${{ inputs.models }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CI_IMAGE_OUTCOME: ${{ steps.ci_image.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          python3 - "$MODEL_PROOF_BATCH_OUTPUT_DIR" "$MODELS_JSON" "$REVISION" "$SUITE" \
            "$CHECKOUT_OUTCOME" "$CI_IMAGE_OUTCOME" "$PROOF_OUTCOME" <<'PY'
          import html
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root_arg, raw_models, revision, suite, checkout, ci_image, proof = sys.argv[1:]
          root = Path(root_arg)
          root.mkdir(parents=True, exist_ok=True)
          try:
              models = json.loads(raw_models)
          except json.JSONDecodeError:
              models = []
          if (
              not isinstance(models, list)
              or any(not isinstance(model, str) for model in models)
              or len(models) != len(set(models))
              or any(
                  not re.fullmatch(r"[a-z0-9][a-z0-9._-]*", model)
                  for model in models
              )
          ):
              models = []
          details = [
              f"Source checkout outcome: {checkout}",
              f"CI image outcome: {ci_image}",
              f"Batch proof outcome: {proof}",
          ]
          if checkout != "success":
              phase = "source-checkout"
          elif ci_image != "success":
              phase = "ci-image"
          else:
              phase = "batch-proof"

          batch_status_path = root / "batch-status.json"
          try:
              previous_batch_status = json.loads(
                  batch_status_path.read_text(encoding="utf-8")
              )
          except (OSError, json.JSONDecodeError):
              previous_batch_status = {}
          if not isinstance(previous_batch_status, dict):
              previous_batch_status = {}
          previous_model_items = previous_batch_status.get("models", [])
          if not isinstance(previous_model_items, list):
              previous_model_items = []
          previous_models = {
              item["model"]: item
              for item in previous_model_items
              if isinstance(item, dict) and isinstance(item.get("model"), str)
          }
          batch_was_interrupted = (
              proof == "cancelled"
              or previous_batch_status.get("outcome") == "interrupted"
          )

          def gpu_text(value):
              return "" if value is None else str(value)

          summaries = []
          results_dir = root / ".batch-state" / "results"
          for index, model in enumerate(models):
              artifacts = root / model / "artifacts"
              artifacts.mkdir(parents=True, exist_ok=True)
              status_path = artifacts / "model-proof-status.json"
              report_path = artifacts / "model-proof-report.html"
              try:
                  status = json.loads(status_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  status = {}
              if not isinstance(status, dict):
                  status = {}
              try:
                  report_text = report_path.read_text(encoding="utf-8")
              except OSError:
                  report_text = ""
              rich_report = (
                  bool(report_text)
                  and status.get("report_kind") != "workflow_fallback"
                  and 'data-report-kind="workflow-fallback"' not in report_text
              )
              result_path = results_dir / f"{index:06d}.json"
              try:
                  result = json.loads(result_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  result = {}
              if not isinstance(result, dict):
                  result = {}
              previous = previous_models.get(model, {})
              status_gpu = gpu_text(status.get("gpu_id"))
              previous_gpu = gpu_text(previous.get("gpu_id"))

              result_exit = result.get("exit_code")
              status_exit = status.get("exit_code")
              if not isinstance(status_exit, int):
                  status_exit = status.get("validation_exit_code")
              if isinstance(result_exit, int):
                  state = "passed" if result_exit == 0 else "failed"
                  exit_code = result_exit
                  duration = result.get("duration_seconds")
                  gpu_id = gpu_text(result.get("gpu_id"))
              elif rich_report and status.get("outcome") in {"passed", "failed"}:
                  state = str(status["outcome"])
                  exit_code = (
                      0
                      if state == "passed"
                      else status_exit if isinstance(status_exit, int) else 1
                  )
                  duration = None
                  gpu_id = status_gpu
              elif batch_was_interrupted and phase == "batch-proof":
                  was_claimed = (
                      previous.get("status") == "interrupted"
                      or bool(status_gpu)
                  )
                  if was_claimed:
                      state = "interrupted"
                      previous_exit = previous.get("exit_code")
                      exit_code = (
                          previous_exit
                          if isinstance(previous_exit, int) and previous_exit != 0
                          else 143
                      )
                      gpu_id = previous_gpu or status_gpu
                  else:
                      state = "queued"
                      exit_code = None
                      gpu_id = ""
                  duration = None
              else:
                  state = "failed"
                  exit_code = (
                      status_exit
                      if isinstance(status_exit, int) and status_exit != 0
                      else 1
                  )
                  duration = None
                  gpu_id = status_gpu

              # A zero result without its rich report is incomplete evidence,
              # so the workflow must fail closed and replace it with a
              # truthful fallback rather than certify an uninspectable pass.
              if state == "passed" and not rich_report:
                  state = "failed"
                  exit_code = 1

              if not rich_report:
                  messages = {
                      "failed": (
                          "Validation did not complete the isolated report path."
                      ),
                      "interrupted": (
                          "Validation started but was interrupted before completion."
                      ),
                      "queued": (
                          "Validation was queued but did not start before cancellation."
                      ),
                  }
                  status = {
                      "schema_version": 1,
                      "report_kind": "workflow_fallback",
                      "model": model,
                      "source_revision": revision,
                      "suite": suite,
                      "outcome": state,
                      "phase": phase,
                      "exit_code": exit_code,
                      "gpu_id": gpu_id,
                      "details": details,
                      "steps": {
                          "checkout": {
                              "status": "passed" if checkout == "success" else "failed",
                              "evidence": f"GitHub Actions outcome: {checkout}",
                          },
                          "ci_image": {
                              "status": "passed" if ci_image == "success" else "failed",
                              "evidence": f"GitHub Actions outcome: {ci_image}",
                          },
                          "batch_proof": {
                              "status": state,
                              "evidence": (
                                  f"GitHub Actions outcome: {proof}; "
                                  f"model state: {state}"
                              ),
                          },
                      },
                  }
                  status_path.write_text(
                      json.dumps(status, indent=2) + "\n", encoding="utf-8"
                  )
                  rows = "".join(
                      f"<tr><th>{html.escape(label)}</th><td>{html.escape(str(value))}</td></tr>"
                      for label, value in (
                          ("Model", model),
                          ("Pinned revision", revision),
                          ("Suite", suite),
                          ("Outcome", state.title()),
                          ("Workflow phase", phase),
                          ("Checkout", checkout),
                          ("CI image", ci_image),
                          ("Batch proof", proof),
                      )
                  )
                  report = f"""<!doctype html>
          <html lang="en" data-report-kind="workflow-fallback"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Isolated model proof {html.escape(state)}: {html.escape(model)}</title>
          <style>body{{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17202a}}table{{border-collapse:collapse;width:100%}}th,td{{border:1px solid #ccd1d1;padding:.6rem;text-align:left}}th{{width:12rem;background:#f4f6f7}}.failed{{border-left:.4rem solid #c0392b;background:#fdedec;padding:1rem}}.interrupted{{border-left:.4rem solid #d35400;background:#fef5e7;padding:1rem}}.queued{{border-left:.4rem solid #607d8b;background:#eceff1;padding:1rem}}</style>
          </head><body><h1>Isolated model proof</h1>
          <p class="{html.escape(state)}">{html.escape(messages[state])} This fallback preserves the workflow outcomes for this model.</p>
          <table>{rows}</table></body></html>"""
                  report_path.write_text(report, encoding="utf-8")
              summaries.append({
                  "model": model,
                  "gpu_id": gpu_id,
                  "status": state,
                  "exit_code": exit_code,
                  "duration_seconds": duration,
                  "output_dir": model,
                  "report": f"{model}/artifacts/model-proof-report.html",
                  "report_exists": report_path.is_file(),
                  "log": f"{model}/batch.log",
                  "log_exists": (root / model / "batch.log").is_file(),
              })

          counts = {
              state: sum(item["status"] == state for item in summaries)
              for state in ("passed", "failed", "interrupted", "queued")
          }
          batch_outcome = (
              "passed"
              if (
                  summaries
                  and counts["passed"] == len(summaries)
                  and checkout == "success"
                  and ci_image == "success"
                  and proof == "success"
              )
              else "failed"
          )
          gpu_ids = previous_batch_status.get("gpu_ids")
          if not isinstance(gpu_ids, list):
              gpu_ids = os.environ.get("TRTMC_MODEL_PROOF_GPU_IDS", "0,1,2,3").split(",")
          batch_status = {
              "schema_version": 1,
              "report_kind": "model_proof_batch",
              "source_revision": revision,
              "suite": suite,
              "outcome": batch_outcome,
              "expected_count": len(models),
              "model_count": len(models),
              "passed_count": counts["passed"],
              "failed_count": counts["failed"],
              "interrupted_count": counts["interrupted"],
              "queued_count": counts["queued"],
              "gpu_ids": gpu_ids,
              "models": summaries,
              "workflow_outcomes": {
                  "checkout": checkout,
                  "ci_image": ci_image,
                  "batch_proof": proof,
              },
          }
          batch_status_path.write_text(
              json.dumps(batch_status, indent=2) + "\n", encoding="utf-8"
          )

          index_path = root / "model-proof-index.html"
          rows = []
          for item in summaries:
              report_cell = (
                  f'<a href="{html.escape(item["report"], quote=True)}">HTML report</a>'
                  if item["report_exists"]
                  else "Unavailable"
              )
              log_cell = (
                  f'<a href="{html.escape(item["log"], quote=True)}">Batch log</a>'
                  if item["log_exists"]
                  else "Unavailable"
              )
              exit_cell = "" if item["exit_code"] is None else str(item["exit_code"])
              duration_cell = (
                  ""
                  if item["duration_seconds"] is None
                  else f'{item["duration_seconds"]} s'
              )
              rows.append(
                  "<tr>"
                  f'<td><code>{html.escape(item["model"])}</code></td>'
                  f'<td><code>{html.escape(item["gpu_id"])}</code></td>'
                  f'<td>{html.escape(item["status"])}</td>'
                  f"<td>{exit_cell}</td><td>{duration_cell}</td>"
                  f"<td>{report_cell}</td><td>{log_cell}</td>"
                  "</tr>"
              )
          index = f"""<!doctype html>
          <html lang="en" data-report-kind="model-proof-batch"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Isolated model proof batch</title>
          <style>body{{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17202a}}table{{border-collapse:collapse;width:100%}}th,td{{border:1px solid #ccd1d1;padding:.6rem;text-align:left}}</style>
          </head><body><h1>Isolated model proof batch</h1>
          <p>Outcome: <strong>{html.escape(batch_outcome)}</strong></p>
          <p>Revision <code>{html.escape(revision)}</code>; suite <code>{html.escape(suite)}</code>; models {len(models)}.</p>
          <table><thead><tr><th>Model</th><th>GPU</th><th>Status</th><th>Exit</th><th>Duration</th><th>Evidence</th><th>Log</th></tr></thead><tbody>{''.join(rows)}</tbody></table>
          </body></html>"""
          index_path.write_text(index, encoding="utf-8")
          PY

      - name: Upload batch proof evidence
        id: proof_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-proof-batch-${{ inputs.revision }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/batch-status.json
            ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/ci-image.log
            ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/*/batch.log
            ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/*/artifacts/
            !${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/*/artifacts/model-proof-report.html

      - name: Upload batch model proof HTML reports
        id: html_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-proof-html-batch-${{ inputs.revision }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/model-proof-index.html
            ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/*/batch.log
            ${{ runner.temp }}/model-proof-batch-${{ github.run_id }}-${{ github.run_attempt }}/*/artifacts/model-proof-report.html

      - name: Enforce certified batch outcome
        if: always()
        env:
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          PROOF_UPLOAD_OUTCOME: ${{ steps.proof_upload.outcome }}
          HTML_UPLOAD_OUTCOME: ${{ steps.html_upload.outcome }}
        run: |
          set -euo pipefail
          test -n "${MODEL_PROOF_BATCH_OUTPUT_DIR:-}" || {
            echo "::error::Batch proof output directory was not initialized"
            exit 1
          }
          python3 - \
            "$MODEL_PROOF_BATCH_OUTPUT_DIR/batch-status.json" \
            "$EXPECTED_COUNT" "$REVISION" "$SUITE" \
            "$PROOF_UPLOAD_OUTCOME" "$HTML_UPLOAD_OUTCOME" <<'PY'
          import json
          import sys
          from pathlib import Path

          status_path, expected_text, revision, suite, proof_upload, html_upload = (
              sys.argv[1:]
          )
          errors = []
          try:
              payload = json.loads(Path(status_path).read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"batch proof ledger is unavailable: {exc}") from exc
          if not isinstance(payload, dict):
              raise SystemExit("batch proof ledger must be a JSON object")
          expected = int(expected_text)
          models = payload.get("models")
          if not isinstance(models, list):
              models = []
              errors.append("models is not a list")

          required = {
              "report_kind": "model_proof_batch",
              "source_revision": revision,
              "suite": suite,
              "outcome": "passed",
              "expected_count": expected,
              "model_count": expected,
              "passed_count": expected,
              "failed_count": 0,
              "interrupted_count": 0,
              "queued_count": 0,
          }
          for field, wanted in required.items():
              if payload.get(field) != wanted:
                  errors.append(
                      f"{field}: expected {wanted!r}, found {payload.get(field)!r}"
                  )
          if len(models) != expected:
              errors.append(f"models: expected {expected} entries, found {len(models)}")
          for index, model in enumerate(models):
              if not isinstance(model, dict):
                  errors.append(f"models[{index}] is not an object")
                  continue
              if model.get("status") != "passed":
                  errors.append(
                      f"models[{index}] {model.get('model')!r}: "
                      f"status is {model.get('status')!r}"
                  )
              if model.get("exit_code") != 0:
                  errors.append(
                      f"models[{index}] {model.get('model')!r}: "
                      f"exit_code is {model.get('exit_code')!r}"
                  )
              if model.get("report_exists") is not True:
                  errors.append(
                      f"models[{index}] {model.get('model')!r}: HTML report is missing"
                  )

          outcomes = payload.get("workflow_outcomes")
          if not isinstance(outcomes, dict):
              errors.append("workflow_outcomes is not an object")
          else:
              for step in ("checkout", "ci_image", "batch_proof"):
                  if outcomes.get(step) != "success":
                      errors.append(
                          f"workflow_outcomes.{step}: expected 'success', "
                          f"found {outcomes.get(step)!r}"
                      )
          if proof_upload != "success":
              errors.append(f"proof artifact upload outcome is {proof_upload!r}")
          if html_upload != "success":
              errors.append(f"HTML artifact upload outcome is {html_upload!r}")

          if errors:
              print("Batch proof certification failed:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Certified {expected} isolated model proof(s) for {revision}.")
          PY

      - name: Clean batch proof scratch space
        if: always()
        env:
          PROOF_UPLOAD_OUTCOME: ${{ steps.proof_upload.outcome }}
          HTML_UPLOAD_OUTCOME: ${{ steps.html_upload.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${MODEL_PROOF_BATCH_OUTPUT_DIR:-}" ]; then
            echo "No batch proof output directory was initialized; nothing to clean."
            exit 0
          fi
          case "$MODEL_PROOF_BATCH_OUTPUT_DIR" in
            "$RUNNER_TEMP"/model-proof-batch-*) ;;
            *) echo "Refusing to clean unsafe batch proof path: $MODEL_PROOF_BATCH_OUTPUT_DIR" >&2; exit 1 ;;
          esac
          find "$MODEL_PROOF_BATCH_OUTPUT_DIR" -mindepth 2 -maxdepth 2 -type d \
            \( -name work -o -name projection \) -exec rm -rf -- {} +
          if [ "$PROOF_UPLOAD_OUTCOME" = "success" ] && [ "$HTML_UPLOAD_OUTCOME" = "success" ]; then
            rm -rf -- "$MODEL_PROOF_BATCH_OUTPUT_DIR"
          else
            echo "Keeping local proof artifacts because an artifact upload did not succeed."
          fi
          df -h "$RUNNER_TEMP"
