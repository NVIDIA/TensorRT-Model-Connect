name: Isolated model proof

on:
  workflow_call:
    inputs:
      model:
        description: "One affected model ownership identifier"
        required: true
        type: string
      revision:
        description: "Exact Git commit to certify"
        required: true
        type: string
      suite:
        description: "Model-owned E2E scope: premerge or nightly"
        required: false
        default: "premerge"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  prove:
    name: ${{ inputs.model }}
    runs-on: ${{ fromJSON(vars.TRTMC_MODEL_RUNNER_LABELS || '["trtmc-gb300-proof"]') }}
    # Reserve time after the bounded disk/image/proof steps for fallback
    # generation and artifact publication even when a model reaches a timeout.
    timeout-minutes: ${{ inputs.suite == 'nightly' && 540 || 300 }}

    defaults:
      run:
        shell: bash

    env:
      TRTMC_CI_IMAGE: ${{ vars.TRTMC_MANYLINUX_CI_IMAGE || 'trtmc-dev-gb300:manylinux_2_39' }}
      TRTMC_CI_IMAGE_LOCK_FILE: ${{ vars.TRTMC_CI_IMAGE_LOCK_FILE || '/tmp/trtmc-ci-docker-image.lock' }}
      TRTMC_MODEL_PROOF_BUILD_JOBS: ${{ vars.TRTMC_MODEL_PROOF_BUILD_JOBS || '2' }}
      TRTMC_MODEL_PROOF_GPU_LEASE_TIMEOUT_SECONDS: ${{ vars.TRTMC_MODEL_PROOF_GPU_LEASE_TIMEOUT_SECONDS || (inputs.suite == 'nightly' && '5400' || '3600') }}
      TRTMC_MODEL_PROOF_MIN_FREE_GIB: ${{ vars.TRTMC_MODEL_PROOF_MIN_FREE_GIB || '40' }}
      TRTMC_MODEL_PROOF_DISK_HEADROOM_TIMEOUT_SECONDS: ${{ vars.TRTMC_MODEL_PROOF_DISK_HEADROOM_TIMEOUT_SECONDS || (inputs.suite == 'nightly' && '3600' || '60') }}
      TRTMC_MODEL_PROOF_DISK_HEADROOM_POLL_SECONDS: ${{ vars.TRTMC_MODEL_PROOF_DISK_HEADROOM_POLL_SECONDS || '10' }}
      TRTMC_MODEL_PROOF_STALE_MINUTES: ${{ vars.TRTMC_MODEL_PROOF_STALE_MINUTES || (inputs.suite == 'nightly' && '600' || '360') }}
      PYTHONHASHSEED: "0"

    steps:
      - name: Bootstrap model HTML before checkout
        env:
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          # A cancelled worker can finish clearing runner.temp after this runner
          # is reassigned. Keep long-lived proof state beside, not inside, it.
          MODEL_PROOF_OUTPUT_DIR: ${{ github.workspace }}/model-proof-output-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.model }}
        run: |
          set -euo pipefail
          if ! [[ "$MODEL" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Unsafe model identifier: $MODEL" >&2
            exit 1
          fi
          echo "MODEL_PROOF_OUTPUT_DIR=$MODEL_PROOF_OUTPUT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$MODEL_PROOF_OUTPUT_DIR/artifacts"
          python3 - "$MODEL_PROOF_OUTPUT_DIR/artifacts" "$MODEL" "$REVISION" "$SUITE" <<'PY'
          import html
          import json
          import re
          import sys
          from pathlib import Path

          output, model, revision, suite = sys.argv[1:]
          if re.fullmatch(r"[a-z0-9][a-z0-9._-]*", model) is None:
              raise SystemExit(f"unsafe model identifier: {model!r}")
          if suite not in {"premerge", "nightly"}:
              raise SystemExit(f"unsupported suite: {suite!r}")
          root = Path(output)
          status = {
              "schema_version": 1,
              "report_kind": "workflow_fallback",
              "model": model,
              "source_revision": revision,
              "suite": suite,
              "outcome": "running",
              "phase": "workflow-bootstrap",
              "steps": {
                  "host_setup": {
                      "status": "running",
                      "evidence": "GitHub Actions workflow bootstrap",
                  }
              },
          }
          (root / "model-proof-status.json").write_text(
              json.dumps(status, indent=2) + "\n", encoding="utf-8"
          )
          document = f"""<!DOCTYPE html>
          <html lang="en" data-report-kind="workflow-fallback"><head><meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Isolated Model Proof: {html.escape(model)}</title>
          <style>body{{font-family:system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem}}.pending{{padding:1rem;background:#fff7ed;border:1px solid #fdba74;border-radius:.5rem}}code{{overflow-wrap:anywhere}}</style>
          </head><body><h1>Isolated Model Proof: {html.escape(model)}</h1>
          <div class="pending"><strong>The isolated proof is being prepared.</strong></div>
          <p>Revision: <code>{html.escape(revision)}</code></p>
          <p>Suite: <code>{html.escape(suite)}</code></p></body></html>"""
          (root / "model-proof-report.html").write_text(document, encoding="utf-8")
          PY

      - name: Validate host proof policy
        run: |
          set -euo pipefail
          if ! [[ "${TRTMC_NODE_ID:-}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "::error::TRTMC_NODE_ID is not configured safely by this proof runner."
            exit 1
          fi
          if [ -z "${TRTMC_MODEL_PROOF_GPU_IDS:-}" ]; then
            echo "::error::TRTMC_MODEL_PROOF_GPU_IDS is not configured by this proof runner."
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_GPU_IDS" =~ ^(0|[1-9][0-9]*)(,(0|[1-9][0-9]*))*$ ]]; then
            echo "::error::TRTMC_MODEL_PROOF_GPU_IDS is not a canonical GPU index list."
            exit 1
          fi
          IFS=',' read -r -a gpu_ids <<< "$TRTMC_MODEL_PROOF_GPU_IDS"
          declare -A seen_gpu_ids=()
          for gpu_id in "${gpu_ids[@]}"; do
            if [ -n "${seen_gpu_ids[$gpu_id]:-}" ]; then
              echo "::error::TRTMC_MODEL_PROOF_GPU_IDS contains duplicate GPU index $gpu_id."
              exit 1
            fi
            seen_gpu_ids[$gpu_id]=1
          done
          for name in \
            TRTMC_MODEL_PROOF_SLOTS_PER_GPU \
            TRTMC_MODEL_PROOF_GPU_LOCK_DIR \
            TRTMC_HF_CACHE \
            TRTMC_HF_HUB_CACHE \
            TRTMC_HF_CACHE_LOCK_FILE \
            TRTMC_MODEL_REFERENCE_CACHE_ROOT; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not configured by this proof runner."
              exit 1
            fi
          done
          for name in \
            TRTMC_MODEL_PROOF_GPU_LOCK_DIR \
            TRTMC_HF_CACHE \
            TRTMC_HF_HUB_CACHE \
            TRTMC_HF_CACHE_LOCK_FILE \
            TRTMC_MODEL_REFERENCE_CACHE_ROOT; do
            value="${!name}"
            case "$value" in
              /*) ;;
              *) echo "::error::$name must be an absolute host path."; exit 1 ;;
            esac
            if [ "$value" = "/" ]; then
              echo "::error::$name must not be the filesystem root."
              exit 1
            fi
          done
          if ! [[ "$TRTMC_MODEL_PROOF_SLOTS_PER_GPU" =~ ^([1-9]|1[0-6])$ ]]; then
            echo "::error::TRTMC_MODEL_PROOF_SLOTS_PER_GPU must be an integer from 1 to 16."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          cache_root = Path(os.environ["TRTMC_HF_CACHE"]).resolve()
          hub = Path(os.environ["TRTMC_HF_HUB_CACHE"]).resolve()

          def overlaps(left: Path, right: Path) -> bool:
              return left == right or left in right.parents or right in left.parents

          if cache_root == Path("/") or hub == cache_root or cache_root not in hub.parents:
              raise SystemExit("TRTMC_HF_HUB_CACHE must be a strict child of TRTMC_HF_CACHE")
          for name in (
              "TRTMC_HF_CACHE",
              "TRTMC_HF_HUB_CACHE",
              "TRTMC_MODEL_PROOF_GPU_LOCK_DIR",
              "TRTMC_MODEL_REFERENCE_CACHE_ROOT",
          ):
              if overlaps(Path(os.environ[name]).resolve(), workspace):
                  raise SystemExit(f"{name} must not overlap GITHUB_WORKSPACE")
          PY
          echo "Node-local proof policy: node=$TRTMC_NODE_ID gpus=$TRTMC_MODEL_PROOF_GPU_IDS"

      - name: Check model proof disk headroom
        run: |
          set -euo pipefail
          if ! [[ "$TRTMC_MODEL_PROOF_MIN_FREE_GIB" =~ ^[1-9][0-9]*$ ]]; then
            echo "TRTMC_MODEL_PROOF_MIN_FREE_GIB must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_STALE_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "TRTMC_MODEL_PROOF_STALE_MINUTES must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_DISK_HEADROOM_TIMEOUT_SECONDS" =~ ^(0|[1-9][0-9]{0,3})$ ]] || \
             [ "$TRTMC_MODEL_PROOF_DISK_HEADROOM_TIMEOUT_SECONDS" -gt 3600 ]; then
            echo "TRTMC_MODEL_PROOF_DISK_HEADROOM_TIMEOUT_SECONDS must be an integer from 0 to 3600." >&2
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_DISK_HEADROOM_POLL_SECONDS" =~ ^[1-9][0-9]?$ ]] || \
             [ "$TRTMC_MODEL_PROOF_DISK_HEADROOM_POLL_SECONDS" -gt 60 ]; then
            echo "TRTMC_MODEL_PROOF_DISK_HEADROOM_POLL_SECONDS must be an integer from 1 to 60." >&2
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_GPU_IDS" =~ ^(0|[1-9][0-9]*)(,(0|[1-9][0-9]*))*$ ]]; then
            echo "TRTMC_MODEL_PROOF_GPU_IDS must be a comma-separated list of non-negative integers." >&2
            exit 1
          fi
          if ! [[ "$TRTMC_MODEL_PROOF_SLOTS_PER_GPU" =~ ^[1-9][0-9]*$ ]] || \
             [ "$TRTMC_MODEL_PROOF_SLOTS_PER_GPU" -gt 16 ]; then
            echo "TRTMC_MODEL_PROOF_SLOTS_PER_GPU must be an integer from 1 to 16." >&2
            exit 1
          fi
          while IFS= read -r -d '' stale_dir; do
            case "$stale_dir" in
              "$GITHUB_WORKSPACE"/model-proof-output-*) ;;
              *) echo "Refusing to clean unsafe stale path: $stale_dir" >&2; exit 1 ;;
            esac
            [ "$stale_dir" != "$MODEL_PROOF_OUTPUT_DIR" ] || continue
            find "$stale_dir" -mindepth 1 -maxdepth 1 -type d \
              \( -name work -o -name projection \) -exec rm -rf -- {} +
          done < <(
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -type d \
              -name 'model-proof-output-*' -mmin "+$TRTMC_MODEL_PROOF_STALE_MINUTES" \
              -print0
          )
          IFS=, read -r -a gpu_ids <<< "$TRTMC_MODEL_PROOF_GPU_IDS"
          declare -A seen_gpu_ids=()
          for gpu_id in "${gpu_ids[@]}"; do
            if [ -n "${seen_gpu_ids[$gpu_id]+x}" ]; then
              echo "TRTMC_MODEL_PROOF_GPU_IDS contains duplicate GPU ID: $gpu_id" >&2
              exit 1
            fi
            seen_gpu_ids[$gpu_id]=1
          done
          proof_capacity="$((${#gpu_ids[@]} * TRTMC_MODEL_PROOF_SLOTS_PER_GPU))"
          required_gib="$((TRTMC_MODEL_PROOF_MIN_FREE_GIB * proof_capacity))"
          required_kib="$((required_gib * 1024 * 1024))"
          waited_seconds=0
          while :; do
            available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')"
            if ! [[ "$available_kib" =~ ^[0-9]+$ ]]; then
              echo "Unable to determine model-proof disk headroom from df." >&2
              exit 1
            fi
            available_gib="$((available_kib / 1024 / 1024))"
            if [ "$available_kib" -ge "$required_kib" ]; then
              echo "Model-proof disk headroom ready after ${waited_seconds}s: ${available_gib} GiB available; ${required_gib} GiB required for ${proof_capacity} GPU proof slots."
              break
            fi
            if [ "$waited_seconds" -ge "$TRTMC_MODEL_PROOF_DISK_HEADROOM_TIMEOUT_SECONDS" ]; then
              echo "Insufficient model-proof disk headroom after waiting ${waited_seconds}s: ${available_gib} GiB available; ${required_gib} GiB required for ${proof_capacity} GPU proof slots." >&2
              exit 1
            fi
            remaining_seconds="$((TRTMC_MODEL_PROOF_DISK_HEADROOM_TIMEOUT_SECONDS - waited_seconds))"
            sleep_seconds="$TRTMC_MODEL_PROOF_DISK_HEADROOM_POLL_SECONDS"
            if [ "$sleep_seconds" -gt "$remaining_seconds" ]; then
              sleep_seconds="$remaining_seconds"
            fi
            echo "Waiting for model-proof disk headroom: ${available_gib} GiB available; ${required_gib} GiB required for ${proof_capacity} GPU proof slots; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
            waited_seconds="$((waited_seconds + sleep_seconds))"
          done

      - name: Check out exact source revision
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: model-proof-source
          fetch-depth: 0
          persist-credentials: false
          clean: true
          lfs: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker_config="${RUNNER_TEMP}/trtmc-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          printf '%s' "$GHCR_TOKEN" | DOCKER_CONFIG="$docker_config" docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Ensure CI Docker image
        id: ci_image
        timeout-minutes: 90
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          python3 -m tools.ci image ensure \
            2>&1 | tee "$MODEL_PROOF_OUTPUT_DIR/ci-image.log"

      - name: Run isolated model proof
        id: proof
        timeout-minutes: ${{ inputs.suite == 'nightly' && 360 || 150 }}
        env:
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          TRTMC_CI_IMAGE: ${{ steps.ci_image.outputs.image_ref }}
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set +e
          env -u TRTMC_GPU_ID python3 -m tools.ci model-proof \
            --model "$MODEL" \
            --revision "$REVISION" \
            --suite "$SUITE" \
            --output-dir "$MODEL_PROOF_OUTPUT_DIR"
          proof_rc=$?
          set -e
          printf '%s\n' "$proof_rc" > "$MODEL_PROOF_OUTPUT_DIR/proof-exit-code.txt"
          exit "$proof_rc"

      - name: Reconcile model proof containers
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          MODEL: ${{ inputs.model }}
        working-directory: ${{ github.workspace }}/model-proof-source
        run: |
          set -euo pipefail
          python3 -m tools.ci model-proof \
            --cleanup-containers \
            --model "$MODEL"

      - name: Finalize model proof fallback
        if: ${{ always() }}
        env:
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CI_IMAGE_OUTCOME: ${{ steps.ci_image.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            rm -rf "$DOCKER_CONFIG"
          fi
          artifacts="$MODEL_PROOF_OUTPUT_DIR/artifacts"
          mkdir -p "$artifacts"
          if [ -f "$MODEL_PROOF_OUTPUT_DIR/ci-image.log" ]; then
            cp "$MODEL_PROOF_OUTPUT_DIR/ci-image.log" "$artifacts/ci-image.log"
          fi
          if [ "$PROOF_OUTCOME" = "success" ]; then
            exit 0
          fi
          proof_exit_code=1
          if [ -f "$MODEL_PROOF_OUTPUT_DIR/proof-exit-code.txt" ]; then
            IFS= read -r proof_exit_code < "$MODEL_PROOF_OUTPUT_DIR/proof-exit-code.txt" || \
              proof_exit_code=1
            if ! [[ "$proof_exit_code" =~ ^[0-9]+$ ]]; then
              proof_exit_code=1
            fi
          fi
          if [ "$CHECKOUT_OUTCOME" = "success" ] && \
             [ -f "$GITHUB_WORKSPACE/model-proof-source/.github/scripts/write-model-proof-fallback-report.py" ]; then
            phase="workflow-model-proof"
            if [ "$CI_IMAGE_OUTCOME" != "success" ]; then
              phase="workflow-ci-image"
            fi
            python3 "$GITHUB_WORKSPACE/model-proof-source/.github/scripts/write-model-proof-fallback-report.py" \
              --artifacts-dir "$artifacts" \
              --model "$MODEL" \
              --revision "$REVISION" \
              --suite "$SUITE" \
              --outcome failed \
              --phase "$phase" \
              --exit-code "$proof_exit_code" \
              --detail "Source checkout outcome: $CHECKOUT_OUTCOME" \
              --detail "CI image outcome: $CI_IMAGE_OUTCOME" \
              --detail "Model proof outcome: $PROOF_OUTCOME" \
              --preserve-rich-report
          else
            python3 - "$artifacts/model-proof-status.json" "$artifacts/model-proof-report.html" \
              "$MODEL" "$REVISION" "$SUITE" "$CHECKOUT_OUTCOME" <<'PY'
          import html
          import json
          import sys
          from pathlib import Path

          status_path, report_path, model, revision, suite, checkout = sys.argv[1:]
          status = {
              "schema_version": 1,
              "report_kind": "workflow_fallback",
              "model": model,
              "source_revision": revision,
              "suite": suite,
              "outcome": "failed",
              "phase": "workflow-source-checkout",
              "exit_code": 1,
              "details": [f"Source checkout outcome: {checkout}"],
          }
          Path(status_path).write_text(
              json.dumps(status, indent=2) + "\n", encoding="utf-8"
          )
          Path(report_path).write_text(
              "<!DOCTYPE html><html lang='en' data-report-kind='workflow-fallback'>"
              "<head><meta charset='utf-8'><title>Isolated model proof failed</title></head>"
              f"<body><h1>{html.escape(model)}</h1><p>Source checkout failed: "
              f"{html.escape(checkout)}</p><p><code>{html.escape(revision)}</code></p>"
              "</body></html>",
              encoding="utf-8",
          )
          PY
          fi

      - name: Upload isolated model proof artifact
        id: artifact_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-proof-${{ inputs.model }}-${{ inputs.revision }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ github.workspace }}/model-proof-output-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.model }}/artifacts/

      - name: Enforce isolated model certification
        if: ${{ always() }}
        env:
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          SUITE: ${{ inputs.suite }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CI_IMAGE_OUTCOME: ${{ steps.ci_image.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          ARTIFACT_UPLOAD_OUTCOME: ${{ steps.artifact_upload.outcome }}
        run: |
          set -euo pipefail
          test "$CHECKOUT_OUTCOME" = "success"
          test "$CI_IMAGE_OUTCOME" = "success"
          test "$PROOF_OUTCOME" = "success"
          test "$ARTIFACT_UPLOAD_OUTCOME" = "success"
          python3 - \
            "$MODEL_PROOF_OUTPUT_DIR/artifacts" "$MODEL" "$REVISION" "$SUITE" \
            "$GITHUB_RUN_ID" "$RUNNER_NAME" "$TRTMC_NODE_ID" <<'PY'
          import datetime
          import json
          import re
          import sys
          from pathlib import Path

          root, model, revision, suite, run_id, runner_name, node_id = sys.argv[1:]
          root = Path(root)
          status = json.loads((root / "model-proof-status.json").read_text(encoding="utf-8"))
          proof = json.loads((root / "proof.json").read_text(encoding="utf-8"))
          selection = json.loads((root / "selection.json").read_text(encoding="utf-8"))
          lease = json.loads((root / "gpu-lease.json").read_text(encoding="utf-8"))
          errors = []
          for label, payload in (("status", status), ("proof", proof)):
              if payload.get("model") != model:
                  errors.append(f"{label}.model is {payload.get('model')!r}")
              if payload.get("source_revision") != revision:
                  errors.append(f"{label}.source_revision is {payload.get('source_revision')!r}")
          if status.get("suite") != suite or status.get("outcome") != "passed":
              errors.append("model-proof status is not a passing certification")
          if proof.get("passed") is not True:
              errors.append("proof.json does not declare passed=true")
          if selection.get("requested_model") != model:
              errors.append("selection.json does not match the requested model")
          expected_lease = {
              "schema_version": 2,
              "model": model,
              "source_revision": revision,
              "run_id": run_id,
              "runner_name": runner_name,
              "node_id": node_id,
              "resource_class": selection.get("resource_class"),
              "gpu_resource_class": selection.get("resource_class"),
          }
          for field, wanted in expected_lease.items():
              if lease.get(field) != wanted:
                  errors.append(
                      f"gpu-lease.{field} is {lease.get(field)!r}; expected {wanted!r}"
                  )
          gpu_index = lease.get("gpu_index")
          if (
              not isinstance(gpu_index, str)
              or not gpu_index.isdigit()
              or lease.get("gpu_id") != gpu_index
          ):
              errors.append("gpu-lease GPU index is not a canonical non-negative integer")
          if not re.fullmatch(r"GPU-[A-Za-z0-9-]+", str(lease.get("gpu_uuid", ""))):
              errors.append("gpu-lease GPU UUID is missing or malformed")
          if not re.fullmatch(r"[0-9a-f]{64}", str(lease.get("lock_namespace", ""))):
              errors.append("gpu-lease lock namespace is missing or malformed")
          slots_per_gpu = lease.get("slots_per_gpu")
          slot_ids = lease.get("gpu_slot_ids")
          if (
              not isinstance(slots_per_gpu, int)
              or slots_per_gpu < 1
              or not isinstance(slot_ids, list)
              or not slot_ids
              or any(not isinstance(slot, int) for slot in slot_ids)
              or lease.get("gpu_slots") != slot_ids
              or lease.get("gpu_slots_per_device") != slots_per_gpu
          ):
              errors.append("gpu-lease slot evidence is inconsistent")
          elif lease.get("resource_class") == "shared":
              if len(slot_ids) != 1 or lease.get("gpu_slot") != slot_ids[0]:
                  errors.append("shared gpu-lease does not identify exactly one slot")
          elif slot_ids != list(range(slots_per_gpu)) or lease.get("gpu_slot") is not None:
              errors.append("exclusive gpu-lease does not own every slot")
          timestamps = []
          for field in ("acquired_at", "released_at"):
              try:
                  timestamp = datetime.datetime.fromisoformat(str(lease.get(field, "")))
              except ValueError:
                  errors.append(f"gpu-lease.{field} is not an ISO-8601 timestamp")
                  continue
              if timestamp.tzinfo is None:
                  errors.append(f"gpu-lease.{field} has no timezone")
              timestamps.append(timestamp)
          if len(timestamps) == 2 and timestamps[1] < timestamps[0]:
              errors.append("gpu-lease released_at precedes acquired_at")
          if not (root / "model-proof-report.html").is_file():
              errors.append("model-proof-report.html is missing")
          if errors:
              raise SystemExit("Isolated model certification failed:\n- " + "\n- ".join(errors))
          PY

      - name: Clean model proof scratch space
        if: ${{ always() }}
        env:
          ARTIFACT_UPLOAD_OUTCOME: ${{ steps.artifact_upload.outcome }}
        run: |
          set -euo pipefail
          case "${MODEL_PROOF_OUTPUT_DIR:-}" in
            "$GITHUB_WORKSPACE"/model-proof-output-*) ;;
            *) echo "Refusing to clean unsafe model proof path: ${MODEL_PROOF_OUTPUT_DIR:-}" >&2; exit 1 ;;
          esac
          find "$MODEL_PROOF_OUTPUT_DIR" -mindepth 1 -maxdepth 1 -type d \
            \( -name work -o -name projection \) -exec rm -rf -- {} +
          if [ "$ARTIFACT_UPLOAD_OUTCOME" = "success" ]; then
            rm -rf -- "$MODEL_PROOF_OUTPUT_DIR"
          else
            echo "Keeping local proof artifacts because upload did not succeed."
          fi
          df -h "$GITHUB_WORKSPACE"
