name: TensorRT-Model-Connect Nightly CI

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test with the full nightly workflow"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: trtmc-nightly-main
  cancel-in-progress: false

env:
  ENGINE_DIR: ${{ vars.TRTMC_ENGINE_DIR || '/workspace/users/yifeif/tensorrt-model-connect/engines' }}
  TRTMC_STORAGE_ROOT: ${{ vars.TRTMC_STORAGE_ROOT || '/workspace/users/yifeif/tensorrt-model-connect' }}
  HF_HOME: ${{ vars.TRTMC_HF_HOME || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache' }}
  HF_HUB_CACHE: ${{ vars.TRTMC_HF_HUB_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/hub' }}
  HUGGINGFACE_HUB_CACHE: ${{ vars.TRTMC_HF_HUB_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/hub' }}
  HF_MODULES_CACHE: ${{ vars.TRTMC_HF_MODULES_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/modules' }}
  TRTMC_CI_IMAGE: ${{ vars.TRTMC_MANYLINUX_CI_IMAGE || 'trtmc-dev-gb300:manylinux_2_39' }}
  TRTMC_CI_CONTAINER_NAME: trtmc-ci-${{ github.run_id }}-${{ github.run_attempt }}
  TRTMC_CONTAINER_OPTIONS: ${{ vars.TRTMC_CONTAINER_OPTIONS || '--gpus all --ipc=host --ulimit memlock=-1 --ulimit stack=67108864' }}
  TRTMC_PACKAGE_PYTHON_TAGS: ${{ vars.TRTMC_PACKAGE_PYTHON_TAGS || 'py310 py312' }}
  TRTMC_PACKAGE_WHEEL_ARCH: ${{ vars.TRTMC_PACKAGE_WHEEL_ARCH || 'manylinux_2_39_aarch64' }}
  PYTHONHASHSEED: "0"
  PYTHON_COVERAGE_MIN_LINE: "38"
  PYTHON_COVERAGE_MIN_BRANCH: "25"
  CPP_COVERAGE_MIN_LINE: "36"
  CPP_COVERAGE_MIN_FUNCTION: "46"
  CPP_COVERAGE_MIN_BRANCH: "21"
  FULL_E2E: "true"
  RUN_COVERAGE_MAP: "true"
  REBUILD_ENGINES: "true"
  DIFFUSION_VLM_ASSESSMENT: "true"
  DIFFUSION_VLM_MODEL_ID: ${{ vars.TRTMC_DIFFUSION_VLM_MODEL_ID || 'Qwen/Qwen2.5-VL-3B-Instruct' }}
  DIFFUSION_VLM_MAX_SIDE: "512"
  DIFFUSION_VLM_MAX_NEW_TOKENS: "384"
  DIFFUSION_VLM_TIMEOUT: "45m"
  NIGHTLY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  nightly-ci:
    name: Nightly Full CI
    runs-on: ${{ fromJSON(vars.TRTMC_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 720

    defaults:
      run:
        shell: bash

    steps:
      - name: Pre-clean self-hosted workspace
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE" ]; then
            chmod -R a+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true
            docker rm -f "$TRTMC_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
            if docker image inspect "$TRTMC_CI_IMAGE" >/dev/null 2>&1; then
              docker run --rm \
                -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
                -w "$GITHUB_WORKSPACE" \
                "$TRTMC_CI_IMAGE" \
                bash -lc '
                  set -euo pipefail
                  cleanup_workspace() {
                    find . -mindepth 1 -maxdepth 1 ! -name .git -exec chmod -R u+rwX {} + 2>/dev/null || true
                    find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                  }
                  cleanup_workspace || {
                    echo "::warning::Initial workspace cleanup failed; retrying after canceled-run processes settle"
                    sleep 10
                    cleanup_workspace
                  }
                '
            else
              echo "::warning::Docker image '$TRTMC_CI_IMAGE' is not present before checkout; using host workspace cleanup so the checked-out Dockerfile can build it later."
              find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec chmod -R u+rwX {} + 2>/dev/null || true
              find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + || true
            fi
          fi

      - name: Check out nightly ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_REF }}
          fetch-depth: 0
          clean: false
          lfs: false

      - name: Resolve comparison base
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [ "$NIGHTLY_REF" = "main" ]; then
            base="HEAD~1"
          else
            base="origin/main"
          fi
          echo "CI_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "Running nightly on GitHub ref '$NIGHTLY_REF': $(git rev-parse HEAD)"

      - name: Report CI mode
        run: |
          set -euo pipefail
          echo "CI mode: nightly/full E2E on GitHub ref '$NIGHTLY_REF'"
          echo "FULL_E2E=$FULL_E2E"
          echo "RUN_COVERAGE_MAP=$RUN_COVERAGE_MAP"
          echo "REBUILD_ENGINES=$REBUILD_ENGINES"

      - name: Ensure CI Docker image
        timeout-minutes: 180
        run: bash .github/scripts/ensure-ci-docker-image.sh

      - name: Start CI container
        timeout-minutes: 5
        run: bash .github/scripts/start-gha-container.sh

      - name: Build trtmc pip package
        timeout-minutes: 30
        run: bash .github/scripts/run-gha-stage.sh package

      - name: Impact analysis
        if: ${{ always() }}
        timeout-minutes: 5
        run: bash .github/scripts/run-gha-stage.sh impact

      - name: Build C++ test executables
        if: ${{ always() }}
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh build

      - name: Check family coverage
        if: ${{ always() }}
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh family-coverage

      - name: Check cyclomatic complexity
        if: ${{ always() }}
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh complexity

      - name: Lint changed files
        if: ${{ always() }}
        timeout-minutes: 5
        run: bash .github/scripts/run-gha-stage.sh lint

      - name: C++ unit tests
        if: ${{ always() }}
        timeout-minutes: 20
        run: bash .github/scripts/run-gha-stage.sh cpp-unit

      - name: Python builder and tools tests
        if: ${{ always() }}
        timeout-minutes: 40
        run: bash .github/scripts/run-gha-stage.sh python-builder

      - name: C++ coverage
        if: ${{ always() }}
        timeout-minutes: 40
        run: bash .github/scripts/run-gha-stage.sh cpp-coverage

      - name: Graph-op GPU tests
        if: ${{ always() }}
        timeout-minutes: 20
        run: bash .github/scripts/run-gha-stage.sh graph-ops

      - name: Full E2E tests
        if: ${{ always() }}
        timeout-minutes: 360
        run: bash .github/scripts/run-gha-stage.sh full-e2e

      - name: Generate coverage map
        if: ${{ always() }}
        timeout-minutes: 90
        run: bash .github/scripts/run-gha-stage.sh coverage-map

      - name: Qwen smoke test from trtmc pip package
        timeout-minutes: 60
        run: bash .github/scripts/run-gha-stage.sh wheel-qwen-smoke

      - name: Upload trtmc pip package artifact
        uses: actions/upload-artifact@v4
        with:
          name: trtmc-pip-package-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: dist/*.whl

      - name: Publish trtmc pip package to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          compgen -G "dist/*.whl" >/dev/null || {
            echo "::error::No trtmc wheel found under dist/"
            exit 1
          }
          release_payload="$(python3 - <<'PY'
          import json
          import os

          tag = f"trtmc-nightly-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(json.dumps({
              "tag_name": tag,
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": f"TRTMC Nightly {os.environ['GITHUB_RUN_ID']} attempt {os.environ['GITHUB_RUN_ATTEMPT']}",
              "body": f"Nightly TensorRT-Model-Connect pip package built by {run_url}.",
              "draft": False,
              "prerelease": True,
              "make_latest": "false",
          }))
          PY
          )"
          curl -sSfL \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -d "$release_payload" \
            > release.json
          upload_url="$(python3 - <<'PY'
          import json
          print(json.load(open("release.json"))["upload_url"].split("{", 1)[0])
          PY
          )"
          for asset in dist/*.whl; do
            name="$(basename "$asset")"
            curl -sSfL \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$asset" \
              "${upload_url}?name=${name}" \
              > /dev/null
            echo "Published release asset: $name"
          done

      - name: Write CI summary
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/generate_ci_summary.py \
            --mode nightly \
            --artifacts-dir e2e_artifacts/artifacts \
            --report-path e2e_artifacts/e2e_report.html \
            --html-artifact-name "trtmc-nightly-html-report-${GITHUB_RUN_ID}" \
            --full-artifact-name "trtmc-nightly-${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trtmc-nightly-html-report-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: e2e_artifacts/e2e_report.html

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trtmc-nightly-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            impact.json
            coverage_map.json
            coverage/
            e2e_artifacts/

      - name: Stop CI container
        if: always()
        run: docker rm -f "$TRTMC_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
