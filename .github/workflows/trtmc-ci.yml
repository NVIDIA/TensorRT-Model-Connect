name: TensorRT-Model-Connect Premerge CI

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.head.ref)
      || format('Manual · {0}', github.ref_name) }}

on:
  pull_request:
    branches:
      - main
      # Temporary validation target for the sample ownership PRs. Remove once
      # CI-improvement is merged and the required check is enabled on main.
      - CI-improvement
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Git ref to compare against (defaults to HEAD^)"
        required: false
        type: string
      head_ref:
        description: "Git ref to test (defaults to the dispatched commit)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trtmc-premerge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legal:
    # Keep this exact name: main's repository ruleset requires this context.
    name: Legal compliance
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'run-ci')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check canonical legal documents
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "LICENSE": "d07c0367e2861e7fe70fa1b679f879f4fa2f9138ade4457d44ecf8b2e135bb45",
              "CONTRIBUTING.md": "efc27920357d41bd5fe87108dbf35089b5bed1c90a05cf23577c9e1b52c698eb",
              "NOTICE": "fca31175673a934f79dace4b3cdb40eac41e781e06ffb3ecba99d86dee07484c",
          }
          for path, expected_digest in expected.items():
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(
                      f"{path}: expected SHA-256 {expected_digest}, found {digest}"
                  )
          PY

      - name: Check all tracked source headers
        run: python tools/legal_headers.py --check

  impact:
    name: 2 / Ownership and impact
    needs: legal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.impact.outputs.matrix }}
      has_models: ${{ steps.impact.outputs.has_models }}
      affected_models: ${{ steps.impact.outputs.affected_models }}
      expected_count: ${{ steps.impact.outputs.expected_count }}
      mode: ${{ steps.impact.outputs.mode }}
      head_sha: ${{ steps.refs.outputs.head_sha }}

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref || github.sha }}
          fetch-depth: 0

      - name: Resolve comparison refs
        id: refs
        env:
          REQUESTED_BASE: ${{ inputs.base_ref || github.event.pull_request.base.sha }}
          REQUESTED_HEAD: ${{ inputs.head_ref || github.sha }}
        run: |
          set -euo pipefail

          head_ref="${REQUESTED_HEAD:-HEAD}"
          if [ -n "${REQUESTED_BASE:-}" ]; then
            base_ref="$REQUESTED_BASE"
          else
            base_ref="${head_ref}^"
          fi

          head_sha="$(git rev-parse "${head_ref}^{commit}")"
          base_tip_sha="$(git rev-parse "${base_ref}^{commit}")"
          base_sha="$(git merge-base "$base_tip_sha" "$head_sha")"
          git cat-file -e "${base_tip_sha}^{commit}"
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Comparing $base_sha..$head_sha"

      - name: Validate ownership manifests
        run: python3 tools/model_ci.py validate

      - name: Select affected models
        id: impact
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 tools/model_ci.py impact \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --platform-change-policy all \
            --github-output "$GITHUB_OUTPUT"

      - name: Summarize selection
        env:
          AFFECTED_MODELS: ${{ steps.impact.outputs.affected_models }}
          MODE: ${{ steps.impact.outputs.mode }}
        run: |
          {
            echo "### Model impact"
            echo
            echo "- Mode: \`$MODE\`"
            echo "- Models: \`$AFFECTED_MODELS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  model-proof:
    name: 3 / ${{ matrix.model }} / Isolated proof
    needs: impact
    if: ${{ needs.impact.outputs.has_models == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.impact.outputs.matrix) }}
    uses: ./.github/workflows/model-proof.yml
    with:
      model: ${{ matrix.model }}
      revision: ${{ needs.impact.outputs.head_sha }}
      suite: premerge
    secrets: inherit

  no-model:
    name: 3 / No model changes
    needs: impact
    if: ${{ needs.impact.outputs.has_models == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm no model proof is required
        env:
          IMPACT_MODE: ${{ needs.impact.outputs.mode }}
        run: |
          set -euo pipefail
          test "$IMPACT_MODE" = "none"
          echo "No model-owned or platform inputs changed." >> "$GITHUB_STEP_SUMMARY"

  required:
    # Keep this exact name: main's repository ruleset requires this context.
    name: Premerge CI
    needs:
      - legal
      - impact
      - model-proof
      - no-model
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify every required job
        env:
          LEGAL_RESULT: ${{ needs.legal.result }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          MODEL_RESULT: ${{ needs.model-proof.result }}
          NO_MODEL_RESULT: ${{ needs.no-model.result }}
          HAS_MODELS: ${{ needs.impact.outputs.has_models }}
          EXPECTED_COUNT: ${{ needs.impact.outputs.expected_count }}
          AUTHORIZED: >-
            ${{
              github.event_name == 'workflow_dispatch' ||
              contains(github.event.pull_request.labels.*.name, 'run-ci')
            }}
        run: |
          set -euo pipefail

          if [ "$AUTHORIZED" != "true" ]; then
            echo "::error::Premerge CI is not authorized. Add the run-ci label and keep it applied until the workflow completes."
            exit 1
          fi

          test "$LEGAL_RESULT" = "success" || {
            echo "::error::Legal compliance result: $LEGAL_RESULT"
            exit 1
          }
          test "$IMPACT_RESULT" = "success" || {
            echo "::error::Ownership and impact result: $IMPACT_RESULT"
            exit 1
          }

          case "$HAS_MODELS" in
            true)
              test "${EXPECTED_COUNT:-0}" -gt 0
              test "$MODEL_RESULT" = "success" || {
                echo "::error::One or more isolated model proofs did not pass: $MODEL_RESULT"
                exit 1
              }
              test "$NO_MODEL_RESULT" = "skipped"
              ;;
            false)
              test "${EXPECTED_COUNT:-0}" -eq 0
              test "$MODEL_RESULT" = "skipped"
              test "$NO_MODEL_RESULT" = "success" || {
                echo "::error::No-model result: $NO_MODEL_RESULT"
                exit 1
              }
              ;;
            *)
              echo "::error::Impact job did not emit a valid has_models output"
              exit 1
              ;;
          esac

          echo "All required premerge checks passed." >> "$GITHUB_STEP_SUMMARY"
