name: TensorRT-Model-Connect Premerge CI

run-name: >-
  PR #${{ github.event.pull_request.number || inputs.pr_number }} · private CI dispatch

on:
  pull_request_target:
    branches:
      - main
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to test
        required: true
        type: string

permissions: {}

concurrency:
  group: >-
    trtmc-private-dispatch-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Private CI dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-ci'
    runs-on: ubuntu-24.04
    environment: ci-dispatch
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      # pull_request_target is safe here only because every executable byte
      # comes from the protected base revision. This workflow must never fetch
      # or execute a pull-request head or merge ref.
      - name: Check out the trusted bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA/TensorRT-Model-Connect
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .ci-bridge
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts/private_ci_bridge.py
          sparse-checkout-cone-mode: false

      - name: Resolve and revalidate the exact pull-request snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail
          python3 .ci-bridge/.github/scripts/private_ci_bridge.py resolve \
            --event "$GITHUB_EVENT_PATH" \
            --pr-number "$REQUESTED_PR_NUMBER" \
            --output "$RUNNER_TEMP/private-ci-request.json"

      - name: Mint a source-check token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TRTMC_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRTMC_CI_APP_PRIVATE_KEY }}
          owner: NVIDIA
          repositories: TensorRT-Model-Connect
          permission-checks: write

      - name: Mint an internal-dispatch token
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TRTMC_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRTMC_CI_APP_PRIVATE_KEY }}
          # These target identities are environment secrets because the pinned
          # action logs owner/repository while resolving an installation.
          owner: ${{ secrets.TRTMC_PRIVATE_CI_OWNER }}
          repositories: ${{ secrets.TRTMC_PRIVATE_CI_REPOSITORY }}
          permission-actions: write

      - name: Create the queued check and dispatch private CI
        env:
          CI_DISPATCH_TOKEN: ${{ steps.ci-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_CHECK_TOKEN: ${{ steps.source-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          PRIVATE_CI_OWNER: ${{ secrets.TRTMC_PRIVATE_CI_OWNER }}
          PRIVATE_CI_REPOSITORY: ${{ secrets.TRTMC_PRIVATE_CI_REPOSITORY }}
        run: |
          set -euo pipefail
          arguments=()
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            arguments+=(--consume-label)
          fi
          python3 .ci-bridge/.github/scripts/private_ci_bridge.py dispatch \
            --request "$RUNNER_TEMP/private-ci-request.json" \
            "${arguments[@]}"
