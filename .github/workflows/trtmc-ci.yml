name: TensorRT-Model-Connect Premerge CI

run-name: >-
  ${{ startsWith(inputs.checkout_ref, 'refs/pull/') && format('/trtmc-ci {0}', inputs.checkout_ref) || format('Manual {0}', inputs.checkout_ref || github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to validate. Use refs/pull/<number>/merge for /trtmc-ci PR requests."
        required: false
        default: ""
      base_ref:
        description: "Git ref used as the CI comparison base."
        required: false
        default: "origin/main"

permissions:
  contents: read

concurrency:
  group: trtmc-ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

env:
  TRTMC_CI_BASE_REF: ${{ inputs.base_ref }}
  TRTMC_CI_PREMERGE: ${{ startsWith(inputs.checkout_ref, 'refs/pull/') && 'true' || 'false' }}
  ENGINE_DIR: ${{ vars.TRTMC_ENGINE_DIR || '/workspace/users/yifeif/tensorrt-model-connect/engines' }}
  TRTMC_STORAGE_ROOT: ${{ vars.TRTMC_STORAGE_ROOT || '/workspace/users/yifeif/tensorrt-model-connect' }}
  HF_HOME: ${{ vars.TRTMC_HF_HOME || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache' }}
  HF_HUB_CACHE: ${{ vars.TRTMC_HF_HUB_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/hub' }}
  HUGGINGFACE_HUB_CACHE: ${{ vars.TRTMC_HF_HUB_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/hub' }}
  HF_MODULES_CACHE: ${{ vars.TRTMC_HF_MODULES_CACHE || '/workspace/users/yifeif/tensorrt-model-connect/hf-cache/modules' }}
  TRTMC_CI_IMAGE: ${{ vars.TRTMC_MANYLINUX_CI_IMAGE || 'trtmc-dev-gb300:manylinux_2_39' }}
  TRTMC_CI_CONTAINER_NAME: trtmc-ci-${{ github.run_id }}-${{ github.run_attempt }}
  TRTMC_CONTAINER_OPTIONS: ${{ vars.TRTMC_CONTAINER_OPTIONS || '--gpus all --ipc=host --ulimit memlock=-1 --ulimit stack=67108864' }}
  TRTMC_PACKAGE_PYTHON_TAGS: ${{ vars.TRTMC_PACKAGE_PYTHON_TAGS || 'py312' }}
  TRTMC_PACKAGE_WHEEL_ARCH: ${{ vars.TRTMC_PACKAGE_WHEEL_ARCH || 'manylinux_2_39_aarch64' }}
  PYTHONHASHSEED: "0"
  PYTHON_COVERAGE_MIN_LINE: "38"
  PYTHON_COVERAGE_MIN_BRANCH: "25"
  CPP_COVERAGE_MIN_LINE: "36"
  CPP_COVERAGE_MIN_FUNCTION: "46"
  CPP_COVERAGE_MIN_BRANCH: "21"
  FULL_E2E: "false"
  RUN_COVERAGE_MAP: "false"
  REBUILD_ENGINES: "true"
  DIFFUSION_VLM_ASSESSMENT: "true"
  DIFFUSION_VLM_MODEL_ID: ${{ vars.TRTMC_DIFFUSION_VLM_MODEL_ID || 'Qwen/Qwen2.5-VL-3B-Instruct' }}
  DIFFUSION_VLM_MAX_SIDE: "512"
  DIFFUSION_VLM_MAX_NEW_TOKENS: "384"
  DIFFUSION_VLM_TIMEOUT: "45m"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  premerge-ci:
    name: Premerge CI
    runs-on: ${{ fromJSON(vars.TRTMC_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 720

    defaults:
      run:
        shell: bash

    steps:
      - name: Pre-clean self-hosted workspace
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE" ]; then
            chmod -R a+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true
            docker rm -f "$TRTMC_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
            docker image inspect "$TRTMC_CI_IMAGE" >/dev/null || {
              echo "::error::Docker image '$TRTMC_CI_IMAGE' is not present on the self-hosted runner. Set repository variable TRTMC_MANYLINUX_CI_IMAGE if the runner uses a different local manylinux image tag."
              exit 1
            }
            docker run --rm \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              -w "$GITHUB_WORKSPACE" \
              "$TRTMC_CI_IMAGE" \
              bash -lc '
                set -euo pipefail
                cleanup_workspace() {
                  find . -mindepth 1 -maxdepth 1 ! -name .git -exec chmod -R u+rwX {} + 2>/dev/null || true
                  find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                }
                cleanup_workspace || {
                  echo "::warning::Initial workspace cleanup failed; retrying after canceled-run processes settle"
                  sleep 10
                  cleanup_workspace
                }
              '
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          clean: false
          lfs: false

      - name: Resolve comparison base
        id: base
        run: |
          set -euo pipefail
          base="${TRTMC_CI_BASE_REF:-}"
          if [ -z "$base" ]; then
            base="origin/${GITHUB_REF_NAME:-main}"
          fi

          if [[ "$base" == origin/* ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch origin "${base#origin/}" --quiet || true
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse --verify "origin/${GITHUB_REF_NAME:-main}" >/dev/null 2>&1; then
              base="origin/${GITHUB_REF_NAME:-main}"
            else
              base="HEAD~1"
            fi
          fi

          echo "CI_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Using comparison base: $base"

      - name: Report CI mode
        run: |
          set -euo pipefail
          if [ "${TRTMC_CI_PREMERGE:-false}" = "true" ]; then
            echo "CI mode: /trtmc-ci premerge/selective"
          elif [ "$FULL_E2E" = "true" ]; then
            echo "CI mode: full E2E"
          else
            echo "CI mode: branch/manual unit gates"
          fi

      - name: Start CI container
        timeout-minutes: 5
        run: bash .github/scripts/start-gha-container.sh

      - name: Build trtmc pip package
        timeout-minutes: 30
        run: bash .github/scripts/run-gha-stage.sh package

      - name: Impact analysis
        timeout-minutes: 5
        run: bash .github/scripts/run-gha-stage.sh impact

      - name: Build C++ test executables
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh build

      - name: Check family coverage
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh family-coverage

      - name: Check cyclomatic complexity
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh complexity

      - name: Lint changed files
        timeout-minutes: 5
        run: bash .github/scripts/run-gha-stage.sh lint

      - name: C++ unit tests
        timeout-minutes: 20
        run: bash .github/scripts/run-gha-stage.sh cpp-unit

      - name: Python builder and tools tests
        timeout-minutes: 40
        run: bash .github/scripts/run-gha-stage.sh python-builder

      - name: C++ coverage
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
        timeout-minutes: 40
        run: bash .github/scripts/run-gha-stage.sh cpp-coverage

      - name: Graph-op GPU tests
        timeout-minutes: 20
        run: bash .github/scripts/run-gha-stage.sh graph-ops

      - name: Selective E2E tests
        if: ${{ env.TRTMC_CI_PREMERGE == 'true' && env.FULL_E2E != 'true' }}
        timeout-minutes: 240
        run: bash .github/scripts/run-gha-stage.sh selective-e2e

      - name: Write CI summary
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/generate_ci_summary.py \
            --mode premerge \
            --artifacts-dir e2e_artifacts/artifacts \
            --report-path e2e_artifacts/e2e_report.html \
            --html-artifact-name "trtmc-ci-html-report-${GITHUB_RUN_ID}" \
            --full-artifact-name "trtmc-ci-${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trtmc-ci-html-report-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 1
          path: e2e_artifacts/e2e_report.html

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trtmc-ci-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 1
          path: |
            impact.json
            coverage_map.json
            coverage/
            e2e_artifacts/
            dist/*.whl

      - name: Stop CI container
        if: always()
        run: docker rm -f "$TRTMC_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
