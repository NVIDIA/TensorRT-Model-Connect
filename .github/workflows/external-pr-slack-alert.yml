name: Alert on external pull requests

on:
  pull_request_target:
    types: [opened, reopened]

# This workflow deliberately does not check out or execute pull-request code.
# `pull_request_target` is required so the trusted base workflow can access the
# Slack webhook secret for pull requests opened from forks.
permissions: {}

jobs:
  notify:
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post Slack alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_EXTERNAL_PR_WEBHOOK_URL }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::Missing SLACK_EXTERNAL_PR_WEBHOOK_URL repository secret."
            exit 1
          fi

          payload="$(jq -cn \
            --arg repository "$REPOSITORY" \
            --arg author "$PR_AUTHOR" \
            --arg association "$PR_AUTHOR_ASSOCIATION" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            'def slack_escape:
              gsub("&"; "&amp;") |
              gsub("<"; "&lt;") |
              gsub(">"; "&gt;");
             {text: (":rotating_light: *External pull request opened*\\n" +
              "*Repository:* " + $repository + "\\n" +
              "*PR:* <" + $url + "|#" + $number + " — " + ($title | slack_escape) + ">\\n" +
              "*Author:* " + $author + " (" + $association + ")")}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
