name: Legal Compliance

on:
  workflow_call:
    inputs:
      revision:
        description: "Exact Git revision to validate"
        required: true
        type: string
    outputs:
      tested_sha:
        description: "Immutable commit SHA checked and certified by the legal workflow"
        value: ${{ jobs.legal-compliance.outputs.tested_sha }}
  workflow_dispatch:
    inputs:
      revision:
        description: "Git revision to validate"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: legal-${{ inputs.revision || github.ref }}
  cancel-in-progress: false

jobs:
  legal-compliance:
    name: Legal compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested_sha: ${{ steps.resolve.outputs.tested_sha }}

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable checked-out revision
        id: resolve
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse 'HEAD^{commit}')"
          git cat-file -e "${tested_sha}^{commit}"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "Legal compliance is certifying \`$tested_sha\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check canonical legal documents
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "LICENSE": "d07c0367e2861e7fe70fa1b679f879f4fa2f9138ade4457d44ecf8b2e135bb45",
              "CONTRIBUTING.md": "efc27920357d41bd5fe87108dbf35089b5bed1c90a05cf23577c9e1b52c698eb",
              "NOTICE": "fca31175673a934f79dace4b3cdb40eac41e781e06ffb3ecba99d86dee07484c",
          }
          for path, expected_digest in expected.items():
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(
                      f"{path}: expected SHA-256 {expected_digest}, found {digest}"
                  )
          PY

      - name: Check all tracked source headers
        run: python tools/legal_headers.py --check

      - name: Check repository identity terminology
        run: python tools/check_legacy_project_references.py
