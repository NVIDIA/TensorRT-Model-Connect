# .gitlab-ci.yml — GB300 GPU CI pipeline for tensorrt-model-connect
#
# Fat image (trtmc-dev-gb300:latest) has all Python deps baked in at /opt/venv.
# ENV PATH includes /opt/venv/bin, so python/pip/pytest work without activation.
# ENV vars TRT_LIB_DIR, TRT_INC_DIR, LD_LIBRARY_PATH are pre-set.
#
# Test impact analysis (tools/test_impact.py) drives selective execution:
#   - Only affected E2E models run (based on git diff vs target branch)
#   - Unit test tiers run only when relevant source files change
#   - Safety invariant: unknown files trigger ALL tests (zero false negatives)

stages:
  - analyze
  - build
  - tier1-unit
  - tier2-graph-ops
  - tier3-e2e
  - nightly-e2e
  - nightly-coverage

variables:
  ENGINE_DIR: /workspace/users/yifeif/tensorrt-model-connect/engines
  GIT_STRATEGY: fetch
  PYTHONHASHSEED: "0"
  # Coverage gates: set to current measured levels as floor (measured 2026-03-12).
  # Ratchet up as coverage improves. See website/docs/wiki/ISO-26262-Compliance.md §4.
  #
  # Measured 2026-03-12 (unit tests only, no GPU/TRT tests):
  #   C++:    lines 40.1%, functions 54.3%, branches 23.4%
  #   Python: lines 41.4% (builder unit), branches ~30%
  #
  # Thresholds set 2-5% below measured to avoid false failures from
  # minor fluctuation while still catching real regressions.
  PYTHON_COVERAGE_MIN_LINE: "38"
  PYTHON_COVERAGE_MIN_BRANCH: "25"
  CPP_COVERAGE_MIN_LINE: "36"
  CPP_COVERAGE_MIN_FUNCTION: "46"
  CPP_COVERAGE_MIN_BRANCH: "21"
  AI_STAGING_BRANCH: "ai-staging"
  AI_STAGING_PROMOTE: "0"
  AI_STAGING_PROMOTION_TARGET: "master"

.local-trtmc-image: &local_trtmc_image
  name: trtmc-dev-gb300:latest
  pull_policy: if-not-present

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $AI_STAGING_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  image: trtmc-dev-gb300:latest
  tags: [gpu-gb300]
  interruptible: true
  before_script:
    - python -c "import transformers, sys; print(f'python={sys.executable} transformers={transformers.__version__}'); assert transformers.__version__ == '5.2.0', transformers.__version__"
    - pip install --no-deps -e tensorrt_model_connect/
    - chmod +x ./build/trtmc 2>/dev/null || true

.ai-staging-rules: &ai_staging_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $AI_STAGING_BRANCH'
  - if: '$CI_COMMIT_BRANCH == $AI_STAGING_BRANCH'

.not-ai-staging-promotion-rules: &not_ai_staging_promotion_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
    when: never
  - when: on_success

.not-ai-staging-rules: &not_ai_staging_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $AI_STAGING_BRANCH'
    when: never
  - if: '$CI_COMMIT_BRANCH == $AI_STAGING_BRANCH'
    when: never
  - when: on_success

# ── Analyze: Test Impact Analysis (fast, no GPU) ────────────────────────────

impact-analysis:
  stage: analyze
  rules: *not_ai_staging_rules
  before_script: []
  script:
    - python3 tools/test_impact.py --validate
    # Try to fetch coverage map for per-test selection (non-fatal if unavailable)
    - |
      python3 tools/coverage_map/fetch_latest.py \
        --output coverage_map.json \
        --local-fallback "${COVERAGE_MAP_PATH:-}" \
        || echo "No coverage map available -- using tier-level selection"
    # Run impact analysis with coverage map if available
    - |
      if [ -f coverage_map.json ]; then
        python3 tools/test_impact.py --base ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} --coverage-map coverage_map.json --json > impact.json
      else
        python3 tools/test_impact.py --base ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} --json > impact.json
      fi
    - echo "--- Impact Analysis ---"
    - cat impact.json
    - python3 tools/test_impact.py --base ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} --verbose
  artifacts:
    paths:
      - impact.json
      - coverage_map.json
    expire_in: 1 day
  timeout: 5m

ai-staging-promotion-mr:
  stage: analyze
  image: *local_trtmc_image
  tags: [cpu]
  before_script: []
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
  script:
    - python3 tools/ai_staging.py promote --require-api-token --target-branch "$AI_STAGING_PROMOTION_TARGET"
  timeout: 5m

# ── Build ──────────────────────────────────────────────────────────────────────

build-all:
  stage: build
  rules: *not_ai_staging_rules
  script:
    - |
      cmake -S . -B build -G Ninja \
        -DTRTMC_TRT_INCLUDE_DIR=$TRT_INC_DIR \
        -DTRTMC_TRT_LIBRARY=$TRT_LIB_DIR/libnvinfer.so \
        -DTRTMC_CUDA_INCLUDE_DIR=/usr/local/cuda/include \
        -DTRTMC_CUDART_LIBRARY=/usr/local/cuda/lib64/libcudart.so
    - cmake --build build -j
  artifacts:
    paths:
      - build/
    expire_in: 1 day
  timeout: 15m

ai-staging-build:
  stage: build
  image: *local_trtmc_image
  tags: [cpu]
  rules: *ai_staging_rules
  variables:
    CUDA_VISIBLE_DEVICES: ""
  script:
    - |
      cmake -S . -B build -G Ninja \
        -DTRTMC_TRT_INCLUDE_DIR=$TRT_INC_DIR \
        -DTRTMC_TRT_LIBRARY=$TRT_LIB_DIR/libnvinfer.so \
        -DTRTMC_CUDA_INCLUDE_DIR=/usr/local/cuda/include \
        -DTRTMC_CUDART_LIBRARY=/usr/local/cuda/lib64/libcudart.so
    - cmake --build build -j
  artifacts:
    paths:
      - build/
    expire_in: 1 day
  timeout: 15m

# ── Tier 1: Unit Tests + Static Gates ────────────────────────────────────────
# Unit test jobs skip when their tier is not affected (per impact.json).
# Coverage and static checks always run (cheap, important for tracking).

check-family-coverage:
  stage: tier1-unit
  needs: [build-all]
  rules: *not_ai_staging_rules
  script:
    - python scripts/check_family_coverage.py
  timeout: 15m

check-cyclomatic-complexity:
  stage: tier1-unit
  needs: [build-all]
  rules: *not_ai_staging_rules
  script:
    - lizard --version
    - python tools/check_cyclomatic_complexity.py src --max-ccn ${CCM_MAX_CCN:-10} --top 20
  timeout: 15m

lint-check:
  stage: tier1-unit
  needs: [build-all]
  rules: *not_ai_staging_rules
  script:
    - pip install --quiet ruff clang-format
    # Only lint files changed in this MR (codebase has pre-existing violations)
    - |
      git fetch origin master --quiet || true
      BASE_REF=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/master}
      CHANGED_PY=$(git diff --diff-filter=d --name-only "$BASE_REF"...HEAD -- '*.py' || true)
      if [ -n "$CHANGED_PY" ]; then
        echo "Checking Python lint on changed files:"
        echo "$CHANGED_PY"
        echo "$CHANGED_PY" | xargs ruff check --config ruff.toml
      fi
    - |
      BASE_REF=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/master}
      CHANGED_CPP=$(git diff --diff-filter=d --name-only "$BASE_REF"...HEAD -- '*.cpp' '*.h' || true)
      if [ -n "$CHANGED_CPP" ]; then
        echo "Checking C++ formatting on changed files:"
        echo "$CHANGED_CPP" | xargs clang-format --dry-run --Werror
      fi
  timeout: 5m

ai-staging-lint-check:
  stage: tier1-unit
  image: *local_trtmc_image
  tags: [cpu]
  rules: *ai_staging_rules
  variables:
    CUDA_VISIBLE_DEVICES: ""
  script:
    - pip install --quiet ruff clang-format
    # Only lint files changed in this MR (codebase has pre-existing violations)
    - |
      git fetch origin master --quiet || true
      BASE_REF=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/master}
      CHANGED_PY=$(git diff --diff-filter=d --name-only "$BASE_REF"...HEAD -- '*.py' || true)
      if [ -n "$CHANGED_PY" ]; then
        echo "Checking Python lint on changed files:"
        echo "$CHANGED_PY"
        echo "$CHANGED_PY" | xargs ruff check --config ruff.toml
      fi
    - |
      BASE_REF=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/master}
      CHANGED_CPP=$(git diff --diff-filter=d --name-only "$BASE_REF"...HEAD -- '*.cpp' '*.h' || true)
      if [ -n "$CHANGED_CPP" ]; then
        echo "Checking C++ formatting on changed files:"
        echo "$CHANGED_CPP" | xargs clang-format --dry-run --Werror
      fi
  timeout: 5m

ai-staging-sanity:
  stage: tier1-unit
  needs: [ai-staging-build]
  image: *local_trtmc_image
  tags: [cpu]
  rules: *ai_staging_rules
  variables:
    CUDA_VISIBLE_DEVICES: ""
  script:
    - ./build/trtmc --help >/tmp/trtmc-help.txt
    - |
      GPU_CTEST_REGEX='^(test_c_abi_runtime_regression|test_trt_runtime_lifetime|test_trt_module|test_cuda_buffer|test_cuda_stream|test_cuda_graph|test_device_kv_cache|test_device_tensor|test_kv_cache_new|test_recurrent_state|test_encoder_pipeline|test_vl_pipeline)$'
      ctest --test-dir build --output-on-failure -E "$GPU_CTEST_REGEX"
    - |
      python -m pytest tests/builder/ tests/tools/ \
        -m "not gpu and not trt and not e2e" \
        --ignore=tests/builder/test_cli.py \
        --ignore=tests/builder/test_build_engine_decoders.py \
        --ignore=tests/builder/test_build_engine_enc_dec.py \
        --ignore=tests/builder/test_build_engine_integration.py \
        --ignore=tests/builder/test_build_engine_std_decoders.py \
        --ignore=tests/builder/test_tvm_ffi_plugin.py \
        -v -n auto
  timeout: 40m

test-cpp-unit:
  stage: tier1-unit
  needs: [build-all, impact-analysis]
  rules: *not_ai_staging_rules
  script:
    - |
      if ! python3 -c "import json; d=json.load(open('impact.json')); exit(0 if 'cpp' in d['unit_tiers'] else 1)"; then
        echo "Skipping: cpp tier not affected by this change"
        exit 0
      fi
    - |
      # Check for coverage-map-based selective tests
      CPP_TESTS=$(python3 -c "
      import json, sys
      d = json.load(open('impact.json'))
      tests = d.get('cpp_tests', [])
      fallback = d.get('fallback_tiers', [])
      if 'cpp' in fallback or not tests:
          sys.exit(0)
      print('|'.join(tests))
      " 2>/dev/null) || true
      if [ -n "$CPP_TESTS" ]; then
        echo "Selective C++ tests: $CPP_TESTS"
        ctest --test-dir build -R "$CPP_TESTS" --output-on-failure
      else
        echo "Running all C++ tests (fallback or no coverage map)"
        ctest --test-dir build --output-on-failure
      fi
  timeout: 20m

test-python-builder:
  stage: tier1-unit
  needs: [build-all, impact-analysis]
  rules: *not_ai_staging_rules
  script:
    - python -m pip install --disable-pip-version-check --quiet "pytest-cov>=6.0"
    - mkdir -p coverage
    - |
      if ! python3 -c "import json; d=json.load(open('impact.json')); tiers=d['unit_tiers']; exit(0 if 'builder' in tiers or 'tools' in tiers else 1)"; then
        echo "Skipping: neither builder nor tools tier affected by this change"
        # Produce a minimal Cobertura XML so the GitLab artifact doesn't 404
        echo '<?xml version="1.0" ?><coverage version="7.6" timestamp="0" lines-valid="0" lines-covered="0" line-rate="1.0" branches-valid="0" branches-covered="0" branch-rate="1.0" complexity="0"><packages/></coverage>' > coverage/python-cobertura.xml
        echo "PYTHON_COVERAGE_LINE=100.00%"
        echo "PYTHON_COVERAGE_BRANCH=100.00%"
        echo "Skipped" > coverage/python-coverage.txt
        exit 0
      fi
    - |
      # Check for coverage-map-based selective tests
      BUILDER_TESTS=$(python3 -c "
      import json, sys
      d = json.load(open('impact.json'))
      tests = d.get('builder_tests', [])
      fallback = d.get('fallback_tiers', [])
      if 'builder' in fallback or not tests:
          sys.exit(0)
      print(' or '.join(tests))
      " 2>/dev/null) || true
      # pytest-cov: collects coverage across xdist workers, compatible with -n auto.
      # Source path matches pyproject.toml [tool.coverage.run] source.
      COV_ARGS="--cov=tensorrt_model_connect/tensorrt_model_connect --cov-branch --cov-report=term-missing --cov-report=xml:coverage/python-cobertura.xml"
      if [ -n "$BUILDER_TESTS" ]; then
        echo "Selective builder tests (with coverage): $BUILDER_TESTS"
        python -m pytest tests/builder/ tests/tools/ tests/engine_defs/torch_trt/ -v --ignore=tests/builder/test_cli.py --ignore=tests/engine_defs/torch_trt/test_pixart_vs_hf.py -k "$BUILDER_TESTS" -n auto $COV_ARGS
      else
        echo "Running all builder + tools tests (with coverage)"
        python -m pytest tests/builder/ tests/tools/ tests/engine_defs/torch_trt/ -v --ignore=tests/builder/test_cli.py --ignore=tests/engine_defs/torch_trt/test_pixart_vs_hf.py -n auto $COV_ARGS
      fi
    # Generate text summary from the Cobertura XML (pytest-cov already wrote it)
    - python -m coverage report --show-missing 2>/dev/null | tee coverage/python-coverage.txt || true
    # Enforce coverage gates and emit GitLab-parseable metric lines
    - |
      python3 -c "
      import xml.etree.ElementTree as ET, sys
      root = ET.parse('coverage/python-cobertura.xml').getroot()
      line_pct = float(root.attrib.get('line-rate', '0')) * 100
      branch_pct = float(root.attrib.get('branch-rate', '0')) * 100
      line_min = float('${PYTHON_COVERAGE_MIN_LINE}')
      branch_min = float('${PYTHON_COVERAGE_MIN_BRANCH}')
      print(f'PYTHON_COVERAGE_LINE={line_pct:.2f}%')
      print(f'PYTHON_COVERAGE_BRANCH={branch_pct:.2f}%')
      ok = True
      if line_pct + 1e-9 < line_min:
          print(f'FAIL: Python line coverage {line_pct:.1f}% < {line_min}% gate', file=sys.stderr)
          ok = False
      if branch_pct + 1e-9 < branch_min:
          print(f'FAIL: Python branch coverage {branch_pct:.1f}% < {branch_min}% gate', file=sys.stderr)
          ok = False
      sys.exit(0 if ok else 1)
      "
  coverage: '/PYTHON_COVERAGE_LINE=([0-9]+(?:\.[0-9]+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/python-cobertura.xml
    paths:
      - coverage/python-coverage.txt
      - coverage/python-cobertura.xml
    expire_in: 2 days
  timeout: 40m

coverage-cpp:
  stage: tier1-unit
  needs:
    - job: build-all
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $AI_STAGING_BRANCH'
      when: never
    - if: '$CI_COMMIT_BRANCH == $AI_STAGING_BRANCH'
      when: never
    # Always run in scheduled (nightly) pipelines and manual web triggers.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    # In MR pipelines: only when C++ source or tests change.
    # Skipping on Python-only / config-only MRs removes 173s from the
    # tier1 critical path that gates test-graph-ops and test-e2e-selective.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*.cpp
        - src/**/*.h
        - include/**/*.h
        - tests/cpp/**/*.cpp
        - tests/cpp/**/*.h
        - CMakeLists.txt
  script:
    - python -m pip install --disable-pip-version-check --quiet "gcovr==8.2"
    - bash tools/coverage_ci/run_cpp_coverage.sh
  coverage: '/CPP_COVERAGE_LINE=([0-9]+(?:\.[0-9]+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cpp-cobertura.xml
    paths:
      - coverage/cpp-coverage-summary.txt
      - coverage/cpp-cobertura.xml
    expire_in: 2 days
  timeout: 40m

# ── Tier 2: Graph-Op GPU Tests (~3 min) ──────────────────────────────────────

test-graph-ops:
  stage: tier2-graph-ops
  rules: *not_ai_staging_rules
  # No `needs:` — relies on stage ordering to gate on the full tier1-unit stage.
  # Any tier1 failure (lint, complexity, coverage, unit tests) automatically
  # blocks this job without listing each dependency explicitly.
  script:
    - nvidia-smi
    - python -m pytest tests/builder/test_graph_ops.py tests/builder/test_graph_ops_extended.py tests/builder/test_graph_blocks.py -v -n auto
  timeout: 20m

# ── Tier 3: Selective E2E Tests (impact-driven) ─────────────────────────────
# Replaces the old tier3-smoke + tier4-full-e2e pipeline.
# Runs ONLY the E2E models affected by this MR's changes.
# - Family plugin change: tests only that family's models (~5 min)
# - Shared module change: tests the affected L0 model set
# - Docs/tools-only change: skips entirely (0 min)

test-e2e-selective:
  stage: tier3-e2e
  needs:
    - build-all       # binary artifact
    - impact-analysis # impact.json artifact
    - test-graph-ops  # gates on full tier1+tier2 via stage ordering
  variables:
    # Parallel workers run offline to prevent 429 rate-limit failures from
    # 16 workers simultaneously calling model_info() (is_base_mistral() chain).
    # A selective warm phase (Phase 1 below) runs ONLINE first so that:
    #   a) newly added models not yet in the persistent cache are downloaded, and
    #   b) existing cached models have their SHA refreshed.
    # env -u HF_HUB_OFFLINE unsets this variable for the warm phase only.
    HF_HUB_OFFLINE: "1"
  script:
    - |
      # Build selective model list from impact analysis
      python3 -c "
      import json, sys
      d = json.load(open('impact.json'))
      models = d.get('e2e_models', [])
      with open('e2e_models.txt', 'w') as f:
          for m in models:
              f.write(m + '\n')
      print(f'Selective E2E: {len(models)} models')
      for m in models[:10]:
          print(f'  {m}')
      if len(models) > 10:
          print(f'  ... and {len(models) - 10} more')
      "
      MODEL_COUNT=$(wc -l < e2e_models.txt)
      if [ "$MODEL_COUNT" -eq 0 ]; then
        echo "No E2E models affected by this change -- skipping E2E tests"
        exit 0
      fi
    - |
      echo "=== Phase 1: warming HF cache (online, sequential) ==="
      # Unset HF_HUB_OFFLINE for this step so newly added models (not yet in
      # the persistent cache) are downloaded before the parallel phase.
      env -u HF_HUB_OFFLINE python scripts/warm_hf_cache.py --models-file e2e_models.txt
    - |
      echo "=== Phase 2: parallel rebuild (offline, local cache) ==="
      # HF_HUB_OFFLINE=1 is inherited from the job variable above.
      ./scripts/run_e2e_parallel.sh \
        --engine-dir $ENGINE_DIR \
        --result-dir e2e_artifacts \
        --trtmc-binary ./build/trtmc \
        --workers-per-gpu 4 \
        --models-file e2e_models.txt \
        --rebuild-engines
  after_script:
    - |
      if [ -d e2e_artifacts ]; then
        python scripts/generate_e2e_report.py \
          --artifacts-dir e2e_artifacts/artifacts \
          -o e2e_artifacts/e2e_report.html \
          --project-dir . \
          --title "E2E Report - MR !${CI_MERGE_REQUEST_IID:-manual}" \
          || true
        if [ -f e2e_artifacts/e2e_report.html ] && [ -n "${CI_JOB_URL:-}" ]; then
          echo "HTML report: ${CI_JOB_URL}/artifacts/file/e2e_artifacts/e2e_report.html"
        fi
      fi
  artifacts:
    paths:
      - e2e_artifacts/
    when: always
    expire_in: 2 days
  timeout: 4h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $AI_STAGING_BRANCH'
      when: never
    - if: '$CI_COMMIT_BRANCH == $AI_STAGING_BRANCH'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Nightly: Full E2E Suite (all models, scheduled) ─────────────────────────
# Runs every night on master via GitLab CI schedule. Force-rebuilds all
# bundles and tests every model — the gold-standard regression gate.
# Configure in GitLab: Settings > CI/CD > Pipeline schedules
#   Branch: master, Cron: 0 2 * * * (2 AM daily)

test-e2e-nightly:
  stage: nightly-e2e
  needs: [build-all]
  # Two-phase HF access strategy:
  #   Phase 1 — warm_hf_cache.py runs ONLINE: fetches latest SHAs + downloads
  #             any stale/missing files sequentially (300ms inter-request delay
  #             keeps well below the 10k/5min API quota).
  #   Phase 2 — parallel rebuild runs OFFLINE (HF_HUB_OFFLINE=1): all
  #             from_pretrained() and snapshot_download() calls resolve from
  #             the local cache populated in phase 1, zero network requests.
  script:
    - "echo '=== Nightly Full E2E: all models ==='"
    - nvidia-smi
    - |
      echo "=== Phase 1: warming HF cache (online, sequential) ==="
      python scripts/warm_hf_cache.py --exclude-ci-tier l0_only
    - export HF_HUB_OFFLINE=1
    - |
      echo "=== Phase 2: parallel rebuild (offline, local cache) ==="
      ./scripts/run_e2e_parallel.sh \
        --engine-dir $ENGINE_DIR \
        --result-dir e2e_artifacts \
        --trtmc-binary ./build/trtmc \
        --workers-per-gpu 4 \
        --exclude-ci-tier l0_only \
        --rebuild-engines
  after_script:
    - |
      if [ -d e2e_artifacts ]; then
        python scripts/generate_e2e_report.py \
          --artifacts-dir e2e_artifacts/artifacts \
          -o e2e_artifacts/e2e_report.html \
          --project-dir . \
          --title "Nightly E2E Report - $(date +%Y-%m-%d)" \
          || true
        if [ -f e2e_artifacts/e2e_report.html ] && [ -n "${CI_JOB_URL:-}" ]; then
          echo "HTML report: ${CI_JOB_URL}/artifacts/file/e2e_artifacts/e2e_report.html"
        fi
      fi
  artifacts:
    paths:
      - e2e_artifacts/
    when: always
    expire_in: 7 days
  timeout: 6h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Nightly: Coverage Map Generation ──────────────────────────────────────────
# Generates per-test coverage mapping for selective unit test execution.
# MR pipelines fetch this artifact to skip irrelevant unit tests.

generate-coverage-map:
  stage: nightly-coverage
  needs: [build-all]
  script:
    - python -m pip install --disable-pip-version-check --quiet "coverage[toml]==7.6.10" "pytest-cov>=6.0" "gcovr==8.2"
    - python -m tools.coverage_map.generate --output coverage_map.json --python-bin python --build-dir build
    - python -m tools.coverage_map.generate --validate coverage_map.json
    - echo "Coverage map generated successfully"
    - >-
      python -c "import json; d=json.load(open('coverage_map.json')); m=d['meta'];
      print('Python tests: %s, C++ tests: %s, Source files: %d' % (m['python_tests'], m['cpp_tests'], len(d['source_to_tests'])))"
  artifacts:
    paths:
      - coverage_map.json
    expire_in: 30 days
  timeout: 90m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $AI_STAGING_PROMOTE == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
