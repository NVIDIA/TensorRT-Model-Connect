schema_version: trtmc.qualification/v1
model: roberta-large
candidate:
  family: roberta
  checkpoint: FacebookAI/roberta-large
  revision: 722cf37b1afa9454edce342e7895e588b6ff1d59
  task: encoding
  precision: fp16
  bundle: roberta-large.bundle
  build:
    max_sequence_length: 512

accuracy:
  - name: stsbenchmark-parity
    benchmark: stsbenchmark_embedding_parity
    samples: 50
    reference:
      precision: fp32
    gate:
      min_vector_cosine: 0.999
      min_vector_pass_rate: 1.0
      max_pair_cosine_abs_delta: 0.02

performance:
  - name: encode
    benchmark: encoder_performance
    operation: encode
    request:
      prompt: The capital of France is Paris.
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: embedding-shape
