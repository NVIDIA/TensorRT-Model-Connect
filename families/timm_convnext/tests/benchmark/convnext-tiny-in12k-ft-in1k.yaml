schema_version: trtmc.qualification/v1
model: convnext-tiny-in12k-ft-in1k
candidate:
  family: timm_convnext
  checkpoint: timm/convnext_tiny.in12k_ft_in1k
  revision: aa096f03029c7f0ec052013f64c819b34f8ad790
  task: image_to_class_scores
  precision: fp16
  bundle: convnext-tiny-in12k-ft-in1k.bundle
  build:
    max_sequence_length: 1

accuracy:
  - name: imagenette-parity
    benchmark: imagenette_classification
    samples: 100
    reference:
      precision: fp32
      batch_size: 16
    gate:
      max_top1_accuracy_drop_from_hf: 0.01
      min_top1_agreement: 0.98

performance:
  - name: classify
    benchmark: image_classification_performance
    operation: classify
    request:
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      adapter: timm-classification
      mode: hf-eager
      reference_backend: timm
      precision: fp32
      output_contract: classification-top-class
