schema_version: trtmc.qualification/v1
model: codegen-350m
candidate:
  family: codegen
  checkpoint: Salesforce/codegen-350M-mono
  revision: d9107f71cca463240db1143f4a75a927a27fcb27
  task: text_generation
  precision: fp16
  bundle: codegen-350m.bundle
  build:
    max_sequence_length: 257

accuracy:
  - name: humaneval-continuation
    benchmark: humaneval_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference:
      precision: fp32
    request: &greedy-generation
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
    gate:
      min_pass_rate: 1.0
      allowed_failures: 0

performance:
  - name: generate-20
    benchmark: text_generation_performance
    operation: generate
    request:
      <<: *greedy-generation
      prompt: "def fibonacci(n):"
      max_new_tokens: 20
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: exact-token-ids
