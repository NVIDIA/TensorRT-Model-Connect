schema_version: trtmc.qualification/v1
model: deepseek-v2-tiny
candidate:
  family: deepseek_v2
  checkpoint: katuni4ka/tiny-random-deepseek-v3
  revision: ba144b0d3331a5892aa588d82722d382be2b6e6b
  task: text_generation
  precision: fp16
  bundle: deepseek-v2-tiny.bundle
  build:
    max_sequence_length: 256

accuracy:
  - name: mmlu-continuation
    benchmark: mmlu_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference:
      precision: fp16
      experts_implementation: batched_mm
    request: &greedy-generation
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
    gate:
      min_pass_rate: 0.9
      allowed_failures: 1

performance:
  - name: generate-10
    benchmark: text_generation_performance
    operation: generate
    request:
      <<: *greedy-generation
      prompt: The capital of France is
      max_new_tokens: 10
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp16
      experts_implementation: batched_mm
      output_contract: exact-token-ids
