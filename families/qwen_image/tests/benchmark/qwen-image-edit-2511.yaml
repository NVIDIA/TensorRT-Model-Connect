schema_version: trtmc.qualification/v1
model: qwen-image-edit-2511
candidate: {family: qwen_image, checkpoint: Qwen/Qwen-Image-Edit-2511, revision: 6f3ccc0b56e431dc6a0c2b2039706d7d26f22cb9, task: image_edit, precision: bf16, bundle: qwen-image-edit-2511.bundle, build: {image_height: 1024, image_width: 1024}}
reference_environment: {requirements: ../../requirements.txt}
accuracy:
  - name: generated-media-parity
    benchmark: task_output_parity
    operation: generate_image
    request: &request {prompt: Turn the image into a watercolor illustration while preserving the main subject., image_path: ../data/test_img.jpeg, negative_prompt: ' ', seed: 42, num_steps: 20, cfg_scale: 4.0, height: 1024, width: 1024}
    reference: &reference {adapter: hf-diffusers, mode: hf-eager, precision: bf16, output_contract: media-artifact-parity, adapter_options: {cpu_offload: true, always_negative_prompt: true, guidance_parameter: true_cfg_scale}}
    gate: {min_psnr: 5.0, min_ssim: 0.1}
performance:
  - {name: edit-image, benchmark: media_generation_performance, operation: generate_image, request: *request, measurement: {warmup: 5, iterations: 10}, reference: {<<: *reference, runner: task-reference, reference_backend: hf_diffusers, output_contract: media-shape}}
