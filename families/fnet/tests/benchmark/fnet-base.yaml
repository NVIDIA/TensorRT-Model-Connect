schema_version: trtmc.qualification/v1
model: fnet-base
candidate:
  family: fnet
  checkpoint: google/fnet-base
  revision: d89b6fad3cf5384848b783dc480f9685f49d008c
  task: encoding
  precision: fp16
  bundle: fnet-base.bundle
  build:
    max_sequence_length: 256

accuracy:
  - name: stsbenchmark-parity
    benchmark: stsbenchmark_embedding_parity
    samples: 50
    reference:
      precision: fp32
    gate:
      min_vector_cosine: 0.999
      min_vector_pass_rate: 1.0
      max_pair_cosine_abs_delta: 0.02

performance:
  - name: encode
    benchmark: encoder_performance
    operation: encode
    request:
      prompt: The capital of France is Paris.
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: embedding-shape
