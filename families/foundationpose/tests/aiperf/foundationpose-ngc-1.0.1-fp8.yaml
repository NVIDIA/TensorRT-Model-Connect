# The bundle builds from the NGC ONNX pair (the manifest's external files), which reference/prepare.py stages.
candidate:
  model_directory: trtmc-reference/foundationpose-ngc
reference:
  requirements: families/foundationpose/requirements.txt
  prepare: families/foundationpose/reference/prepare.py
  adapter: families/foundationpose/reference/adapter.py  # ONNX Runtime, as tests/official_reference.py
  precision: fp32
  mode: eager
benchmarks:
  pose_parity:
    suite_definition:
      suite: middlebury-q-pose-crops-30
      version: 1
      source:
        kind: family_inputs
        module: families/foundationpose/reference/inputs.py
      selection: {method: first, count: 30}
    gate: {max_pose_abs_error: 0.004, max_score_abs_error: 0.25}  # the family's E2E fp8 gate
