schema_version: trtmc.qualification/v1
model: flux-schnell
candidate:
  family: flux
  checkpoint: black-forest-labs/FLUX.1-schnell
  revision: 741f7c3ce8b383c54771c7003378a50191e9efe9
  task: image_generation
  precision: fp16
  bundle: flux-schnell.bundle
  build: {image_height: 1024, image_width: 1024}
reference_environment: {requirements: ../../requirements.txt}
accuracy:
  - &case
    name: generated-media-parity
    benchmark: task_output_parity
    operation: generate_image
    request: &request {prompt: A photo of a cat sitting on a windowsill at sunset, seed: 42, num_steps: 4, height: 1024, width: 1024}
    reference: &reference {adapter: hf-diffusers, mode: hf-eager, precision: fp16, output_contract: media-artifact-parity}
    gate: &gate {min_psnr: 5.0, min_ssim: 0.1}
performance:
  - name: generate-image
    benchmark: media_generation_performance
    operation: generate_image
    request: *request
    measurement: {warmup: 5, iterations: 10}
    reference:
      <<: *reference
      runner: task-reference
      reference_backend: hf_diffusers
      output_contract: media-shape
