schema_version: trtmc.qualification/v1
model: flux-2-dev-fp8
candidate:
  family: flux
  checkpoint: black-forest-labs/FLUX.2-dev
  revision: 26afe3a78bb242c0a8bb181dcc8937bb16e5c66c
  task: image_generation
  precision: fp16
  bundle: flux-2-dev-fp8.bundle
  build: {quantization: fp8, image_height: 1024, image_width: 1024}
reference_environment: {requirements: ../../requirements.txt}
accuracy:
  - name: generated-media-parity
    benchmark: task_output_parity
    operation: generate_image
    request: &request {prompt: A photo of a cat sitting on a windowsill at sunset, seed: 42, num_steps: 28, height: 1024, width: 1024}
    reference: &reference {adapter: hf-diffusers, mode: hf-eager, precision: bf16, output_contract: media-artifact-parity}
    gate: {min_psnr: 5.0, min_ssim: 0.1}
performance:
  - name: generate-image
    benchmark: media_generation_performance
    operation: generate_image
    request: *request
    measurement: {warmup: 5, iterations: 10}
    reference:
      <<: *reference
      runner: task-reference
      reference_backend: hf_diffusers
      output_contract: media-shape
