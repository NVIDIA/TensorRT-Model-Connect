schema_version: trtmc.qualification/v1
model: bert-base-uncased
candidate:
  family: bert
  checkpoint: google-bert/bert-base-uncased
  revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  task: encoding
  precision: fp16
  bundle: bert-base-uncased.bundle
  build:
    max_sequence_length: 128

accuracy:
  - name: stsbenchmark-parity
    benchmark: stsbenchmark_embedding_parity
    samples: 50
    reference:
      precision: fp32
    gate:
      min_vector_cosine: 0.999
      min_vector_pass_rate: 1.0
      max_pair_cosine_abs_delta: 0.02

performance:
  - name: encode
    benchmark: encoder_performance
    operation: encode
    request:
      prompt: The capital of France is Paris.
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: embedding-shape
