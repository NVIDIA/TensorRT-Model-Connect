schema_version: trtmc.qualification/v1
model: personaplex-7b
candidate: {family: personaplex, checkpoint: nvidia/personaplex-7b-v1, revision: fdaf4090a61cb315c138a1faee287ffd6c716309, task: speech_to_speech, precision: fp16, bundle: personaplex-7b.bundle, build: {max_sequence_length: 512, fp32_layers: [0, 1]}}
reference_environment:
  requirements: ../../requirements.txt
  paths: {official_repo: trtmc-reference/personaplex}
accuracy:
  - name: generated-audio-parity
    benchmark: task_output_parity
    operation: speak
    request: &request {audio_path: ../data/Recording.wav, max_new_tokens: 300}
    reference: &reference {script: tests/benchmark/reference.py, mode: pytorch-eager, precision: bf16, output_contract: audio-artifact-parity}
    gate: {min_duration_ratio: 0.8, max_duration_ratio: 1.2, min_rms_ratio: 0.5, max_rms_ratio: 2.0, max_log_spectral_distance: 3.0}
performance:
  - {name: speak, benchmark: audio_generation_pipeline_performance, operation: speak, request: *request, measurement: {warmup: 5, iterations: 10}, reference: {<<: *reference, runner: task-reference, reference_backend: torch_reference, output_contract: audio-shape}}
