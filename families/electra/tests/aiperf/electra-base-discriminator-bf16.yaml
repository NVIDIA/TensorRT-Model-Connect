benchmarks:
  # Two BF16 implementations round differently: at most 1% of the 400 sentences (4) may fall outside the
  # encoder-parity tolerance if each stays within twice it (as for roberta-large, camembert-base and fnet-base).
  encoder_parity:
    gate: {outliers: {max_fraction: 0.01, gate: {min_cosine: 0.998, max_relative_l2: 0.04}}}
