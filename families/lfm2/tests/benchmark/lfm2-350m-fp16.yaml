schema_version: trtmc.qualification/v1
model: lfm2-350m-fp16
candidate:
  family: lfm2
  checkpoint: LiquidAI/LFM2-350M
  revision: f37d3f5c8c5484bc01dad379a595cf4c68c4e70e
  task: text_generation
  precision: fp16
  bundle: lfm2-350m-fp16.bundle
  build:
    max_sequence_length: 257

accuracy:
  - name: mmlu-continuation
    benchmark: mmlu_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference:
      precision: bf16
    request: &greedy-generation
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
    gate:
      min_pass_rate: 0.9
      allowed_failures: 1

performance:
  - name: generate-12
    benchmark: text_generation_performance
    operation: generate
    request:
      <<: *greedy-generation
      prompt: The capital of France is
      max_new_tokens: 12
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: bf16
      output_contract: exact-token-ids
