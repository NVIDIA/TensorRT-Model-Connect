schema_version: trtmc.qualification/v1
model: pixart-sigma-1024
candidate:
  family: pixart
  checkpoint: PixArt-alpha/PixArt-Sigma-XL-2-1024-MS
  revision: e102b3591cc82e97071b8b4cb90d834d0c487207
  task: image_generation
  precision: fp16
  bundle: pixart-sigma-1024.bundle
  build: {fp32_layers: [0], image_height: 1024, image_width: 1024}
reference_environment: {requirements: ../../requirements.txt}
accuracy:
  - name: generated-media-parity
    benchmark: task_output_parity
    operation: generate_image
    request: &request {prompt: A photo of a cat sitting on a windowsill at sunset, seed: 42, num_steps: 20, height: 1024, width: 1024}
    reference: &reference
      adapter: hf-diffusers
      mode: hf-eager
      precision: fp16
      output_contract: media-artifact-parity
      adapter_options: {component_precision_contract: pixart_fp16_dit_fp32_t5}
    gate: {min_psnr: 5.0, min_ssim: 0.1}
performance:
  - name: generate-image
    benchmark: media_generation_performance
    operation: generate_image
    request: *request
    measurement: {warmup: 5, iterations: 10}
    reference:
      <<: *reference
      runner: task-reference
      reference_backend: hf_diffusers
      output_contract: media-shape
