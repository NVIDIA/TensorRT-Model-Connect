schema_version: trtmc.qualification/v1
model: timesfm-2.0-500m-official
candidate:
  family: timesfm
  checkpoint: google/timesfm-2.0-500m-pytorch
  revision: dc2443792ce5516872b89b37cf1bc058c3bf0c10
  task: time_series_forecast
  precision: fp32
  bundle: timesfm-2.0-500m-official.bundle

accuracy:
  - name: etth1-parity
    benchmark: etth1_forecast_parity
    samples: 10
    reference:
      command: reference.py
      precision: fp32
    window:
      columns: [OT]
      context_length: 2048
      prediction_length: 128
      stride: 24
      test_target_start: 11520
      test_end: 14400
      frequency: 0
    gate:
      max_relative_l2: 4.0e-3
      max_absolute_error: 7.0e-3

performance:
  - name: forecast-128
    benchmark: time_series_performance
    operation: solve
    request:
      past_values: [0.05, 0.15, 0.3, 0.5, 0.65, 0.8, 0.95, 1.1, 1.18, 1.24, 1.28, 1.31]
      frequency: 2
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      adapter: pytorch-timeseries
      adapter_options: {reference_type: timesfm}
      mode: pytorch-eager
      precision: fp32
      output_contract: forecast-parity
      max_relative_l2: 4.0e-3
      max_absolute_error: 7.0e-3
