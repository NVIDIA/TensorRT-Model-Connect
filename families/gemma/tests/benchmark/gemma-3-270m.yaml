schema_version: trtmc.qualification/v1
model: gemma-3-270m
candidate: &candidate
  family: gemma
  checkpoint: google/gemma-3-270m-it
  revision: ac82b4e820549b854eebf28ce6dedaf9fdfa17b3
  task: text_generation
  precision: bf16
  bundle: gemma-3-270m.bundle
  build:
    max_sequence_length: 257
accuracy: &accuracy
  - name: mmlu-continuation
    benchmark: mmlu_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference: {precision: fp32}
    request: &greedy
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
    gate: {min_pass_rate: 0.9, allowed_failures: 1}
performance: &performance
  - name: generate-10
    benchmark: text_generation_performance
    operation: generate
    request:
      <<: *greedy
      prompt: What is the capital of France? Answer with just the name.
      max_new_tokens: 10
      use_chat_template: true
    measurement: {warmup: 5, iterations: 10}
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: exact-token-ids
