schema_version: trtmc.qualification/v1
model: internvl3-2b
candidate:
  family: internvl
  checkpoint: OpenGVLab/InternVL3-2B-hf
  revision: cb57a075cb75a2e6d1b668b128d48bb00ae321d2
  task: vision_language_generation
  precision: fp16
  bundle: internvl3-2b-vl.bundle
  build:
    max_sequence_length: 384

reference_environment:
  requirements: ../../requirements.txt

accuracy:
  - name: imagenette-vlm-parity
    benchmark: imagenette_vision_language_parity
    samples: 10
    request: &vlm-request
      prompt: What is the main object in this image? Answer in one word.
      max_new_tokens: 10
      temperature: 1.0
      top_k: 1
    reference:
      command: reference.py
      precision: fp32
    gate:
      max_normalized_edit_distance: 0.15
      min_sample_pass_rate: 0.9

performance:
  - name: generate
    benchmark: vision_language_performance
    operation: generate
    request:
      <<: *vlm-request
      image_path: ../data/test_img.jpeg
      prompt: What color is the vehicle in this image? Answer in one word.
    measurement:
      warmup: 3
      iterations: 10
    reference:
      runner: task-reference
      script: tests/benchmark/reference.py
      mode: pytorch-eager
      reference_backend: transformers
      precision: fp32
      output_contract: vision-language-text
      max_normalized_edit_distance: 0.15
