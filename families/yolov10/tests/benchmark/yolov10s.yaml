schema_version: trtmc.qualification/v1
model: yolov10s
candidate:
  family: yolov10
  checkpoint: jameslahm/yolov10s
  revision: 9096a248f4ab5dd21b3d9e9fa0295534db1b87ff
  task: object_detection
  precision: fp16
  bundle: yolov10s.bundle
  build:
    max_sequence_length: 1

reference_environment:
  requirements: ../../requirements.txt

accuracy:
  - name: imagenette-detection-parity
    benchmark: imagenette_detection_parity
    samples: 10
    request: &detection-request
      score_threshold: 0.25
    reference:
      command: reference.py
      precision: fp32
    gate:
      min_box_iou: 0.9
      max_score_abs_error: 0.005
      min_detection_match_rate: 1.0
      min_sample_pass_rate: 0.9

performance:
  - name: detect
    benchmark: object_detection_performance
    operation: detect
    request:
      <<: *detection-request
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      script: tests/benchmark/reference.py
      mode: pytorch-eager
      reference_backend: ultralytics
      precision: fp32
      output_contract: detection-parity
      min_box_iou: 0.9
      max_score_abs_error: 0.005
