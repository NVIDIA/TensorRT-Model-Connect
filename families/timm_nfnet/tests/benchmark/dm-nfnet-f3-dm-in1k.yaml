schema_version: trtmc.qualification/v1
model: dm-nfnet-f3-dm-in1k
candidate:
  family: timm_nfnet
  checkpoint: timm/dm_nfnet_f3.dm_in1k
  revision: ca2451bf0778ae0665a2f13d1b2a7fb878c9ff27
  task: classification
  precision: fp16
  bundle: dm-nfnet-f3-dm-in1k.bundle
  build:
    max_sequence_length: 1

accuracy:
  - name: imagenette-parity
    benchmark: imagenette_classification
    samples: 100
    reference:
      precision: fp32
      batch_size: 16
    gate:
      max_top1_accuracy_drop_from_hf: 0.01
      min_top1_agreement: 0.98

performance:
  - name: classify
    benchmark: image_classification_performance
    operation: classify
    request:
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      adapter: timm-classification
      mode: hf-eager
      reference_backend: timm
      precision: fp32
      output_contract: classification-top-class
