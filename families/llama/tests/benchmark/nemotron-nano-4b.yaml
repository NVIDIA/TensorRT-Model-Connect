schema_version: trtmc.qualification/v1
model: nemotron-nano-4b
candidate:
  family: llama
  checkpoint: nvidia/Llama-3.1-Nemotron-Nano-4B-v1.1
  revision: d552708a9d575fa8d4a690b988fd870d65279f98
  task: text_generation
  precision: fp16
  bundle: nemotron-nano-4b.bundle
  build:
    max_sequence_length: 257

accuracy:
  - name: mmlu-continuation
    benchmark: mmlu_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference:
      precision: fp32
    request: &greedy-generation
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
    gate:
      min_pass_rate: 0.9
      allowed_failures: 1

performance:
  - name: generate-20
    benchmark: text_generation_performance
    operation: generate
    request:
      <<: *greedy-generation
      prompt: What is the capital of France?
      max_new_tokens: 20
      use_chat_template: true
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: exact-token-ids
