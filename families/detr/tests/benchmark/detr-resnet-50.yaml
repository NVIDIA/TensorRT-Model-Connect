schema_version: trtmc.qualification/v1
model: detr-resnet-50
candidate:
  family: detr
  checkpoint: facebook/detr-resnet-50
  revision: 1d5f47bd3bdd2c4bbfa585418ffe6da5028b4c0b
  task: object_detection
  precision: fp16
  bundle: detr-resnet-50.bundle
  build:
    max_sequence_length: 1
    image_height: 796
    image_width: 1333

reference_environment:
  requirements: ../../requirements.txt

# DETR currently has no pixel_mask engine input, so a fixed-shape engine cannot
# run arbitrary-aspect COCO samples correctly. Restore COCO accuracy
# qualification when masked padding is supported.
accuracy: []

performance:
  - name: detect
    benchmark: object_detection_performance
    operation: detect
    request:
      score_threshold: 0.5
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      script: tests/benchmark/reference.py
      mode: hf-eager
      reference_backend: hf_transformers
      precision: fp32
      output_contract: detection-parity
      min_box_iou: 0.5
      max_score_abs_error: 0.05
