schema_version: trtmc.qualification/v1
model: detr-resnet-50
candidate:
  family: detr
  checkpoint: facebook/detr-resnet-50
  revision: 1d5f47bd3bdd2c4bbfa585418ffe6da5028b4c0b
  task: object_detection
  precision: fp16
  bundle: detr-resnet-50.bundle
  build:
    max_sequence_length: 1
    image_height: 1333
    image_width: 1333

reference_environment:
  requirements: ../../requirements.txt

accuracy:
  - name: imagenette-detection-parity
    benchmark: imagenette_detection_parity
    samples: 10
    request: &detection-request
      score_threshold: 0.5
    reference:
      command: reference.py
      precision: fp32
    gate:
      min_box_iou: 0.5
      max_score_abs_error: 0.05
      min_detection_match_rate: 1.0
      min_sample_pass_rate: 0.9

performance:
  - name: detect
    benchmark: object_detection_performance
    operation: detect
    request:
      <<: *detection-request
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      adapter: hf-transformers-vision
      mode: hf-eager
      reference_backend: hf_transformers
      precision: fp32
      output_contract: detection-parity
      min_box_iou: 0.5
      max_score_abs_error: 0.05
