schema_version: trtmc.qualification/v1
model: deformable-detr-r50
candidate:
  family: deformable_detr
  checkpoint: PekingU/rtdetr_v2_r18vd
  revision: 5650961749fa93567c0d46fc7f43ea4f9e914107
  task: object_detection
  precision: fp16
  bundle: deformable-detr-r50.bundle
  build:
    image_height: 640
    image_width: 640
reference_environment:
  requirements: ../../requirements.txt
accuracy:
  - name: coco2017-object-detection
    benchmark: coco2017_object_detection
    samples: 100
    label_space: coco-category-id
    request: &detection-request
      score_threshold: 0.3
    reference:
      command: reference.py
      precision: fp32
    gate:
      max_map_50_95_drop: 0.02
      max_map_50_drop: 0.02
performance:
  - name: detect
    benchmark: object_detection_performance
    operation: detect
    request:
      <<: *detection-request
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      script: tests/benchmark/reference.py
      mode: hf-eager
      reference_backend: hf_transformers
      precision: fp32
      output_contract: detection-parity
      min_box_iou: 0.5
      max_score_abs_error: 0.05
