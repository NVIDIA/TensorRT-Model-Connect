reference:
  adapter: families/dinov2/reference/adapter.py  # token and pooled features (the generic adapter returns one)

absolute: [coco_feature_parity]
benchmarks:
  coco_feature_parity:
    suite: coco-feature-parity
    metric: family_parity
    gate:
      checker: families.dinov2.validation:compare
      precision: fp16  # the build precision's E2E feature tolerance, against the FP32 native features
      # One of the 50 images may miss the criteria from rounding, if it stays within twice the tolerance.
      outliers: {max_fraction: 0.02, gate: {threshold_scale: 2.0}}
    suite_definition:
      suite: coco-feature-parity
      version: 1
      # COCO val2017, pinned public export; conversion parity has no class labels.
      # Image rights follow each original image's license: https://cocodataset.org/#termsofuse
      source:
        kind: hf_dataset
        dataset: detection-datasets/coco
        split: val
        revision: cf0b22332314a937e9dc8a1957b21725430bb41d
        data_files: {val: data/val-*.parquet}
        image_column: image
      selection: {method: seeded, count: 50}
      fields: {image: image_path}
