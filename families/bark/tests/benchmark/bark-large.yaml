schema_version: trtmc.qualification/v1
model: bark-large
candidate: {family: bark, checkpoint: suno/bark, revision: 70a8a7d34168586dc5d028fa9666aceade177992, task: audio_generation, precision: fp32, bundle: bark-large.bundle, build: {max_sequence_length: 1024}}
reference_environment: {requirements: ../../requirements.txt}
accuracy:
  - name: generated-audio-parity
    benchmark: task_output_parity
    operation: generate_audio
    request: &request {prompt: "Hello, this is a test of the text to speech system.", max_new_tokens: 768, seed: 42}
    reference: &reference {adapter: hf-transformers-tts, mode: hf-eager, precision: fp32, output_contract: audio-artifact-parity}
    gate: {min_duration_ratio: 0.8, max_duration_ratio: 1.2, min_rms_ratio: 0.5, max_rms_ratio: 2.0, max_log_spectral_distance: 3.0}
performance:
  - {name: generate-audio, benchmark: audio_generation_model_performance, operation: generate_audio, request: *request, measurement: {warmup: 5, iterations: 10}, reference: {<<: *reference, runner: task-reference, reference_backend: hf_transformers, output_contract: audio-shape}}
