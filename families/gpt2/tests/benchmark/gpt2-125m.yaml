# Opts this model into internal Accuracy and Performance qualification.
schema_version: trtmc.qualification/v1
model: gpt2-125m
candidate:
  family: gpt2
  checkpoint: openai-community/gpt2
  revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  task: text_generation
  precision: fp32
  bundle: gpt2-125m.bundle
  build:
    max_sequence_length: 1024

accuracy:
  - name: mmlu-continuation
    benchmark: mmlu_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference:
      precision: fp32
    request:
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
    gate:
      min_pass_rate: 0.9
      allowed_failures: 1

performance:
  - name: generate-64
    benchmark: text_generation_performance
    operation: generate
    request:
      prompt: The capital of France is
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      seed: -1
      repetition_penalty: 1.0
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: exact-token-ids
