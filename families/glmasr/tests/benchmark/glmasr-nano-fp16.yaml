schema_version: trtmc.qualification/v1
model: glmasr-nano-fp16
candidate:
  family: glmasr
  checkpoint: zai-org/GLM-ASR-Nano-2512
  revision: 61ba4e0b3309b6656edea3e93e419f7bd5c61957
  task: transcription
  precision: fp16
  bundle: glmasr-nano-fp16.bundle
  build:
    max_sequence_length: 384

reference_environment:
  requirements: ../../requirements.txt

accuracy:
  - name: librispeech-wer
    benchmark: librispeech_transcription
    samples: 10
    request: &request
      max_new_tokens: 72
    reference:
      command: reference.py
      precision: fp32
    gate:
      max_wer_to_reference: 0.1
      max_wer_increase_from_reference: 0.02

performance:
  - name: transcribe
    benchmark: speech_transformer_performance
    operation: transcribe
    request:
      <<: *request
      audio_path: ../data/librispeech-test-clean-6930-75918-0003.wav
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      script: tests/benchmark/reference.py
      mode: hf-eager
      reference_backend: hf_transformers
      precision: fp32
      output_contract: transcription-text
