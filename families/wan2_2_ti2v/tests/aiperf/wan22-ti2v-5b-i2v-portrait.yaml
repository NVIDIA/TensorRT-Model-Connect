reference:
  requirements: families/wan2_2_ti2v/requirements.txt
  build_isolation: false  # flash-attn builds against the installed torch where no wheel matches
  adapter: families/wan2_2_ti2v/reference/adapter.py  # Diffusers WanImageToVideoPipeline (no generic image-to-video)
  model: Wan-AI/Wan2.2-TI2V-5B-Diffusers  # the Diffusers export of the same weights
  revision: b8fff7315c768468a5333511427288870b2e9635

# The catalog request leaves the negative prompt empty: TRTMC's Wan 2.2 runtime then uses the official one
# (families/wan2_2_ti2v/model_config.py), Diffusers encodes "". The official one is stated for both sides.
request:
  negative_prompt: >-
    色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
