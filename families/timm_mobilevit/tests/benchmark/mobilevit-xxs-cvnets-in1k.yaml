schema_version: trtmc.qualification/v1
model: mobilevit-xxs-cvnets-in1k
candidate:
  family: timm_mobilevit
  checkpoint: timm/mobilevit_xxs.cvnets_in1k
  revision: 2c62d71504c6fbba9bb322f728586c4a235e5fa4
  task: classification
  precision: fp16
  bundle: mobilevit-xxs-cvnets-in1k.bundle
  build:
    max_sequence_length: 1

accuracy:
  - name: imagenette-parity
    benchmark: imagenette_classification
    samples: 100
    reference:
      precision: fp32
      batch_size: 16
    gate:
      max_top1_accuracy_drop_from_hf: 0.01
      min_top1_agreement: 0.98

performance:
  - name: classify
    benchmark: image_classification_performance
    operation: classify
    request:
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      adapter: timm-classification
      mode: hf-eager
      reference_backend: timm
      precision: fp32
      output_contract: classification-top-class
