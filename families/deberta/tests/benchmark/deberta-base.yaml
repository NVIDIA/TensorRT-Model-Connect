schema_version: trtmc.qualification/v1
model: deberta-base
candidate:
  family: deberta
  checkpoint: microsoft/deberta-base
  revision: 0d1b43ccf21b5acd9f4e5f7b077fa698f05cf195
  task: encoding
  precision: fp16
  bundle: deberta-base.bundle
  build:
    max_sequence_length: 256

accuracy:
  - name: stsbenchmark-parity
    benchmark: stsbenchmark_embedding_parity
    samples: 50
    reference:
      precision: fp32
    gate:
      min_vector_cosine: 0.999
      min_vector_pass_rate: 1.0
      max_pair_cosine_abs_delta: 0.02

performance:
  - name: encode
    benchmark: encoder_performance
    operation: encode
    request:
      prompt: The capital of France is Paris.
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: embedding-shape
