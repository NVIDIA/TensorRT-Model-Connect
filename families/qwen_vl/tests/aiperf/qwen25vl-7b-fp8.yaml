reference:
  mode: eager  # torch.compile: generation recompiles past Dynamo's limit

# The catalog bundle's KV cache holds an OCRBench prompt but not the prompt plus its 128-token answer; a full cache
# slides and drops the image, and the answer degenerates into repetition. Reserve up to 256 image tokens (the
# 200704-pixel budget in 28-pixel merged patches), 21 chat-template tokens (the default system turn included), and
# 128 generated tokens.
candidate:
  build: {name: qwen25vl-7b-fp8-benchmark}
  benchmark_sequence_length: {extra_tokens: 405}
