schema_version: trtmc.qualification/v1
model: olmo2-1b
candidate:
  family: olmo2
  checkpoint: allenai/OLMo-2-0425-1B
  revision: a1847dff35000b4271fa70afc5db10fd29fedbdf
  task: text_generation
  precision: fp32
  bundle: olmo2-1b.bundle
  build:
    max_sequence_length: 352

accuracy:
  - name: mmlu-continuation
    benchmark: mmlu_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference:
      precision: fp32
    request: &greedy-generation
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
    gate:
      min_pass_rate: 0.9
      allowed_failures: 1

performance:
  - name: generate-8
    benchmark: text_generation_performance
    operation: generate
    request:
      <<: *greedy-generation
      prompt: |-
        The following are multiple choice questions (with answers) about abstract algebra.

        Find all c in Z_3 such that Z_3[x]/(x^2 + c) is a field.
        A. 0
        B. 1
        C. 2
        D. 3
        Answer: B

        Statement 1 | If aH is an element of a factor group, then |aH| divides |a|. Statement 2 | If H and K are subgroups of G then HK is a subgroup of G.
        A. True, True
        B. False, False
        C. True, False
        D. False, True
        Answer: B

        Statement 1 | Every element of a group generates a cyclic subgroup of the group. Statement 2 | The symmetric group S_10 has 10 elements.
        A. True, True
        B. False, False
        C. True, False
        D. False, True
        Answer: C

        Statement 1| Every function from a finite set onto itself must be one to one. Statement 2 | Every subgroup of an abelian group is abelian.
        A. True, True
        B. False, False
        C. True, False
        D. False, True
        Answer: A

        Find the characteristic of the ring 2Z.
        A. 0
        B. 3
        C. 12
        D. 30
        Answer: A

        Find the degree for the given field extension Q(sqrt(2), sqrt(3), sqrt(18)) over Q.
        A. 0
        B. 4
        C. 2
        D. 6
        Answer:
      max_new_tokens: 8
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: exact-token-ids
