schema_version: trtmc.qualification/v1
model: swin-tiny-patch4-window7-224-ms-in1k
candidate:
  family: timm_swin
  checkpoint: timm/swin_tiny_patch4_window7_224.ms_in1k
  revision: 4cc3a7275b50b53a7bec45f32c236ebe64227cff
  task: image_to_class_scores
  precision: fp16
  bundle: swin-tiny-patch4-window7-224-ms-in1k.bundle
  build:
    max_sequence_length: 1

accuracy:
  - name: imagenette-parity
    benchmark: imagenette_classification
    samples: 100
    reference:
      precision: fp32
      batch_size: 16
    gate:
      max_top1_accuracy_drop_from_hf: 0.01
      min_top1_agreement: 0.98

performance:
  - name: classify
    benchmark: image_classification_performance
    operation: classify
    request:
      image_path: ../data/test_img.jpeg
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: task-reference
      adapter: timm-classification
      mode: hf-eager
      reference_backend: timm
      precision: fp32
      output_contract: classification-top-class
