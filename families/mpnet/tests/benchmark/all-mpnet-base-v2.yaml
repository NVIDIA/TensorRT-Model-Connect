schema_version: trtmc.qualification/v1
model: all-mpnet-base-v2
candidate:
  family: mpnet
  checkpoint: sentence-transformers/all-mpnet-base-v2
  revision: e8c3b32edf5434bc2275fc9bab85f82640a19130
  task: encoding
  precision: fp16
  bundle: all-mpnet-base-v2.bundle
  build:
    max_sequence_length: 384

accuracy:
  - name: stsbenchmark-parity
    benchmark: stsbenchmark_embedding_parity
    samples: 50
    reference:
      precision: fp32
    gate:
      min_vector_cosine: 0.999
      min_vector_pass_rate: 1.0
      max_pair_cosine_abs_delta: 0.02

performance:
  - name: encode
    benchmark: encoder_performance
    operation: encode
    request:
      prompt: The capital of France is Paris.
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: fp32
      output_contract: embedding-shape
