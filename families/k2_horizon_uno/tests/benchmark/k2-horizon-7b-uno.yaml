schema_version: trtmc.qualification/v1
model: k2-horizon-7b-uno
candidate:
  family: k2_horizon_uno
  checkpoint: IFM/K2-Horizon-7B-Uno
  revision: ec92bbd768f4a404319625204544782e3377bcd7
  task: text_generation
  precision: bf16
  trust_remote_code: true
  bundle: k2-horizon-7b-uno.bundle
  build:
    max_sequence_length: 257

reference_environment:
  requirements: ../../requirements.txt

accuracy:
  - name: mmlu-continuation
    benchmark: mmlu_continuation
    samples: 10
    prompt_token_limit: 192
    truncation_side: left
    reference:
      model: IFM/K2-Horizon-7B
      revision: 586b03f0fd1fbbf2f13eeafc33749e95ae34dd10
      trust_remote_code: true
      precision: bf16
    request: &speculative-generation
      max_new_tokens: 64
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      repetition_penalty: 1.0
      use_chat_template: false
      enable_thinking: false
      do_sample: false
      generation_mode: linear_spec_lora
      block_length: 8
    gate:
      min_pass_rate: 0.9
      allowed_failures: 1

performance:
  - name: generate-26
    benchmark: text_generation_performance
    operation: generate
    request:
      <<: *speculative-generation
      prompt: Reply with the word OK.
      max_new_tokens: 26
      use_chat_template: true
      enable_thinking: true
    measurement:
      warmup: 5
      iterations: 10
    reference:
      runner: hf-transformers
      model: IFM/K2-Horizon-7B
      revision: 586b03f0fd1fbbf2f13eeafc33749e95ae34dd10
      mode: torch-compile
      fallback: hf-eager
      compile_scope: model.forward
      precision: bf16
      output_contract: exact-token-ids
