id = "text_generation"
runtime_library = "libtrtmc_model_text_generation.so"
runtime_plugins = ["plugin.cpp|register_decoder_plugin"]
runtime_strategies = ["decoder_kv_cache", "decoder_moe", "nemotron_labs_diffusion"]
default_runtime_strategy = "decoder_kv_cache"
[validation_profiles]
decoder_debug = ["decoder_kv_cache", "decoder_moe"]

runtime_tests = [
  "test_plugin_helpers|test_plugin_helpers.cpp|_|plugin_helpers.cpp|_",
  "test_text_generation_chat_template|test_text_generation_chat_template.cpp|trtmc_model_text_generation|_|_",
  "test_text_generation_pipeline|test_text_generation_pipeline.cpp|trtmc_model_text_generation,trtmc_backend_trt|_|REQUIRES_TRT",
]
