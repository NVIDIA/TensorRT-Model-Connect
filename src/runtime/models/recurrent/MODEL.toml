id = "recurrent"
runtime_library = "libtrtmc_model_recurrent.so"
runtime_plugins = [
  "ssm_plugin.cpp|register_ssm_plugin",
  "rwkv_plugin.cpp|register_rwkv_plugin",
  "hybrid_plugin.cpp|register_hybrid_plugin",
]
runtime_strategies = ["ssm_recurrent", "rwkv_recurrent", "hybrid_mamba_attention"]
[validation_profiles]
decoder_debug = ["ssm_recurrent", "rwkv_recurrent", "hybrid_mamba_attention"]

runtime_tests = [
  "test_recurrent_output_initializers|test_recurrent_output_initializers.cpp|_|_|_",
  "test_recurrent_pipeline|test_recurrent_pipeline.cpp|trtmc_model_recurrent,trtmc_backend_trt|_|REQUIRES_TRT",
]
