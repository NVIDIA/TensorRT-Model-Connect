id = "lfm2"
runtime_library = "libtrtmc_model_lfm2.so"
runtime_plugins = ["plugin.cpp|register_lfm2_plugin"]
runtime_strategies = ["lfm2_hybrid_conv_attention"]
runtime_tests = [
  "test_lfm2_byte_level_decoder|test_lfm2_byte_level_decoder.cpp|trtmc_model_lfm2|_|_",
  "test_lfm2_chat_template|test_lfm2_chat_template.cpp|trtmc_model_lfm2|_|_",
  "test_lfm2_pretokenizer|test_lfm2_pretokenizer.cpp|trtmc_model_lfm2|_|_",
  "test_lfm2_sampler|test_lfm2_sampler.cpp|trtmc_model_lfm2|_|_",
  "test_lfm2_runtime|test_lfm2_runtime.cpp|trtmc_model_lfm2|_|REQUIRES_GPU",
]

[validation_profiles]
decoder_debug = ["lfm2_hybrid_conv_attention"]
