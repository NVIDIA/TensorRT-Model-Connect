schema_version: trtmc.model-check-environment/v1
id: l4t-thor

storage:
  root: ${TRTMC_CHECK_STORAGE_ROOT}
  results_root: ${TRTMC_CHECK_STORAGE_ROOT}/results

tasks:
  accuracy:
    runner_python: ${TRTMC_CHECK_PYTHON}
    options:
      dataset-root: ${TRTMC_CHECK_DATASET_ROOT}
      engine-dir: ${TRTMC_CHECK_STORAGE_ROOT}/engines/accuracy
      reference-cache-dir: ${TRTMC_CHECK_STORAGE_ROOT}/references/accuracy
      trtmc-binary: ${TRTMC_CHECK_RUNTIME_ROOT}/trtmc
      benchmark-binary: ${TRTMC_CHECK_RUNTIME_ROOT}/trtmc_dataset_benchmark
      hf-python: ${TRTMC_CHECK_PYTHON}
      backend-dir: ${TRTMC_CHECK_RUNTIME_ROOT}
      model-plugin-dir: ${TRTMC_CHECK_RUNTIME_ROOT}/models
      cuda-visible-devices: "0"
      local-files-only: true
      engine-retention: delete_always
      hf-cache-mode: shared
      hf-cache-retention: retain
      model-attempts: 2
      model-retry-delay-seconds: 30
      on-model-failure: continue
  perf:
    runner_python: ${TRTMC_CHECK_PYTHON}
    suite: benchmarks/performance/release.yaml
    environment: benchmarks/performance/environments/l4t-thor.yaml
