id = "sam"
plugin = "sam"
test_manifests = [
  "manifests/sam-vit-base-tp4.json",
  "manifests/sam-vit-base.json",
]

[e2e_defaults.prompted_segmentation]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
input_fields = [
  { input = "image", manifest = "test_image" },
  { input = "point_x", manifest = "point_x" },
  { input = "point_y", manifest = "point_y" },
  { input = "num_expected_masks", manifest = "num_expected_masks" },
]
preflight_asset_fields = ["test_image"]
