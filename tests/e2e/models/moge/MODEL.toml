id = "moge"
plugin = "moge"
test_manifests = ["manifests/moge-2-vitl.json"]

[model_reference_cache]
repository = "https://github.com/microsoft/MoGe.git"
revision = "74fbce054ebed49800de42d0ad0e83495065719a"
relative_path = "moge/reference/MoGe-74fbce054ebe"
entrypoint = "moge/model/v2.py"
environment_variable = "TRTMC_MOGE_SOURCE_DIR"

[e2e_defaults.monocular_geometry]
reference_backend = "moge_torch"
oracle_level = "L1_external_reference"
stages = [{ name = "full_inference", required = true }]
input_fields = [
  { input = "image", manifest = "test_image" },
  { input = "num_tokens", manifest = "num_tokens" },
]
preflight_asset_fields = ["test_image"]
preflight_requirements = [
  { kind = "python_module_available", args = { module = "torch", phase = "reference" }, gating = true },
  { kind = "python_module_available", args = { module = "PIL", phase = "reference" }, gating = true },
  { kind = "python_module_available", args = { module = "numpy", phase = "reference" }, gating = true },
]
