id = "whisper"
test_manifests = [
  "manifests/whisper-large-v3-turbo-tp4.json",
  "manifests/whisper-large-v3-turbo.json",
  "manifests/whisper-tiny-fp16-tp2.json",
  "manifests/whisper-tiny-fp16.json",
]

[e2e_defaults.speech_to_text]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_generation", required = true },
]
input_fields = [
  { input = "audio", manifest = "test_input_audio" },
]
preflight_asset_fields = ["test_input_audio"]
