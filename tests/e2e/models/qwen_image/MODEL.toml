id = "qwen_image"
plugin = "qwen_image"
test_manifests = [
  "manifests/qwen-image-2512.json",
  "manifests/qwen-image-edit-2511.json",
  "manifests/qwen-image.json",
]

[e2e_defaults.diffusion_media_generation]
reference_backend = "hf_diffusers"
oracle_level = "L1_external_reference"
stages = [
  { name = "vae_decode", required = false },
  { name = "end_to_end", required = true },
]
input_fields = [
  { input = "image", manifest = "test_image" },
  { input = "image_height", manifest = "image_height" },
  { input = "image_width", manifest = "image_width" },
  { input = "video_num_frames", manifest = "video_num_frames" },
  { input = "video_height", manifest = "video_height", default = 480, required_manifest = "video_num_frames" },
  { input = "video_width", manifest = "video_width", default = 832, required_manifest = "video_num_frames" },
  { input = "negative_prompt", manifest = "negative_prompt" },
  { input = "cfg_scale", manifest = "cfg_scale" },
  { input = "height", manifest = "height" },
  { input = "width", manifest = "width" },
  { input = "num_inference_steps", manifest = "num_inference_steps", default = 30, required_manifest = "video_num_frames" },
]
preflight_asset_fields = ["test_image"]
preflight_requirements = [
  { kind = "python_module_available", args = { module = "diffusers", phase = "build" }, gating = true },
  { kind = "python_module_available", args = { module = "ftfy", phase = "build" }, gating = true },
]
build_cli_args = [
  { flag = "--image-height", input = "image_height" },
  { flag = "--image-width", input = "image_width" },
  { flag = "--video-height", input = "video_height" },
  { flag = "--video-width", input = "video_width" },
  { flag = "--video-num-frames", input = "video_num_frames" },
  { flag = "--num-inference-steps", input = "num_inference_steps" },
]
