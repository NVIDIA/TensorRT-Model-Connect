id = "openfold3"
plugin = "openfold3"
test_manifests = ["manifests/openfold3-ubiquitin-fp16-l0.json"]

[model_artifact_cache]
relative_path = "openfold3/openbind-v0.5.0-ubiquitin"
environment_variable = "TRTMC_OPENFOLD3_MODEL_DIR"
files = [
  { path = "of3-ob-2025-06-30-174k.pt", url = "https://openfold3-data.s3.amazonaws.com/openfold3-parameters/of3-ob-2025-06-30-174k.pt", sha256 = "bd43301c011d5f87580d3e8b548658869433e4488399feb03035ba248f8e29e4", size = 2287872989 },
  { path = "components.bcif", url = "https://openfold3-data.s3.amazonaws.com/components.bcif", sha256 = "473d845c8b250b188dbed9bf505ae206692a178a2a7c4869bf8f9de707ffcc0c", size = 63393643 },
  { path = "query.json", url = "https://raw.githubusercontent.com/aqlaboratory/openfold-3/c4771653c5d0a3ebb0b3af71b05efd64bc44ee86/examples/example_inference_inputs/query_ubiquitin.json", sha256 = "bc2b205720cb6cab8b9f199f080af4cb58e7625ffe10179cba28d6297b7000bf", size = 240 },
]

[e2e_defaults.structure_prediction]
reference_backend = "invariant_only"
oracle_level = "L4_invariants"
stages = [{ name = "native_ubiquitin_structure", required = true }]
