id = "personaplex"
plugin = "personaplex"
test_manifests = [
  "manifests/personaplex-7b-l0-tp4.json",
  "manifests/personaplex-7b-l0.json",
  "manifests/personaplex-7b.json",
]

[model_reference_cache]
repository = "https://github.com/NVIDIA/personaplex.git"
revision = "3428dfd95309a7f3c84fd93259ded0f810d1ff91"
relative_path = "personaplex/reference/personaplex-3428dfd95309"
entrypoint = "moshi/moshi/offline.py"
environment_variable = "PERSONAPLEX_OFFICIAL_REPO"

[e2e_defaults.speech_to_speech]
reference_backend = "torch_reference"
oracle_level = "L2_internal_reference"
stages = [
  { name = "full_generation", required = true },
]
input_fields = [
  { input = "audio", manifest = "test_input_audio" },
  { input = "speech_reference_tokens", manifest = "speech_reference_tokens" },
  { input = "speech_test_max_frames", manifest = "speech_test_max_frames" },
]
preflight_asset_fields = ["test_input_audio", "speech_reference_tokens"]
