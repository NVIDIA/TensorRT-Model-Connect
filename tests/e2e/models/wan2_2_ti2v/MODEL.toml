id = "wan2_2_ti2v"
test_manifests = [
  "manifests/wan22-ti2v-5b-l0.json",
  "manifests/wan22-ti2v-5b.json",
]

[model_reference_cache]
repository = "https://github.com/Wan-Video/Wan2.2.git"
revision = "42bf4cfaa384bc21833865abc2f9e6c0e67233dc"
relative_path = "wan2_2_ti2v/reference/Wan2.2-42bf4cfaa384"
entrypoint = "wan/textimage2video.py"
environment_variable = "TRTMC_WAN_REFERENCE_REPO"
suites = ["nightly"]

[e2e_defaults.diffusion_media_generation]
reference_backend = "invariant_only"
oracle_level = "L4_invariants"
stages = [
  { name = "end_to_end", required = true },
]
input_fields = [
  { input = "video_num_frames", manifest = "video_num_frames" },
  { input = "video_height", manifest = "video_height" },
  { input = "video_width", manifest = "video_width" },
  { input = "num_inference_steps", manifest = "num_inference_steps" },
  { input = "guidance_scale", manifest = "guidance_scale" },
  { input = "flow_shift", manifest = "flow_shift" },
  { input = "fps", manifest = "fps" },
  { input = "text_max_length", manifest = "text_max_length" },
]
build_cli_args = [
  { flag = "--video-height", input = "video_height" },
  { flag = "--video-width", input = "video_width" },
  { flag = "--video-num-frames", input = "video_num_frames" },
  { flag = "--num-inference-steps", input = "num_inference_steps" },
]
