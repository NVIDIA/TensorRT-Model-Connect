id = "nemotron_speech_streaming"
plugin = "nemotron_speech_streaming"
test_manifests = [
  "manifests/nemotron-speech-streaming-en-0.6b-tp4.json",
  "manifests/nemotron-speech-streaming-en-0.6b.json",
  "manifests/nemotron-speech-streaming-en-0.6b-asr-probe01.json",
  "manifests/nemotron-speech-streaming-en-0.6b-asr-probe02.json",
  "manifests/nemotron-speech-streaming-en-0.6b-asr-probe03.json",
  "manifests/nemotron-speech-streaming-en-0.6b-asr-probe04.json",
  "manifests/nemotron-speech-streaming-en-0.6b-asr-probe05.json",
  "manifests/nemotron-speech-streaming-en-0.6b-asr-probe06.json",
  "manifests/nemotron-speech-streaming-en-0.6b-asr-probe08.json",
]

[e2e_defaults.speech_to_text]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_generation", required = true },
]
input_fields = [
  { input = "audio", manifest = "test_input_audio" },
]
preflight_asset_fields = ["test_input_audio"]
