id = "dinov3"
plugin = "dinov3"
test_manifests = [
  "manifests/dinov3-vits16-timm-l0.json",
  "manifests/dinov3-vits16-pretrain-lvd1689m.json",
  "manifests/dinov3-convnext-tiny-pretrain-lvd1689m.json",
]

[e2e_defaults.image_feature_extraction]
reference_backend = "hf_transformers"
oracle_level = "L1_external_reference"
stages = [
  { name = "full_inference", required = true },
]
input_fields = [
  { input = "image", manifest = "test_image" },
]
preflight_asset_fields = ["test_image"]
preflight_requirements = [
  { kind = "python_module_available", args = { module = "torch", phase = "reference" }, gating = true },
  { kind = "python_module_available", args = { module = "transformers", phase = "reference" }, gating = true },
  { kind = "python_module_available", args = { module = "PIL", phase = "reference" }, gating = true },
]
