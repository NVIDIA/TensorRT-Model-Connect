  - id: vbench_ti2v_official_profile_parity
    description: >
      Wan2.2 TI2V-5B consistency at the pinned official 1280x704,
      121-frame, 50-step profile. The pinned official Wan implementation and
      TRTMC generate aligned videos for model-owned numeric comparison.
    user_contract: diffusion_video
    default_model_names: [wan22-ti2v-5b]
    dataset:
      kind: diffusion_prompt_json
      default_path: /mnt/data/VBench/vbench_t2v_task_eval.json
      prompt_field: prompt
      subject_field: category
    selectors:
      model_names: [wan22-ti2v-5b]
    generation:
      seed: 42
    scoring:
      scorer: diffusion_image_clip_parity
    gates:
      exact_num_frames: 121
      exact_video_height: 704
      exact_video_width: 1280
      max_rmse_uint8: 1.0
      max_pixel_mean: 0.98
      max_temporal_motion_ratio: 2.0
      min_active_transition_fraction: 0.9
      min_cosine_uint8: 0.998
      min_frame_cosine_uint8: 0.998
      min_pixel_mean: 0.02
      min_pixel_std: 0.01
      min_temporal_motion_ratio: 0.5
      min_temporal_profile_correlation: 0.75
