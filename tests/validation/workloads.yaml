version: 1

suites:
  - id: mmlu_five_shot_mcq
    description: >
      Local five-shot MMLU multiple-choice accuracy evaluation. This validates
      user-visible task quality for decoder-style text generation bundles and
      records HF-reference agreement separately from absolute correctness.
    user_contract: multiple_choice_qa
    default_model_names:
      - gemma-2-2b
      - gpt-oss-20b
      - internlm2-1.8b
      - nemotron-nano-4b
      - tinyllama-1.1b
      - mistral-7b
      - nemotron-mini-4b
      - nemotron-h-nano-9b
      - phi3-mini
      - phi-moe
      - qwen3-0.6b-fp16
      - qwen3-0.6b-fp8
      - qwen3-0.6b-topp
      - qwen3-4b-instruct-2507
      - qwen35-9b
      - qwen3-moe-30b-a3b
    dataset:
      kind: mmlu_five_shot_json
      default_path: /mnt/data/MMLU_five_shot/mmlu_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
    selectors:
      task_strategies:
        - text_generation_causal
      user_contracts:
        - chat_response
      exclude_user_contracts:
        - continuation_parity
        - code_completion
        - translation
        - seq2seq_output
        - model_card_generation_parity
    generation:
      max_new_tokens: 1
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    model_overrides:
      by_family:
        gpt_oss:
          prompt_renderer: gpt_oss_harmony_mcq
          answer_parser: gpt_oss_harmony_final_mcq
          require_valid_prediction: true
          # The MXFP4 checkpoint's official Transformers path dequantizes
          # experts to BF16 while TRTMC builds the dequantized engine in FP16.
          reference_precision: bf16
          allow_reference_precision_mismatch: true
          build_generation_headroom: true
          generation:
            max_new_tokens: 8
            apply_chat_template: false
            enable_thinking: false
        internlm:
          # InternLM2 remote code is incompatible with the Transformers 5.x
          # generation cache API (attention length N+1 vs mask length N).
          hf_use_cache: false
    build:
      min_max_cache_length: 0
    gates:
      max_accuracy_drop_from_hf: 0.01
      min_prediction_agreement: 0.98
    ci:
      eligible: false
      lane: local_only
      notes: >
        First step is local execution. CI can later consume the same suite
        manifest with a smaller sampled dataset and explicit model allowlist.

  - id: mmlu_continuation_parity
    description: >
      Base / completion-model continuation parity. Both the HF reference and the
      TRTFB bundle greedily continue the same plain-text MMLU prompt; the two
      continuations are compared token-level (no gold answer, no logits). This
      measures conversion fidelity for completion models rather than task
      accuracy.
    user_contract: continuation_parity
    default_model_names:
      - bart-base
      - bloom-560m
      - deepseek-v2-lite
      - deepseek-v2-tiny
      - falcon-rw-1b
      - glm-4-9b
      - gpt2-125m
      - gpt-neo-125m
      - pythia-70m
      - granite-3.1-2b
      - falcon3-1b
      - minitron-4b-depth
      - minitron-4b-width
      - mamba-130m
      - mixtral-stories-15m
      - nemotron-hindi-4b
      - olmo-1b
      - olmo2-1b
      - opt-125m
      - rwkv-169m
      - stablelm2-1.6b
      - xglm-564m
    dataset:
      kind: mmlu_five_shot_json
      default_path: /mnt/data/MMLU_five_shot/mmlu_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
    selectors:
      task_strategies:
        - text_generation_causal
      user_contracts:
        - continuation_parity
    generation:
      max_new_tokens: 64
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: continuation
    model_overrides:
      by_model:
        bart-base:
          # Reserve two special tokens plus 64 generated decoder tokens inside
          # the causal BART path's 1024-position table.
          prompt_token_limit: 958
          prompt_truncation_side: left
          # Compare raw greedy logits with TRTMC. The checkpoint's generation
          # defaults otherwise inject a 3-gram repetition ban and force BOS/EOS
          # tokens that the native runtime does not apply.
          hf_generation_overrides:
            no_repeat_ngram_size: 0
            forced_bos_token_id: null
            forced_eos_token_id: null
        gpt2-125m:
          # Reserve the suite's 64 generated tokens inside GPT-2's 1024 limit.
          prompt_token_limit: 960
          prompt_truncation_side: left
        gpt-neo-125m:
          # Reserve the suite's 64 generated tokens inside its 2048 limit.
          prompt_token_limit: 1984
          prompt_truncation_side: left
        falcon-rw-1b:
          # This checkpoint is numerically sensitive in FP16. Compare both
          # sides in FP32 instead of measuring different FP16 kernel rounding.
          comparison_precision: fp32
        granite-3.1-2b:
          # This checkpoint is numerically sensitive in FP16. Compare both
          # sides in FP32 instead of measuring different FP16 kernel rounding.
          comparison_precision: fp32
        olmo2-1b:
          # This checkpoint is numerically sensitive in FP16. Compare both
          # sides in FP32 instead of measuring different FP16 kernel rounding.
          comparison_precision: fp32
        opt-125m:
          # Reserve the suite's 64 generated tokens inside OPT's 2048 limit.
          prompt_token_limit: 1984
          prompt_truncation_side: left
    build:
      min_max_cache_length: 0
    gates:
      # Validation samples are the pass/fail unit. Allow one divergent sample
      # in the default 10-sample smoke while retaining token-prefix metrics as
      # diagnostics for locating and sizing that divergence.
      min_exact_match_rate: 0.9
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation before a sampled CI variant is
        enabled.

  - id: humaneval_code_continuation_parity
    description: >
      Greedy code-completion parity on the official HumanEval prompts used by
      both CodeGen and StarCoder2 evaluations. Functional pass@1 is intentionally
      not executed by this runner. Divergence is expected and reported as its
      per-sample frequency, first position, normalized prefix, and severity.
    user_contract: code_completion
    default_model_names:
      - codegen-350m
      - starcoder2-3b
    dataset:
      kind: text_generation_json
      name: OpenAI HumanEval
      default_path: /mnt/data/HumanEval/humaneval_task_eval.json
      prompt_source: prompt
      answer_field: answer
      subject_field: subject
      sample_prefix: humaneval
    selectors:
      model_names:
        - codegen-350m
        - starcoder2-3b
      task_strategies:
        - text_generation_causal
      user_contracts:
        - code_completion
    generation:
      max_new_tokens: 64
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: continuation
    model_overrides:
      by_model:
        codegen-350m:
          build_generation_headroom: true
        starcoder2-3b:
          build_generation_headroom: true
    gates: {}
    ci:
      eligible: false
      lane: local_only
      notes: >
        Run with --limit 10 on GB300. Generated code is not executed by
        validation; HumanEval pass@1 remains a separate diagnostic.

  - id: wikitext103_distilgpt2_continuation_parity
    description: >
      Greedy language-model continuation parity for DistilGPT2 on WikiText-103,
      the benchmark reported by its model card. Full-corpus perplexity is outside
      this smoke runner; divergence frequency and severity are diagnostic.
    user_contract: continuation_parity
    default_model_names:
      - distilgpt2
    dataset:
      kind: text_generation_json
      name: WikiText-103 test
      default_path: /mnt/data/WikiText103/wikitext103_task_eval.json
      prompt_source: prompt
      answer_field: answer
      subject_field: subject
      sample_prefix: wikitext103
    selectors:
      model_names:
        - distilgpt2
      task_strategies:
        - text_generation_causal
      user_contracts:
        - model_card_generation_parity
    generation:
      max_new_tokens: 64
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: continuation
    model_overrides:
      by_model:
        distilgpt2:
          build_generation_headroom: true
    gates: {}
    ci:
      eligible: false
      lane: local_only
      notes: >
        Run with --limit 10 on GB300; full-corpus perplexity is not meaningful
        on the smoke slice.

  - id: newstest2019_en_ru_marian_translation_parity
    description: >
      English-to-Russian translation parity for Marian on WMT newstest2019,
      one of the checkpoint model card's reported benchmarks. SacreBLEU is
      reported separately while backend divergence frequency and severity are
      retained per sample.
    user_contract: translation
    default_model_names:
      - marian-en-ru
    dataset:
      kind: text_generation_json
      name: WMT newstest2019 English-Russian
      default_path: /mnt/data/WMT19_en_ru/newstest2019_en_ru_task_eval.json
      prompt_source: prompt
      answer_field: answer
      subject_field: subject
      sample_prefix: newstest2019_en_ru
    selectors:
      model_names:
        - marian-en-ru
      task_strategies:
        - text_generation_causal
      runtime_strategies:
        - marian_translation
      user_contracts:
        - translation
    generation:
      max_new_tokens: 128
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: continuation
      task_metric: sacrebleu
    gates: {}
    ci:
      eligible: false
      lane: local_only
      notes: >
        Run with --limit 10 on GB300. BLEU on ten samples is diagnostic only.

  - id: wmt14_en_de_t5_translation_parity
    description: >
      English-to-German translation parity for T5-small on the WMT task used by
      the T5 paper. Inputs retain the checkpoint's required task prefix;
      SacreBLEU and backend divergence severity are diagnostic.
    user_contract: seq2seq_output
    default_model_names:
      - t5-small
    dataset:
      kind: text_generation_json
      name: WMT14 English-German
      default_path: /mnt/data/WMT14_de_en/wmt14_en_de_t5_task_eval.json
      prompt_source: prompt
      answer_field: answer
      subject_field: subject
      sample_prefix: wmt14_en_de
    selectors:
      model_names:
        - t5-small
      task_strategies:
        - text_generation_causal
      runtime_strategies:
        - t5_text_to_text
      user_contracts:
        - seq2seq_output
    generation:
      max_new_tokens: 128
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: continuation
      task_metric: sacrebleu
    gates: {}
    ci:
      eligible: false
      lane: local_only
      notes: >
        Dataset prompts must be prefixed with "translate English to German:".
        Derive them by reversing the existing WMT14 de-en parallel JSONL under
        /mnt/data/WMT14_de_en. Run with --limit 10 on GB300; BLEU is diagnostic
        on the smoke slice.

  - id: flores200_en_fr_riva_translation_parity
    description: >
      English-to-French translation parity for Riva Translate on FLORES-200,
      one of the checkpoint model card's reported benchmark families. Dataset
      prompts use the model-card en-fr chat expansion so both backends consume
      the identical rendered text. SacreBLEU and backend divergence severity
      remain diagnostic.
    user_contract: translation
    default_model_names:
      - riva-translate-4b
    dataset:
      kind: text_generation_json
      name: FLORES-200 devtest English-French
      default_path: /mnt/data/FLORES200_en_fr/flores200_en_fr_task_eval.json
      prompt_source: prompt
      answer_field: answer
      subject_field: subject
      sample_prefix: flores200_en_fr
    selectors:
      model_names:
        - riva-translate-4b
      task_strategies:
        - text_generation_causal
      runtime_strategies:
        - mistral_decoder_kv_cache
      user_contracts:
        - translation
    generation:
      max_new_tokens: 128
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: continuation
      task_metric: sacrebleu
    model_overrides:
      by_model:
        riva-translate-4b:
          build_generation_headroom: true
    gates: {}
    ci:
      eligible: false
      lane: local_only
      notes: >
        Run with --limit 10 on GB300. BLEU on ten samples is diagnostic only.

  - id: vlm_mmmu_pro_vision_mcq
    description: >
      Local VLM multiple-choice accuracy evaluation on MMMU-Pro-Vision. This
      validates image-conditioned question answering for vision-language bundles
      with gold option-letter answers and records HF-reference agreement
      separately from absolute correctness.
    user_contract: vl_answer
    default_model_names:
      - internvl3-2b
      - internvl3-8b
      - qwen25vl-3b
      - qwen3-vl-2b
    dataset:
      kind: vlm_chat_json
      default_path: /mnt/data/MMMU_Pro_vision/mmmu_pro_vision_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
      image_source: messages
      max_images_per_sample: 1
    selectors:
      task_strategies:
        - vision_language_generation
      runtime_strategies:
        - qwen_vl_vision_language
        - internvl_vision_language
      families:
        - qwen_vl
        - internvl
      exclude_families:
        - deepseek_ocr
        - locateanything
        - lance
    generation:
      max_new_tokens: 8
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: true
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: mcq
    build:
      min_max_cache_length: 512
    gates:
      max_accuracy_drop_from_hf: 0.02
      min_prediction_agreement: 0.95
    ci:
      eligible: false
      lane: local_only
      notes: >
        First step is local execution on a sampled subset. Nightly/premerge
        gates should be enabled only after the HF/TRTFB baselines are calibrated
        for each VLM family.

  - id: vlm_mmmu_pro_vision_fixed_mcq
    description: >
      Fixed-input VLM multiple-choice parity evaluation on MMMU-Pro-Vision.
      Images are normalized to the current Qwen/InternVL fixed-size TRTFB
      contract and prompts are normalized to a single user image-first message
      so HF native and TRTFB consume the same controlled input shape.
    user_contract: vl_answer
    default_model_names:
      - internvl3-2b
      - internvl3-8b
      - qwen25vl-3b
      - qwen3-vl-2b
    dataset:
      kind: vlm_chat_json
      default_path: /mnt/data/MMMU_Pro_vision/mmmu_pro_vision_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
      image_source: messages
      max_images_per_sample: 1
      normalization:
        image_size: 448
        prompt_contract: single_user_image_first
    selectors:
      task_strategies:
        - vision_language_generation
      runtime_strategies:
        - qwen_vl_vision_language
        - internvl_vision_language
      families:
        - qwen_vl
        - internvl
      exclude_families:
        - deepseek_ocr
        - locateanything
        - lance
    generation:
      max_new_tokens: 8
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: true
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: mcq
    build:
      min_max_cache_length: 1024
    gates:
      max_accuracy_drop_from_hf: 0.02
      min_prediction_agreement: 0.95
    ci:
      eligible: false
      lane: local_only
      notes: >
        Controlled fixed-input parity suite for the current fixed-shape VLM
        runtime. This does not replace the native HF-target suite above.

  - id: ocrbench_v2_unified
    description: >
      Local OCRBench v2 evaluation on the unified VLM dataset format. This
      validates image-conditioned OCR / visual QA bundles against OCRBench v2
      task-specific gold metrics without requiring dataset-local TRTMC config.
    user_contract: ocr_text
    default_model_names:
      - deepseek-ocr
    dataset:
      kind: vlm_unified_json
      default_path: /mnt/data/OCRBench_v2/unified/dataset.json
      answer_field: answer.primary
      subject_field: category
      prompt_source: messages
      image_source: media
      max_images_per_sample: 1
    selectors:
      task_strategies:
        - vision_language_generation
      runtime_strategies:
        - deepseek_ocr_vision_language
      families:
        - deepseek_ocr
      exclude_families:
        - locateanything
        - lance
    generation:
      max_new_tokens: 32
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: true
      enable_thinking: false
      do_sample: false
    model_overrides:
      by_model:
        deepseek-ocr:
          # DeepSeek-OCR's upstream model.infer path is explicitly BF16. TRTMC
          # uses its reviewed FP16/FP32 mixed policy, so record the difference
          # instead of coercing the upstream reference into an invalid dtype.
          reference_precision: bf16
          allow_reference_precision_mismatch: true
    scoring:
      scorer: ocrbench_v2
    build:
      min_max_cache_length: 1024
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation first. Pass --dataset for
        machine-specific data roots such as
        /localhome/.../trtmc/data/OCRBench_v2_repaired.

  - id: librispeech_clean_asr
    description: >
      Local ASR transcript evaluation on LibriSpeech clean test samples. This
      validates speech-to-text bundles against reference transcripts and records
      HF-reference agreement separately from transcript accuracy.
    user_contract: exact_transcript
    default_model_names:
      - whisper-tiny-fp16
      - whisper-large-v3-turbo
      - canary-1b-v2
    dataset:
      kind: asr_chat_json
      default_path: /mnt/data/librispeech_clean_test/librispeech_clean_test.json
      answer_field: reference
      subject_field: subset
      prompt_source: messages
      audio_source: messages
      max_audio_per_sample: 1
    selectors:
      task_strategies:
        - speech_to_text
      runtime_strategies:
        - whisper_speech_to_text
        - canary_speech_to_text
      families:
        - whisper
        - canary
      exclude_families:
        - nemotron_speech_streaming
    generation:
      max_new_tokens: 256
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      sample_rate: 16000
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: asr_transcript
    build:
      min_max_cache_length: 0
    gates:
      max_accuracy_drop_from_hf: 0.05
      min_prediction_agreement: 0.90
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation first. Pass --dataset for
        machine-specific data roots such as
        /localhome/local-chaofengw/trtmc/data/updated_datasets.

  - id: librispeech_clean_asr_streaming
    description: >
      Local ASR transcript evaluation on LibriSpeech clean test samples for
      streaming/RNNT speech-to-text bundles.
    user_contract: exact_transcript
    default_model_names:
      - nemotron-3.5-asr-streaming-0.6b
      - nemotron-speech-streaming-en-0.6b
    dataset:
      kind: asr_chat_json
      default_path: /mnt/data/librispeech_clean_test/librispeech_clean_test.json
      answer_field: reference
      subject_field: subset
      prompt_source: messages
      audio_source: messages
      max_audio_per_sample: 1
    selectors:
      task_strategies:
        - speech_to_text
      runtime_strategies:
        - nemotron_speech_streaming_speech_to_text_rnnt
      families:
        - nemotron_speech_streaming
    generation:
      max_new_tokens: 256
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      sample_rate: 16000
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: asr_transcript
    build:
      min_max_cache_length: 0
    gates:
      max_accuracy_drop_from_hf: 0.05
      min_prediction_agreement: 0.90
    model_profiles:
      nemotron-3.5-asr-streaming-0.6b:
        generation:
          language: en-US
          streaming:
            enabled: true
            chunk_ms: 1120
            att_context_size: [56, 13]
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation first. This suite is kept separate
        from librispeech_clean_asr because RNNT streaming baselines can differ
        from encoder-decoder ASR baselines.

  - id: seedtts_en_tts_intelligibility
    description: >
      Local English text-to-audio evaluation on SeedTTS. Generated speech is
      checked for a valid non-silent waveform and transcribed with ASR to
      measure intelligibility against the requested text. Reference-waveform
      duration is used only as a broad health check; sample-level waveform
      similarity is intentionally not treated as a quality metric.
    user_contract: tts_audio
    default_model_names:
      - bark-large
      - bark-small
      - magpie-tts-357m
    dataset:
      kind: seedtts_json
      default_path: /mnt/data/SeedTTS_en_meta/seedtts_en_meta.json
      prompt_source: messages
      answer_field: reference
      audio_field: reference_wav
      language: en
    selectors:
      task_strategies:
        - text_to_audio
      runtime_strategies:
        - text_to_audio_bark
        - text_to_audio_magpie
      user_contracts:
        - tts_audio
      families:
        - bark
        - magpie_tts
    generation:
      max_new_tokens: 750
      seed: 42
    scoring:
      scorer: tts_intelligibility
      asr_model: openai/whisper-large-v3-turbo
      max_wer: 0.25
      max_ned: 0.20
      min_rms: 0.001
      min_duration_ratio: 0.5
      max_duration_ratio: 2.0
    build:
      min_max_cache_length: 1024
    gates:
      max_pass_rate_drop_from_hf: 0.05
      min_correctness_agreement: 0.95
    ci:
      eligible: false
      lane: local_only
      notes: >
        Start with a sampled local run. ASR dependencies and calibrated
        per-family thresholds are required before enabling a CI gate.

  - id: dpg_bench_diffusion_image
    description: >
      Unified HF-to-TRTMC text-to-image parity evaluation on the official
      DPG-Bench dense prompts. The processed dataset retains every proposition
      question for visual review. Model manifests own image dimensions and
      inference steps, while per-model profiles own calibrated parity gates.
      Prompt alignment remains diagnostic because CLIP truncates dense prompts.
    user_contract: diffusion_image
    default_model_names:
      - flux-schnell-l0
      - flux-2-dev-l0
      - flux-2-dev-fp8-l0
      - pixart-sigma-1024
      - qwen-image
      - qwen-image-2512
      - z-image-turbo
    dataset:
      kind: diffusion_prompt_json
