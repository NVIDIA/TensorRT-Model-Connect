        sam:
          prompt_mode: point
          ground_truth_mask_field: instance_mask
        sam3:
          prompt_mode: text
          ground_truth_mask_field: category_mask
    ci:
      eligible: false
      lane: local_only

  - id: etth1_time_series_parity
    description: >
      Per-sample HF-versus-TRTMC numeric parity on official ETTh1 test windows.
      Model-specific adapters preserve each checkpoint's native contract:
      univariate quantile/point forecasts, seven-channel point forecasts, and
      six-channel regression. Every sample must satisfy both relative-L2 and
      maximum-absolute-error gates.
    user_contract: time_series_prediction_parity
    default_model_names:
      - chronos-bolt-tiny-official
      - patchtsmixer-granite-official
      - patchtst-etth1-regression-distribution
      - patchtst-granite-official
      - timesfm-2.0-500m-official
    dataset:
      kind: time_series_csv
      name: ETT-small ETTh1
      default_path: /mnt/data/ETTh1/ETTh1.csv
      source: https://raw.githubusercontent.com/zhouhaoyi/ETDataset/1d16c8f4f943005d613b5bc962e9eeb06058cf07/ETT-small/ETTh1.csv
      source_revision: 1d16c8f4f943005d613b5bc962e9eeb06058cf07
      sha256: f18de3ad269cef59bb07b5438d79bb3042d3be49bdeecf01c1cd6d29695ee066
      sample_prefix: etth1
      # Standard ETT-hourly split: 12 train + 4 validation + 4 test months.
      test_target_start: 11520
      test_end: 14400
    selectors:
      task_strategies:
        - neural_operator
      runtime_strategies:
        - chronos_bolt_trt
        - patchtsmixer_trt
        - patchtst_trt
        - timesfm_trt
      families:
        - chronos_bolt
        - patchtsmixer
        - patchtst
        - timesfm
      user_contracts:
        - time_series_point_forecast
        - time_series_quantile_forecast
        - time_series_regression
    scoring:
      scorer: time_series_parity
    gates:
      min_sample_agreement_rate: 1.0
      max_relative_l2: 0.01
      max_absolute_error: 0.1
    model_overrides:
      by_model:
        chronos-bolt-tiny-official:
          time_series:
            input_columns: [OT]
            target_columns: [OT]
            input_key: branch_input
            context_length: 512
            prediction_length: 64
            stride: 24
            test_fraction: 0.2
        patchtsmixer-granite-official:
          time_series:
            input_columns: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
            target_columns: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
            input_key: field_input
            context_length: 512
            prediction_length: 96
            stride: 24
            test_fraction: 0.2
        patchtst-etth1-regression-distribution:
          time_series:
            input_columns: [HUFL, HULL, MUFL, MULL, LUFL, LULL]
            target_columns: [OT]
            input_key: field_input
            context_length: 512
            prediction_length: 1
            stride: 24
            test_fraction: 0.2
        patchtst-granite-official:
          time_series:
            input_columns: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
            target_columns: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
            input_key: field_input
            context_length: 512
            prediction_length: 96
            stride: 24
            test_fraction: 0.2
        timesfm-2.0-500m-official:
          time_series:
            input_columns: [OT]
            target_columns: [OT]
            input_key: branch_input
            context_length: 2048
            prediction_length: 128
            stride: 24
            test_fraction: 0.2
            frequency: 0
    model_profiles:
      # Calibrated on 100 deterministic GB300 ETTh1 windows (seed 20260715).
      # Relative-L2 remains the primary scale-aware drift bound; maximum
      # absolute error is a catastrophic-tail guard for each full output.
      chronos-bolt-tiny-official:
        gates:
          max_relative_l2: 1.0e-06
          max_absolute_error: 8.0e-06
      patchtsmixer-granite-official:
        gates:
          max_relative_l2: 5.0e-04
          max_absolute_error: 2.5e-02
      patchtst-etth1-regression-distribution:
        gates:
          max_relative_l2: 1.0e-03
          max_absolute_error: 1.0e-03
      patchtst-granite-official:
        gates:
          max_relative_l2: 1.5e-03
          max_absolute_error: 3.5e-02
      timesfm-2.0-500m-official:
        gates:
          max_relative_l2: 4.0e-03
          max_absolute_error: 7.0e-03
    ci:
      eligible: true
      lane: nightly
      limit: 10
      sample_seed: 20260715
      notes: >
        Run as a blocking nightly GB300 validation stage. ETTh1 is shared by all
        five checkpoints, but output quality metrics are not mixed across their
        distinct forecast and regression contracts; this suite gates backend
        prediction parity. TimesFM remains gated at its reviewed tolerance while
        its observed FP32 divergence is investigated.

  - id: stsbenchmark_encoder_embedding_parity
    description: >
      HF-versus-TRTMC vector parity for encoder-only NLP and text embedding
      models on the MTEB STSBenchmark test split. Base encoders compare their
      first-token representation; native embedding runtimes compare their
      pooled normalized embedding. Gold STS correlation is diagnostic only.
    user_contract: encoder_embedding_parity
    default_model_names:
      - albert-base
      - all-minilm-l6-v2
      - all-mpnet-base-v2
      - bert-base-uncased
      - bge-small-en-v1.5
      - camembert-base
      - convbert-base
      - deberta-base
      - distilbert-base-uncased
      - dpr-ctx-encoder
      - electra-base-discriminator
      - fnet-base
      - modernbert-base
      - nemotron-embed-vl-1b-v2
      - paraphrase-multilingual-minilm-l12-v2
      - roberta-base
      - roberta-large
      - xlm-roberta-base
      - xlnet-base
    dataset:
      kind: sts_pair_jsonl
      name: MTEB STSBenchmark test
      default_path: /mnt/data/STSBenchmark/stsbenchmark_test.jsonl
      subject_field: genre
    selectors:
      task_strategies:
        - encoder_only_nlp
        - embedding
      user_contracts:
        - representation_parity
        - embedding_vector
    reference:
      mode: hf_encoder_vector
    scoring:
      scorer: encoder_embedding_parity
      task_metric: sts_spearman
    model_overrides:
      by_model:
        fnet-base:
          # PyTorch cuFFT cannot execute FNet's 768-wide 2D transform in FP16.
          # Keep the numerical comparison aligned by building TRTMC and
          # running the reference in FP32.
          comparison_precision: fp32
        xlnet-base:
          # Upstream XLNet retains FP32 relative-attention parameters that
          # cannot participate in its FP16 einsum. Compare both sides in FP32.
          comparison_precision: fp32
    gates:
      min_vector_cosine: 0.999
      min_vector_pass_rate: 1.0
      max_pair_cosine_abs_delta: 0.02
    model_profiles:
      # Match the model-owned, reviewed encoder E2E numerical contracts. These
      # models have architecture-specific FP16 sensitivity; validation does not
      # invent looser thresholds for them.
      albert-base:
        gates:
          min_vector_cosine: 0.99
      convbert-base:
        gates:
          min_vector_cosine: 0.95
      dpr-ctx-encoder:
        gates:
          min_vector_cosine: 0.99
      fnet-base:
        gates:
          min_vector_cosine: 0.6
          # FNet's reviewed 0.6 vector-cosine contract permits larger drift in
          # the second-order cosine between two independently drifted vectors.
          max_pair_cosine_abs_delta: 0.1
      modernbert-base:
        gates:
          min_vector_cosine: 0.995
      nemotron-embed-vl-1b-v2:
        gates:
          min_vector_cosine: 0.99
      xlnet-base:
        gates:
          min_vector_cosine: 0.95

  - id: beir_scifact_reranking
    description: >
      Per-query HF-versus-TRTMC ranking parity on the BEIR SciFact test split.
      Each sample ranks the same relevant passage and deterministic distractors;
      every low-agreement sample is retained in summary.json. Gold top-1
      retrieval accuracy is reported separately as a task-quality diagnostic.
    user_contract: ranking_order
    default_model_names:
      - nemotron-rerank-vl-1b-v2
    dataset:
