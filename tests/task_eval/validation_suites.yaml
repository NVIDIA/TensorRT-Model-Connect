version: 1

suites:
  - id: mmlu_five_shot_mcq
    description: >
      Local five-shot MMLU multiple-choice accuracy evaluation. This validates
      user-visible task quality for decoder-style text generation bundles and
      records HF-reference agreement separately from absolute correctness.
    user_contract: multiple_choice_qa
    default_model_names:
      - gemma-2-2b
      - gpt-oss-20b
      - internlm2-1.8b
      - nemotron-nano-4b
      - tinyllama-1.1b
      - mistral-7b
      - nemotron-mini-4b
      - nemotron-h-nano-9b
      - phi3-mini
      - phi-moe
      - qwen3-0.6b-fp16
      - qwen3-4b-instruct-2507
      - qwen35-9b
      - qwen3-moe-30b-a3b
    dataset:
      kind: mmlu_five_shot_json
      default_path: /mnt/data/MMLU_five_shot/mmlu_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
    selectors:
      task_strategies:
        - text_generation_causal
      user_contracts:
        - chat_response
      exclude_user_contracts:
        - continuation_parity
        - code_completion
        - translation
        - seq2seq_output
        - model_card_generation_parity
    generation:
      max_new_tokens: 1
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    model_overrides:
      by_family:
        gpt_oss:
          prompt_renderer: gpt_oss_harmony_mcq
          answer_parser: gpt_oss_harmony_final_mcq
          require_valid_prediction: true
          build_generation_headroom: true
          generation:
            max_new_tokens: 8
            apply_chat_template: false
            enable_thinking: false
        internlm:
          # InternLM2 remote code is incompatible with the Transformers 5.x
          # generation cache API (attention length N+1 vs mask length N).
          hf_use_cache: false
    build:
      min_max_cache_length: 0
    gates:
      max_accuracy_drop_from_hf: 0.01
      min_prediction_agreement: 0.98
    ci:
      eligible: false
      lane: local_only
      notes: >
        First step is local execution. CI can later consume the same suite
        manifest with a smaller sampled dataset and explicit model allowlist.

  - id: mmlu_continuation_parity
    description: >
      Base / completion-model continuation parity. Both the HF reference and the
      TRTFB bundle greedily continue the same plain-text MMLU prompt; the two
      continuations are compared token-level (no gold answer, no logits). This
      measures conversion fidelity for completion models rather than task
      accuracy.
    user_contract: continuation_parity
    default_model_names:
      - bart-base
      - bloom-560m
      - deepseek-v2-lite
      - deepseek-v2-tiny
      - falcon-rw-1b
      - glm-4-9b
      - gpt2-125m
      - gpt-neo-125m
      - pythia-70m
      - granite-3.1-2b
      - falcon3-1b
      - minitron-4b-depth
      - minitron-4b-width
      - mamba-130m
      - mixtral-stories-15m
      - nemotron-hindi-4b
      - olmo-1b
      - olmo2-1b
      - opt-125m
      - rwkv-169m
      - stablelm2-1.6b
      - xglm-564m
    dataset:
      kind: mmlu_five_shot_json
      default_path: /mnt/data/MMLU_five_shot/mmlu_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
    selectors:
      task_strategies:
        - text_generation_causal
      user_contracts:
        - continuation_parity
    generation:
      max_new_tokens: 64
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: continuation
    model_overrides:
      by_model:
        bart-base:
          # Reserve two special tokens plus 64 generated decoder tokens inside
          # the causal BART path's 1024-position table.
          prompt_token_limit: 958
          prompt_truncation_side: left
        gpt2-125m:
          # Reserve the suite's 64 generated tokens inside GPT-2's 1024 limit.
          prompt_token_limit: 960
          prompt_truncation_side: left
        gpt-neo-125m:
          # Reserve the suite's 64 generated tokens inside its 2048 limit.
          prompt_token_limit: 1984
          prompt_truncation_side: left
        opt-125m:
          # Reserve the suite's 64 generated tokens inside OPT's 2048 limit.
          prompt_token_limit: 1984
          prompt_truncation_side: left
    build:
      min_max_cache_length: 0
    gates:
      min_token_prefix_agreement: 0.98
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation before a sampled CI variant is
        enabled.

  - id: vlm_mmmu_pro_vision_mcq
    description: >
      Local VLM multiple-choice accuracy evaluation on MMMU-Pro-Vision. This
      validates image-conditioned question answering for vision-language bundles
      with gold option-letter answers and records HF-reference agreement
      separately from absolute correctness.
    user_contract: vl_answer
    default_model_names:
      - internvl3-2b
      - internvl3-8b
      - qwen25vl-3b
      - qwen3-vl-2b
    dataset:
      kind: vlm_chat_json
      default_path: /mnt/data/MMMU_Pro_vision/mmmu_pro_vision_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
      image_source: messages
      max_images_per_sample: 1
    selectors:
      task_strategies:
        - vision_language_generation
      runtime_strategies:
        - qwen_vl_vision_language
        - internvl_vision_language
      families:
        - qwen_vl
        - internvl
      exclude_families:
        - deepseek_ocr
        - locateanything
        - lance
    generation:
      max_new_tokens: 8
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: true
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: mcq
    build:
      min_max_cache_length: 512
    gates:
      max_accuracy_drop_from_hf: 0.02
      min_prediction_agreement: 0.95
    ci:
      eligible: false
      lane: local_only
      notes: >
        First step is local execution on a sampled subset. Nightly/premerge
        gates should be enabled only after the HF/TRTFB baselines are calibrated
        for each VLM family.

  - id: vlm_mmmu_pro_vision_fixed_mcq
    description: >
      Fixed-input VLM multiple-choice parity evaluation on MMMU-Pro-Vision.
      Images are normalized to the current Qwen/InternVL fixed-size TRTFB
      contract and prompts are normalized to a single user image-first message
      so HF native and TRTFB consume the same controlled input shape.
    user_contract: vl_answer
    default_model_names:
      - internvl3-2b
      - internvl3-8b
      - qwen25vl-3b
      - qwen3-vl-2b
    dataset:
      kind: vlm_chat_json
      default_path: /mnt/data/MMMU_Pro_vision/mmmu_pro_vision_dataset.json
      answer_field: answer
      subject_field: subject
      prompt_source: messages
      image_source: messages
      max_images_per_sample: 1
      normalization:
        image_size: 448
        prompt_contract: single_user_image_first
    selectors:
      task_strategies:
        - vision_language_generation
      runtime_strategies:
        - qwen_vl_vision_language
        - internvl_vision_language
      families:
        - qwen_vl
        - internvl
      exclude_families:
        - deepseek_ocr
        - locateanything
        - lance
    generation:
      max_new_tokens: 8
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: true
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: mcq
    build:
      min_max_cache_length: 1024
    gates:
      max_accuracy_drop_from_hf: 0.02
      min_prediction_agreement: 0.95
    ci:
      eligible: false
      lane: local_only
      notes: >
        Controlled fixed-input parity suite for the current fixed-shape VLM
        runtime. This does not replace the native HF-target suite above.

  - id: ocrbench_v2_unified
    description: >
      Local OCRBench v2 evaluation on the unified VLM dataset format. This
      validates image-conditioned OCR / visual QA bundles against OCRBench v2
      task-specific gold metrics without requiring dataset-local TRTMC config.
    user_contract: ocr_text
    default_model_names:
      - deepseek-ocr
    dataset:
      kind: vlm_unified_json
      default_path: /mnt/data/OCRBench_v2/unified/dataset.json
      answer_field: answer.primary
      subject_field: category
      prompt_source: messages
      image_source: media
      max_images_per_sample: 1
    selectors:
      task_strategies:
        - vision_language_generation
      runtime_strategies:
        - deepseek_ocr_vision_language
      families:
        - deepseek_ocr
      exclude_families:
        - locateanything
        - lance
    generation:
      max_new_tokens: 32
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      apply_chat_template: true
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: ocrbench_v2
    build:
      min_max_cache_length: 1024
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation first. Pass --dataset for
        machine-specific data roots such as
        /localhome/.../trtmc/data/OCRBench_v2_repaired.

  - id: librispeech_clean_asr
    description: >
      Local ASR transcript evaluation on LibriSpeech clean test samples. This
      validates speech-to-text bundles against reference transcripts and records
      HF-reference agreement separately from transcript accuracy.
    user_contract: exact_transcript
    default_model_names:
      - whisper-tiny-fp16
      - whisper-large-v3-turbo
      - canary-1b-v2
    dataset:
      kind: asr_chat_json
      default_path: /mnt/data/librispeech_clean_test/librispeech_clean_test.json
      answer_field: reference
      subject_field: subset
      prompt_source: messages
      audio_source: messages
      max_audio_per_sample: 1
    selectors:
      task_strategies:
        - speech_to_text
      runtime_strategies:
        - whisper_speech_to_text
        - canary_speech_to_text
      families:
        - whisper
        - canary
      exclude_families:
        - nemotron_speech_streaming
    generation:
      max_new_tokens: 256
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      sample_rate: 16000
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: asr_transcript
    build:
      min_max_cache_length: 0
    gates:
      max_accuracy_drop_from_hf: 0.05
      min_prediction_agreement: 0.90
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation first. Pass --dataset for
        machine-specific data roots such as
        /localhome/local-chaofengw/trtmc/data/updated_datasets.

  - id: librispeech_clean_asr_streaming
    description: >
      Local ASR transcript evaluation on LibriSpeech clean test samples for
      streaming/RNNT speech-to-text bundles.
    user_contract: exact_transcript
    default_model_names:
      - nemotron-3.5-asr-streaming-0.6b
      - nemotron-speech-streaming-en-0.6b
    dataset:
      kind: asr_chat_json
      default_path: /mnt/data/librispeech_clean_test/librispeech_clean_test.json
      answer_field: reference
      subject_field: subset
      prompt_source: messages
      audio_source: messages
      max_audio_per_sample: 1
    selectors:
      task_strategies:
        - speech_to_text
      runtime_strategies:
        - nemotron_speech_streaming_speech_to_text_rnnt
      families:
        - nemotron_speech_streaming
    generation:
      max_new_tokens: 256
      temperature: 1.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      seed: -1
      sample_rate: 16000
      apply_chat_template: false
      enable_thinking: false
      do_sample: false
    scoring:
      scorer: asr_transcript
    build:
      min_max_cache_length: 0
    gates:
      max_accuracy_drop_from_hf: 0.05
      min_prediction_agreement: 0.90
    model_profiles:
      nemotron-3.5-asr-streaming-0.6b:
        generation:
          language: en-US
          streaming:
            enabled: true
            chunk_ms: 1120
            att_context_size: [56, 13]
    ci:
      eligible: false
      lane: local_only
      notes: >
        Intended for local/p2021 validation first. This suite is kept separate
        from librispeech_clean_asr because RNNT streaming baselines can differ
        from encoder-decoder ASR baselines.

  - id: seedtts_en_tts_intelligibility
    description: >
      Local English text-to-audio evaluation on SeedTTS. Generated speech is
      checked for a valid non-silent waveform and transcribed with ASR to
      measure intelligibility against the requested text. Reference-waveform
      duration is used only as a broad health check; sample-level waveform
      similarity is intentionally not treated as a quality metric.
    user_contract: tts_audio
    default_model_names:
      - bark-large
      - bark-small
      - magpie-tts-357m
    dataset:
      kind: seedtts_json
      default_path: /mnt/data/SeedTTS_en_meta/seedtts_en_meta.json
      prompt_source: messages
      answer_field: reference
      audio_field: reference_wav
      language: en
    selectors:
      task_strategies:
        - text_to_audio
      runtime_strategies:
        - text_to_audio_bark
        - text_to_audio_magpie
      user_contracts:
        - tts_audio
      families:
        - bark
        - magpie_tts
    generation:
      max_new_tokens: 750
      seed: 42
    scoring:
      scorer: tts_intelligibility
      asr_model: openai/whisper-large-v3-turbo
      max_wer: 0.25
      max_ned: 0.20
      min_rms: 0.001
      min_duration_ratio: 0.5
      max_duration_ratio: 2.0
    build:
      min_max_cache_length: 1024
    gates:
      max_pass_rate_drop_from_hf: 0.05
      min_correctness_agreement: 0.95
    ci:
      eligible: false
      lane: local_only
      notes: >
        Start with a sampled local run. ASR dependencies and calibrated
        per-family thresholds are required before enabling a CI gate.

  - id: dpg_bench_diffusion_image
    description: >
      Unified HF-to-TRTMC text-to-image parity evaluation on the official
      DPG-Bench dense prompts. The processed dataset retains every proposition
      question for visual review. Model manifests own image dimensions and
      inference steps, while per-model profiles own calibrated parity gates.
      Prompt alignment remains diagnostic because CLIP truncates dense prompts.
    user_contract: diffusion_image
    default_model_names:
      - flux-schnell-l0
      - flux-2-dev-l0
      - flux-2-dev-fp8-l0
      - pixart-sigma-1024
      - qwen-image
      - qwen-image-2512
      - z-image-turbo
    dataset:
      kind: diffusion_prompt_json
      default_path: /mnt/data/DPG-Bench/dpg_bench.json
      prompt_field: prompt
      subject_field: category
      question_field: questions
    selectors:
      task_strategies:
        - diffusion_media_generation
      runtime_strategies:
        - diffusion_flux
        - diffusion_pixart
        - diffusion_qwen_image
        - diffusion_zimage
      families:
        - flux
        - pixart
        - qwen_image
        - z_image
      exclude_model_names:
        - qwen-image-edit-2511
    generation:
      seed: 42
      video_num_frames: 1
      use_shared_initial_latents: true
    scoring:
      scorer: diffusion_image_clip_parity
    gates:
      min_pixel_mean: 0.15
      max_pixel_mean: 0.85
      min_pixel_std: 0.05
      # Semantic parity is mandatory even when family-specific pixel metrics
      # are intentionally tolerant of numerically divergent diffusion paths.
      min_trt_hf_image_clip_cosine: 0.85
    family_profiles:
      flux:
        gates:
          require_matching_initial_latents: 1
          psnr: 5.0
          ssim: 0.1
      pixart:
        gates:
          require_matching_initial_latents: 1
          psnr: 2.0
          ssim: -1.0
      qwen_image:
        gates:
          require_matching_initial_latents: 1
          psnr: 9.0
          ssim: 0.1
      z_image:
        gates:
          require_matching_initial_latents: 1
          psnr: 5.0
          ssim: 0.1
    model_profiles:
      pixart-sigma-1024:
        # Calibrated from the fixed DPG review slice: nine visually equivalent
        # pairs score >=0.905 image-CLIP, while the real count/layout divergence
        # scores 0.552 image-CLIP, 0.099 SSIM, and 6.21 dB PSNR.
        gates:
          require_matching_initial_latents: 1
          min_trt_hf_image_clip_cosine: 0.85
          ssim: 0.75
          psnr: 10.0
      qwen-image-2512:
        gates:
          psnr: 11.0
    ci:
      eligible: false
      lane: local_only
      notes: >
        P2021-only until the DPG-Bench scorecard is visually calibrated.

  - id: imagenette_image_classification
    description: >
      HF-to-TRTMC image-classification parity on Imagenette validation, a
      public ten-class subset of ImageNet-1k. The selected timm checkpoint was
      fine-tuned on ImageNet-1k at 224x224, so labels retain their original
      ImageNet-1k class IDs. Gold top-1 accuracy and backend agreement are
      reported separately.
    user_contract: image_classification
    default_model_names:
      - timm-vit-base-p16-224-augreg-in21k-ft-in1k
    dataset:
      kind: image_classification_json
      name: Imagenette 320 validation (ImageNet-1k subset)
      default_path: /mnt/data/Imagenette/imagenette2-320_task_eval.json
      image_field: image
      answer_field: label
      subject_field: synset
    selectors:
      task_strategies:
        - image_classification
      runtime_strategies:
        - timm_vit_image_classification
      families:
        - timm_vit
      user_contracts:
        - image_classification
    scoring:
      scorer: image_classification_parity
      task_metric: top1_accuracy
    gates:
      max_top1_accuracy_drop_from_hf: 0.01
      min_top1_agreement: 0.98
    ci:
      eligible: false
      lane: local_only

  - id: ade20k_semantic_segmentation
    description: >
      Semantic-segmentation parity and task quality on the ADE20K validation
      split used by the SegFormer checkpoint. Ground-truth labels are normalized
      to the checkpoint's 0..149 scene_parse_150 IDs with 255 as ignore.
    user_contract: segmentation_mask
    default_model_names:
      - segformer-b0-ade
    dataset:
      kind: semantic_segmentation_json
      name: ADE20K validation
      default_path: /mnt/data/ADE20K/ade20k_validation_task_eval.json
      image_field: image
      mask_field: mask
      subject_field: subset
      num_classes: 150
      ignore_index: 255
    selectors:
      task_strategies:
        - segmentation
      runtime_strategies:
        - segformer_segmentation
      families:
        - segformer
      user_contracts:
        - segmentation_mask
    scoring:
      scorer: semantic_segmentation_parity
      task_metric: mean_iou
    gates:
      min_backend_pixel_agreement: 0.98
      min_backend_mean_iou: 0.95
      max_mean_iou_drop_from_hf: 0.01
    ci:
      eligible: false
      lane: local_only

  - id: coco2017_prompted_segmentation
    description: >
      Unified prompted-segmentation parity on COCO 2017 validation. SAM uses a
      deterministic foreground point and its instance mask; SAM3 uses the COCO
      category text prompt and the exhaustive union of category instances.
      Backend mask agreement is gated while COCO ground-truth IoU is reported
      and guarded against regression from the HF reference.
    user_contract: prompted_mask
    default_model_names:
      - sam-vit-base
      - sam3
    dataset:
      kind: prompted_segmentation_json
      name: COCO 2017 validation prompted segmentation
      default_path: /mnt/data/COCO2017_prompted_segmentation/coco2017_prompted_segmentation.json
      image_field: image
      point_mask_field: instance_mask
      text_mask_field: category_mask
      subject_field: category
    selectors:
      task_strategies:
        - prompted_segmentation
      runtime_strategies:
        - sam_prompted_segmentation
        - sam3_prompted_segmentation
      families:
        - sam
        - sam3
      user_contracts:
        - prompted_mask
    scoring:
      scorer: prompted_segmentation_parity
      task_metric: mask_iou
    gates:
      # Match the reviewed SAM model-owned iou_per_prompt contract. The
      # aggregate COCO ground-truth guard below independently prevents a
      # numerically close but worse task result from passing.
      min_backend_mask_iou: 0.70
      max_ground_truth_iou_drop_from_hf: 0.05
    model_overrides:
      by_family:
        sam:
          prompt_mode: point
          ground_truth_mask_field: instance_mask
        sam3:
          prompt_mode: text
          ground_truth_mask_field: category_mask
    ci:
      eligible: false
      lane: local_only

  - id: stsbenchmark_encoder_embedding_parity
    description: >
      HF-versus-TRTMC vector parity for encoder-only NLP and text embedding
      models on the MTEB STSBenchmark test split. Base encoders compare their
      first-token representation; native embedding runtimes compare their
      pooled normalized embedding. Gold STS correlation is diagnostic only.
    user_contract: encoder_embedding_parity
    default_model_names:
      - albert-base
      - all-minilm-l6-v2
      - all-mpnet-base-v2
      - bert-base-uncased
      - bge-small-en-v1.5
      - camembert-base
      - convbert-base
      - deberta-base
      - distilbert-base-uncased
      - dpr-ctx-encoder
      - electra-base-discriminator
      - fnet-base
      - modernbert-base
      - nemotron-embed-vl-1b-v2
      - paraphrase-multilingual-minilm-l12-v2
      - roberta-base
      - roberta-large
      - xlm-roberta-base
      - xlnet-base
    dataset:
      kind: sts_pair_jsonl
      name: MTEB STSBenchmark test
      default_path: /mnt/data/STSBenchmark/stsbenchmark_test.jsonl
      subject_field: genre
    selectors:
      task_strategies:
        - encoder_only_nlp
        - embedding
      user_contracts:
        - representation_parity
        - embedding_vector
    reference:
      mode: hf_encoder_vector
    scoring:
      scorer: encoder_embedding_parity
      task_metric: sts_spearman
    gates:
      min_vector_cosine: 0.999
      min_vector_pass_rate: 1.0
      max_pair_cosine_abs_delta: 0.02
    model_profiles:
      # Match the model-owned, reviewed encoder E2E numerical contracts. These
      # models have architecture-specific FP16 sensitivity; task-eval does not
      # invent looser thresholds for them.
      albert-base:
        gates:
          min_vector_cosine: 0.99
      convbert-base:
        gates:
          min_vector_cosine: 0.95
      dpr-ctx-encoder:
        gates:
          min_vector_cosine: 0.99
      fnet-base:
        gates:
          min_vector_cosine: 0.6
          # FNet's reviewed 0.6 vector-cosine contract permits larger drift in
          # the second-order cosine between two independently drifted vectors.
          max_pair_cosine_abs_delta: 0.1
      modernbert-base:
        gates:
          min_vector_cosine: 0.995
      nemotron-embed-vl-1b-v2:
        gates:
          min_vector_cosine: 0.99
      xlnet-base:
        gates:
          min_vector_cosine: 0.95

  - id: beir_scifact_reranking
    description: >
      Per-query HF-versus-TRTMC ranking parity on the BEIR SciFact test split.
      Each sample ranks the same relevant passage and deterministic distractors;
      every low-agreement sample is retained in summary.json. Gold top-1
      retrieval accuracy is reported separately as a task-quality diagnostic.
    user_contract: ranking_order
    default_model_names:
      - nemotron-rerank-vl-1b-v2
    dataset:
      kind: reranking_json
      name: BEIR SciFact test reranking
      default_path: /mnt/data/BEIR_scifact_reranking/beir_scifact_reranking.json
      subject_field: subset
    selectors:
      model_names:
        - nemotron-rerank-vl-1b-v2
      task_strategies:
        - reranking
      runtime_strategies:
        - eagle_vlm_reranking
      families:
        - eagle_vlm
      user_contracts:
        - ranking_order
    scoring:
      scorer: reranking_parity
      task_metric: top1_retrieval_accuracy
    gates:
      # Match the model-owned E2E ranking contract per query.
      pairwise_ordering_agreement: 1.0
      kendall_tau: 1.0
      spearman_rho: 1.0
      score_correlation: 0.95
      min_sample_pass_rate: 1.0
    ci:
      eligible: false
      lane: local_only
      notes: >
        The limit-10 GB300 run is smoke coverage; use the complete processed
        SciFact test set for a stable task-quality score.

  - id: wmt14_de_en_elf_diffusion_text
    description: >
      HF-versus-TRTMC parity evaluation for ELF-B translation on WMT14
      German-to-English. Both backends consume shared diffusion sampling
      inputs, and agreement is gated on their corpus sacreBLEU delta.
    user_contract: diffusion_text_generation
    default_model_names:
      - elf-b-de-en-l0
    dataset:
      kind: conditional_text_jsonl
      name: WMT14 De-En test
      default_path: /mnt/data/WMT14_de_en/wmt14_de_en_test.jsonl
      source_field: input
      answer_field: output
      subject_field: subset
      sample_prefix: wmt14_de_en
    selectors:
      model_names:
        - elf-b-de-en-l0
      task_strategies:
        - diffusion_text_generation
      runtime_strategies:
        - elf_flow
      families:
        - elf_flow
    reference:
      mode: hf_elf_torch
      checkpoint: embedded-language-flows/ELF-B-de-en-torch
      config: src/configs/training_configs/train_de-en_ELF-B.yml
    generation:
      generation_mode: conditional
      sampling_method: ode
      num_sampling_steps: 64
      cfg_scale: 2.0
      self_cond_cfg_scale: 1.0
      sde_gamma: 0.0
      seed: 42
    scoring:
      scorer: diffusion_text_parity
      task_metric: sacrebleu
    gates:
      # The official PyTorch port allows <0.5 BLEU point sampling/numeric drift.
      # Token agreement remains diagnostic for divergence triage.
      max_corpus_bleu_abs_delta: 0.5
      min_shared_sampling_inputs_match_rate: 1.0
    ci:
      eligible: false
      lane: local_only
      notes: >
        GPU bundle builds and the complete 19-model matrix are validated
        outside premerge CI; small --limit slices are smoke tests only.
        P2021-only until the full WMT14 test baseline is reproduced and
        calibrated against the official ELF evaluator.

  - id: xsum_elf_diffusion_text
    description: >
      HF-versus-TRTMC parity evaluation for ELF-B summarization on XSum. Both
      backends consume shared diffusion sampling inputs, and agreement is
      gated on their mean ROUGE-1, ROUGE-2, and ROUGE-L F1 deltas.
    user_contract: diffusion_text_generation
    default_model_names:
      - elf-b-xsum-l0
    dataset:
      kind: conditional_text_jsonl
      name: XSum test
      default_path: /mnt/data/XSum/xsum_test.jsonl
      source_field: input
      answer_field: output
      subject_field: subset
      sample_prefix: xsum
    selectors:
      model_names:
        - elf-b-xsum-l0
      task_strategies:
        - diffusion_text_generation
      runtime_strategies:
        - elf_flow
      families:
        - elf_flow
    reference:
      mode: hf_elf_torch
      checkpoint: embedded-language-flows/ELF-B-xsum-torch
      config: src/configs/training_configs/train_xsum_ELF-B.yml
    generation:
      generation_mode: conditional
      sampling_method: ode
      num_sampling_steps: 64
      cfg_scale: 2.0
      self_cond_cfg_scale: 1.0
      sde_gamma: 0.0
      seed: 42
    scoring:
      scorer: diffusion_text_parity
      task_metric: rouge
    gates:
      # ROUGE is represented as a [0, 1] fraction here; 0.005 is 0.5 point.
      max_rouge1_abs_delta: 0.005
      max_rouge2_abs_delta: 0.005
      max_rouge_l_abs_delta: 0.005
      min_shared_sampling_inputs_match_rate: 1.0
    ci:
      eligible: false
      lane: local_only
      notes: >
        P2021-only until the full XSum test baseline is reproduced and
        calibrated against the official ELF evaluator.

  - id: openwebtext_elf_diffusion_text
    description: >
      HF-versus-TRTMC parity evaluation for unconditional ELF-B generation
      using shared 32-step SDE inputs. Both output sets are retokenized with
      GPT-2 Large, and agreement is gated on their generative-perplexity delta.
    user_contract: diffusion_text_generation
    default_model_names:
      - elf-b-owt-l0
    dataset:
      kind: unconditional_text_json
      name: ELF OpenWebText unconditional generation requests
      default_path: /mnt/data/OpenWebText/elf_owt_generation.json
    selectors:
      model_names:
        - elf-b-owt-l0
      task_strategies:
        - diffusion_text_generation
