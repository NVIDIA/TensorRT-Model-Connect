[build-system]
requires = [
    "apache-tvm-ffi==0.1.12",
    "conan-py-build==0.4.3",
    "torch>=2.6",
]
build-backend = "conan_py_build.build"

[project]
name = "tensorrt-model-connect"
version = "0.1.0"
description = "Build model checkpoints into native TensorRT .bundle artifacts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "ASSET_LICENSES.md"]
requires-python = ">=3.12"
dependencies = [
    "safetensors>=0.4",
    "numpy>=1.24",
    "ml_dtypes>=0.4",
    "onnx>=1.16",
    "transformers==5.2.0",
    "huggingface_hub>=0.23",
    "sentencepiece>=0.1.99",
    "cuda-python>=13.0.3,<14",
    "apache-tvm-ffi==0.1.12",
    "tensorrt==11.1.0.106",
    "PyYAML>=6.0",
]

[project.scripts]
trtmc-bench = "trtmc_benchmark.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "torch>=2.0", "jsonschema>=4.23,<5"]
cutedsl = ["nvidia-cutlass-dsl==4.7.1"]

[tool.conan-py-build.wheel]
packages = [
    "core/builder/tensorrt_model_connect",
    "apps/benchmark/trtmc_benchmark",
    "families",
]

[tool.conan-py-build.sdist]
include = [
    "CMakeLists.txt",
    "ASSET_LICENSES.md",
    "LICENSE",
    "NOTICE",
    "cmake",
    "conanfile.py",
    "core",
    "apps",
    "families",
    "requirements",
    "third_party",
    "examples",
    "tools/perf_matrix.py",
]
exclude = [
    "__pycache__",
    "*.pyc",
    "core/builder/tensorrt_model_connect/build",
    "core/builder/tensorrt_model_connect/*.egg-info",
]

[tool.pytest.ini_options]
testpaths = [
    "families",
    "core/builder/tests",
    "apps/benchmark/trtmc_benchmark/tests",
    "examples/audio_streaming/test_audio_streaming.py",
    "examples/models/cosmos3/dual_spark/test_cosmos3_dual_spark_source.py",
    "examples/models/nemotron_voicechat/full_duplex/test_voicechat_full_duplex_source.py",
    "tools/tests",
]
markers = [
    "gpu: tests requiring a CUDA GPU",
    "trt: tests requiring TensorRT and CUDA",
    "e2e: end-to-end tests requiring checkpoints and native runtime",
    "unit: unit tests that do not require a GPU",
]
